description: >-
  Customer.io uses platform subscription tiers (Essentials and Premium) priced
  primarily on the number of profiles (people plus objects) in the workspace,
  with bundled email volume and overage rates for additional profiles, emails,
  and AI credits. The same API surface (Track, App / Transactional, Pipelines)
  is available across paid plans; pricing is on the platform, not metered
  per-API-call. An Enterprise tier with custom pricing covers dedicated
  infrastructure and support.
notes: >-
  Prices captured from the public customer.io/pricing page and are subject to
  change; verify the live pricing page and per-region terms during
  reconciliation. Profile counts, bundled volumes, and overage rates can change.
