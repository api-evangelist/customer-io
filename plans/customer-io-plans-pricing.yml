- id: customerio-builder
  name: Builder
  type: pay-as-you-go
  currency: USD
  source: https://docs.customer.io/accounts/billing/builder-plan/
  description: >-
    Pay-as-you-go messaging infrastructure with no monthly fee and no trial
    period. Free to set up and test; you add funds starting at $10 when you are
    ready to send to real customers. Customer.io positions it explicitly for
    early-stage developers, mobile developers testing push, and AI-native
    builders driving the platform through the CLI or MCP server rather than a
    GUI. Transactional messages and one-time broadcasts only — behavioural
    automations require Essentials.
