  /v1/campaigns/{campaign_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: This API uses bearer authorization, requiring a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: campaign_id
      in: path
      required: true
      description: The ID of the campaign that you want to trigger or return information about.
      schema:
        type: integer
        example: 3
    - name: period
      in: query
      required: false
      description: The unit of time for your report.
      schema:
        type: string
        default: days
        enum:
        - hours
        - days
        - weeks
        - months
    - name: steps
      in: query
      required: false
      description: The number of periods you want to return. Defaults to the maximum available, or `12` if the period is in `months`. Maximums are 24 hours, 45 days, 12 weeks, or 121 months. Days start at 00:00 EST. Weeks start at 00:00 EST on Sunday. Months start at 00:00 EST on the 1st of the month.
      schema:
        type: integer
    - name: unique
      in: query
      required: false
      description: If true, the response contains only unique customer results, i.e. a customer who clicks a link twice is only counted once. If false, the response contains the total number of results without regard to uniqueness.
      schema:
        type: boolean
        default: false
    get:
      summary: Get campaign link metrics
      operationId: campaignLinkMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for link clicks within a campaign, both in total and in `series` periods (days, weeks, etc). `series` metrics are ordered oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.

        '
      tags:
      - Campaigns
      responses:
        '200':
          description: Returns an array of link objects. Each object represents a different link in your campaign and contains independent metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      x-scalar-ignore: true
                      type: object
                      properties:
                        link:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: The ID of the link.
                              example: 1234
                            href:
                              type: string
                              description: The link destination—a URL, mailto, etc.
                              example: https://docs.customer.io
                        metric:
                          type: object
                          description: Contains metrics for the link.
                          properties:
                            series:
                              type: object
                              properties:
                                clicked:
                                  type: array
                                  description: An array of results from oldest to newest, where each result indicates a period.
                                  items:
                                    type: integer
                                  example:
                                  - 1
                                  - 3
                                  - 5
                                  - 7
                                human_clicked:
                                  type: array
                                  description: An array of human click counts (clicks excluding machine clicks) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/journeys/metrics/analytics/#delivery-metrics).
                                  items:
                                    type: integer
                                  example:
                                  - 1
                                  - 2
                                  - 3
                                  - 4
                                machine_clicked:
                                  type: array
                                  description: An array of machine click counts (clicks attributed to bots or prefetching) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/journeys/metrics/analytics/#delivery-metrics).
                                  items:
                                    type: integer
                                  example:
                                  - 0
                                  - 1
                                  - 1
                                  - 2
        '400':
          description: The `campaignID` or `actionID` is invalid.
        '404':
          description: The campaign and/or action do not exist.
        '429':
