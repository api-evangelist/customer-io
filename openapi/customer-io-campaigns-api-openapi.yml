  /v1/campaigns/{campaign_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: This API uses bearer authorization, requiring a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: campaign_id
      in: path
      required: true
      description: The ID of the campaign that you want to trigger or return information about.
      schema:
        type: integer
        example: 3
    - name: version
      in: query
      required: true
      description: The version of the metrics API to use.
      schema:
        type: string
        enum:
        - '1'
        - '2'
        example: '2'
    - name: type
      in: query
      required: false
      description: The type of item you want to return metrics for. When empty, the response contains metrics for all possible types.
      schema:
        type: string
        enum:
        - email
        - webhook
        - twilio
        - whatsapp
        - slack
        - push
        - in_app
        - live_notification
    - name: res
      in: query
      description: '**Version 2 only.** Determines increment for metrics—hourly, daily, weekly, or monthly.'
      required: false
      schema:
        type: string
        enum:
        - hours
        - hourly
        - days
        - daily
        - weeks
        - weekly
        - months
        - monthly
    - name: tz
      in: query
      required: false
      description: '**Version 2 only.** The time zone for the metrics you are requesting. If you do not provide a time zone, we use EST. You must use the [region format](/journeys/send/timezones/example-timezones/#region-format).'
      schema:
        type: string
        example: America/New_York
    - name: start
      in: query
      required: false
      description: '**Version 2 only.** The unix timestamp for the beginning of your metrics.'
      schema:
        type: integer
        format: unix timestamp
        example: 1652718066
    - name: end
      in: query
      required: false
      description: '**Version 2 only.** The unix timestamp for the end of your metrics. Limited to 10 years from the `start` parameter.'
      schema:
        type: integer
        format: unix timestamp
    - name: period
      in: query
      required: false
      description: '**Version 1 only.** The unit of time for your report.'
      schema:
        type: string
        default: days
        enum:
        - hours
        - days
        - weeks
        - months
    - name: steps
      in: query
      required: false
      description: '**Version 1 only.** The number of periods you want to return. Defaults to the maximum available, or `12` if the period is in `months`. Maximums are 24 hours, 45 days, 12 weeks, or 120 months.'
      schema:
        type: integer
    get:
      summary: Get campaign metrics
      operationId: campaignMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of metrics for an individual campaign. The available parameters and response format depend on the version parameter that you use with this endpoint. **We strongly recommend that you use `version=2`** with this endpoint:


        **Version 2 (Recommended):**

        - Uses `res`, `tz`, `start`, and `end` parameters

        - Based on resolution and optionally, time zone, start and end times

        - Provides maximum flexibility for time-based metrics


        **Version 1 (Deprecated):**

        - Uses `period` and `steps` parameters

        - Based on steps (days, weeks, etc)

        - Returns metrics from oldest to newest (i.e. the 0-index for any result is the oldest step/period)

        - You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months)

        - For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made

        - `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`

        '
      tags:
      - Campaigns
