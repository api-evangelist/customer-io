      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request GET \\\n  --url https://api.customer.io/v1/design_studio/emails/{id}"
      - lang: Node + Native
        source: "const http = require(\"https\");\n\nconst options = {\n  \"method\": \"GET\",\n  \"hostname\": \"api.customer.io\",\n  \"port\": null,\n  \"path\": \"/v1/design_studio/emails/%7Bid%7D\",\n  \"headers\": {}\n};\n\nconst req = http.request(options, function (res) {\n  const chunks = [];\n\n  res.on(\"data\", function (chunk) {\n    chunks.push(chunk);\n  });\n\n  res.on(\"end\", function () {\n    const body = Buffer.concat(chunks);\n    console.log(body.toString());\n  });\n});\n\nreq.end();"
      - lang: Ruby + Native
        source: 'require ''uri''

          require ''net/http''

          require ''openssl''


          url = URI("https://api.customer.io/v1/design_studio/emails/%7Bid%7D")


          http = Net::HTTP.new(url.host, url.port)

          http.use_ssl = true

          http.verify_mode = OpenSSL::SSL::VERIFY_NONE


          request = Net::HTTP::Get.new(url)


          response = http.request(request)

          puts response.read_body'
      - lang: Python + Python3
        source: 'import http.client


          conn = http.client.HTTPSConnection("api.customer.io")


          conn.request("GET", "/v1/design_studio/emails/%7Bid%7D")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - lang: Go + Native
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"io/ioutil\"\n)\n\nfunc main() {\n\n\turl := \"https://api.customer.io/v1/design_studio/emails/%7Bid%7D\"\n\n\treq, _ := http.NewRequest(\"GET\", url, nil)\n\n\tres, _ := http.DefaultClient.Do(req)\n\n\tdefer res.Body.Close()\n\tbody, _ := ioutil.ReadAll(res.Body)\n\n\tfmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
    put:
      tags:
      - Design Studio
      summary: Update an email
      description: 'Update part of an email: an email''s name, template status, folder, content, envelope, or transformers. Note, this does not publish your email; if the email is connected to a workflow like a campaign, you still need to click publish to make the changes live.

        '
      operationId: updateEmail
      parameters:
      - name: id
        in: path
        required: true
        description: The UUID of the email.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        description: You must provide a body with at least one of the following properties. Omitting a field leaves it unchanged.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Display name of the email.
                is_template:
                  type: boolean
                  description: Whether the email is a reusable template.
                parent_folder_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: 'The UUID of the parent folder.


                    Omit if you want no change to where the folder or file is located. Include `null` to move it to your root directory. Or add the UUID of another folder to move it there.

                    '
                content:
                  type: object
                  description: The content of your email.
                  properties:
                    subject:
                      type: string
                      description: Email subject line.
                    preheader_text:
                      type: string
                      description: Preview text.
                    html:
                      type: string
                      description: HTML body.
                    amp:
                      type: string
                      description: AMP HTML body.
                    text:
                      type: string
                      description: Plain text body.
                envelope:
                  type: object
                  description: The envelope of your email, like from and to addresses.
                  properties:
                    from_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Sender identity ID. Must reference an existing identity. You can find this in *Workspace Settings > Email* under your From Addresses.

                        '
                    reply_to_id:
                      type:
                      - integer
                      - 'null'
                      format: int64
                      description: 'Reply-to identity ID. Must reference an existing identity from *Workspace Settings > Email* under your From Addresses.

                        '
                    recipient:
                      type: string
                      description: 'Recipient email address. Defaults to `{{customer.email}}`` if not set.

                        '
                    bcc:
                      type: string
                      description: BCC email address.
                    fake_bcc:
                      type: boolean
                      description: Whether to use fake BCC. Defaults to true if not provided.
                    headers:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                      description: 'Custom headers. Each item: { "name": "string", "value": "string" }.

                        '
                transformers:
                  type: object
                  description: Automate repetitive actions like removing white space and inlining CSS with [transformers](/journeys/design-studio/emails/code-editor/overview/#transformers).
                  properties:
                    url_parameters:
                      type: object
                      description: 'Appends query string parameters to all absolute URLs in `<a>` and VML elements. Useful for adding UTM tracking or other analytics parameters. Skips `mailto:`, `tel:`, and `sms:` links. Elements marked with `data-ignore-params` are excluded.

                        '
                      properties:
                        enabled:
                          type: boolean
                          description: 'Enable URL parameter injection.

                            '
                          default: false
                        parameters:
                          type: array
                          description: 'List of parameters to append to URLs.

                            '
                          default: []
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: 'Parameter name.

                                  '
                              value:
                                type: string
                                description: 'Parameter value. May contain template variables.

                                  '
                              url_encode:
                                type: boolean
                                description: 'URL-encode the value before appending it to the URL.

                                  '
                    css_variables:
                      type: object
                      description: 'Resolves CSS custom properties (`var(--name)`) into their computed values. Required for email clients that do not support CSS custom properties (most email clients). Variables declared in one `<style>` tag are available in subsequent `<style>` tags.

                        '
                      properties:
                        enabled:
                          type: boolean
                          description: 'Enable CSS variable resolution.

                            '
                          default: false
                        preserve:
                          type: boolean
                          description: 'Keep original custom property declarations (`--name: value`) alongside the resolved values.

                            '
                          default: false
                    css_inliner:
                      type: object
                      description: 'Moves CSS from `<style>` tags into inline `style` attributes on each element. Essential for email clients with limited `<style>` support (for example, older Gmail and some Outlook versions). Uses the `juice` library. Elements in `<style>` tags marked with `data-ignore-inlining` are skipped.

                        '
                      properties:
                        enabled:
                          type: boolean
                          description: 'Enable CSS inlining.

                            '
                          default: false
                        apply_style_tags:
                          type: boolean
                          description: 'Inline styles from `<style>` tags.

                            '
                          default: true
                        preserve_important:
                          type: boolean
                          description: 'Preserve `!important` declarations in inlined styles.

                            '
                          default: false
                        remove_style_tags:
                          type: boolean
                          description: 'Remove `<style>` tags after inlining their rules.

                            '
                          default: true
                        preserve_font_faces:
                          type: boolean
                          description: 'Keep `@font-face` rules in `<style>` (cannot be inlined).

                            '
                          default: true
                        preserve_media_queries:
                          type: boolean
                          description: 'Keep `@media` rules in `<style>` (cannot be inlined).

                            '
                          default: true
                        preserve_keyframes:
                          type: boolean
                          description: 'Keep `@keyframes` rules in `<style>` (cannot be inlined).

                            '
                          default: true
                        preserve_pseudos:
                          type: boolean
                          description: 'Keep pseudo-selector rules (for example, `:hover`) in `<style>` (cannot be inlined).

                            '
                          default: true
