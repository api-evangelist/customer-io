                                add_vml_alt_text:
                                  type: boolean
                                  description: 'Add `alt` attribute to VML elements (used by Outlook’s Word rendering engine), derived from the element’s text content.

                                    '
                                  default: true
                                add_empty_alt_to_images:
                                  type: boolean
                                  description: 'Add `alt=""` to `<img>` elements missing an `alt` attribute, preventing screen readers from reading the file name.

                                    '
                                  default: true
                                add_title_to_head:
                                  type: boolean
                                  description: 'Add a `<title>` tag to `<head>` using the email subject line (creates or replaces if empty).

                                    '
                                  default: true
                                remove_button_role_from_links:
                                  type: boolean
                                  description: 'Remove `role="button"` from `<a>` tags to restore proper link semantics for screen readers.

                                    '
                                  default: true
                                remove_zoom_meta_tag:
                                  type: boolean
                                  description: 'Remove viewport `<meta>` tags that restrict zoom (`user-scalable=0`, `user-scalable=no`, `maximum-scale=1`, or `maximum-scale=2`).

                                    '
                                  default: true
                            formatter:
                              type: object
                              description: 'Controls the output formatting of the final HTML. Only one mode (`prettify` or `minify`) can be active at a time. Set to `"none"` to skip formatting entirely.

                                '
                              properties:
                                type:
                                  type: string
                                  description: 'Formatting mode to apply.

                                    '
                                  enum:
                                  - none
                                  - prettify
                                  - minify
                                  default: none
                                prettify:
                                  type: object
                                  description: 'Options used when `type` is `"prettify"`. Produces human-readable, indented HTML output.

                                    '
                                  properties:
                                    indent_character:
                                      type: string
                                      description: 'Character used for indentation.

                                        '
                                      enum:
                                      - spaces
                                      - tabs
                                      default: spaces
                                    indent_size:
                                      type: integer
                                      description: 'Number of indent characters per level.

                                        '
                                      default: 2
                                    wrap_attributes:
                                      type: boolean
                                      description: 'Wrap HTML attributes onto separate lines (`force-expand-multiline` mode).

                                        '
                                      default: false
                                minify:
                                  type: object
                                  description: 'Options used when `type` is `"minify"`. Reduces file size by stripping whitespace and comments.

                                    '
                                  properties:
                                    remove_line_breaks:
                                      type: boolean
                                      description: 'Remove all line breaks from the output.

                                        '
                                      default: false
                                    line_length_limit:
                                      type: integer
                                      description: 'Maximum characters per line before inserting a line break.

                                        '
                                      default: 500
                                    remove_indentations:
                                      type: boolean
                                      description: 'Remove leading whitespace indentation.

                                        '
                                      default: true
                                    remove_html_comments:
                                      type: string
                                      description: 'HTML comment removal level. `"0"` keeps all comments, `"1"` removes non-conditional comments (preserves MSO conditionals like `<!--[if mso]>`), and `"2"` removes all comments including conditional.

                                        '
                                      enum:
                                      - '0'
                                      - '1'
                                      - '2'
                                      default: '0'
                                    remove_css_comments:
                                      type: boolean
                                      description: 'Remove CSS comments (`/* ... */`) from `<style>` blocks.

