    put:
      tags:
      - Design Studio
      summary: Update a folder
      description: 'Update part of a folder: the name and/or the folder it belongs to. If you move a folder, all files stay nested in the folder.

        '
      operationId: updateFolder
      parameters:
      - name: id
        in: path
        required: true
        description: The UUID of the folder.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Name of the folder. Cannot contain any of these characters: < > : " / \ | ? * .

                    '
                  minLength: 1
                  maxLength: 170
                parent_folder_id:
