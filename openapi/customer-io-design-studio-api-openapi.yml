                      properties:
                        enabled:
                          type: boolean
                          description: 'Enable accessibility fixes.

                            '
                          default: false
                        language:
                          type: string
                          description: 'Language code (for example, `"en"`, `"fr"`, or `"ar"`) used for `lang` and `dir` attributes.

                            '
                          default: ''
                        add_lang_to_html:
                          type: boolean
                          description: 'Add `lang` attribute to the `<html>` element if not already present.

                            '
                          default: true
                        add_dir_to_html:
                          type: boolean
                          description: 'Add `dir` attribute (`ltr`, `rtl`, or `auto`) to the `<html>` element if not already present.

                            '
                          default: true
                        add_lang_to_content:
                          type: boolean
                          description: 'Add `lang` attribute to direct children of `<body>`.

                            '
                          default: true
                        add_dir_to_content:
                          type: boolean
                          description: 'Add `dir` attribute to direct children of `<body>`.

                            '
                          default: true
                        add_role_to_tables:
                          type: boolean
                          description: 'Add `role="presentation"` to all `<table>` elements without an existing `role`, so screen readers skip table semantics for layout tables.

                            '
                          default: true
                        add_vml_alt_text:
                          type: boolean
                          description: 'Add `alt` attribute to VML elements (used by Outlook’s Word rendering engine), derived from the element’s text content.

                            '
                          default: true
                        add_empty_alt_to_images:
                          type: boolean
                          description: 'Add `alt=""` to `<img>` elements missing an `alt` attribute, preventing screen readers from reading the file name.

                            '
                          default: true
                        add_title_to_head:
                          type: boolean
                          description: 'Add a `<title>` tag to `<head>` using the email subject line (creates or replaces if empty).

                            '
                          default: true
                        remove_button_role_from_links:
                          type: boolean
                          description: 'Remove `role="button"` from `<a>` tags to restore proper link semantics for screen readers.

                            '
                          default: true
                        remove_zoom_meta_tag:
                          type: boolean
                          description: 'Remove viewport `<meta>` tags that restrict zoom (`user-scalable=0`, `user-scalable=no`, `maximum-scale=1`, or `maximum-scale=2`).

                            '
                          default: true
                    formatter:
                      type: object
                      description: 'Controls the output formatting of the final HTML. Only one mode (`prettify` or `minify`) can be active at a time. Set to `"none"` to skip formatting entirely.

                        '
                      properties:
                        type:
                          type: string
                          description: 'Formatting mode to apply.

                            '
                          enum:
                          - none
                          - prettify
                          - minify
                          default: none
