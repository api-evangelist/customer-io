components:
  schemas:
    updateEmailContent:
      title: Email
      description: 'Update the contents of an email newsletter variant. You can set the sender with `from_id`. If you don''t provide it, the existing sender is preserved.

        '
      allOf:
      - type: object
        properties:
          type:
            x-scalar-ignore: true
            description: Channel type for a newsletter or newsletter content variant.
            type: string
            enum:
            - email
            - webhook
            - twilio
            - push
            - in_app
            - inbox
            readOnly: true
            example: email
          deduplicate_id:
            x-scalar-ignore: true
            type: string
            readOnly: true
            description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Campaigns, Deliveries, Exports, Identities, Newsletters, Segments, and Templates), and the timestamp is the last time the object was updated.
            example: 15:1492548073
      - type: object
        properties:
          type:
            type: string
            enum:
            - email
            readOnly: true
          body:
            type: string
            description: The HTML body of the email. You cannot modify the body if you created the newsletter with Design Studio or the drag-and-drop editor.
          body_amp:
            x-scalar-ignore: true
            type: string
            description: AMP-enabled content for your email. If a recipient's email client doesn't support AMP, they receive your `body` content instead. Make sure you're [set up to send AMP](/journeys/channels/email/layouts/amp-for-email/) first.
          body_plain:
            x-scalar-ignore: true
            type: string
            description: By default, your workspace generates a plaintext version of your message body for each delivery. Use this key to override the default plain text body.
          subject:
            x-scalar-ignore: true
            type: string
            description: The subject line for an `email` action.
            example: Did you get that thing I sent you?
          preheader_text:
            x-scalar-ignore: true
            type: string
            description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

              '
          from_id:
            x-scalar-ignore: true
            type: integer
            description: The identifier of the `from` address, commonly known as the "sender". Use [List sender identities](#tag/sender-identities/listSenders) to find valid IDs.
            example: 1
          reply_to_id:
            x-scalar-ignore: true
            type:
            - integer
            - 'null'
            description: The identifier for the `reply_to` address, if applicable. Use [List sender identities](#tag/sender-identities/listSenders) to find valid IDs.
            example: 38
          recipient:
            type: string
            description: The recipient address for the newsletter. By default, it's `{{customer.email}}`.
    updateWebhookContent:
      title: Webhook
      description: Update the contents of a webhook newsletter variant.
      allOf:
      - type: object
        properties:
          type:
            x-scalar-ignore: true
            description: Channel type for a newsletter or newsletter content variant.
            type: string
            enum:
            - email
            - webhook
            - twilio
            - push
            - in_app
            - inbox
            readOnly: true
            example: email
          deduplicate_id:
            x-scalar-ignore: true
            type: string
            readOnly: true
            description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Campaigns, Deliveries, Exports, Identities, Newsletters, Segments, and Templates), and the timestamp is the last time the object was updated.
            example: 15:1492548073
      - type: object
        properties:
          type:
            type: string
            enum:
            - webhook
            readOnly: true
          body:
            type: string
            description: The body content of the webhook request.
            example: '{"channel":"#marketing","text":"Newsletter sent to {{ customer.email }}"}'
          headers:
            x-scalar-ignore: true
            description: Headers you want to add or update. Names and values must be strings, with no non-ASCII characters or spaces. You can't overwrite reserved headers.
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the header.
                value:
                  type: string
                  description: The value of the header.
              example:
              - name: X-Mailgun-Tag
                value: my-cool-tag
    updateInboxContent:
      title: Inbox message
      description: Update the contents of an inbox message newsletter variant.
      allOf:
      - type: object
        properties:
          type:
            x-scalar-ignore: true
            description: Channel type for a newsletter or newsletter content variant.
            type: string
            enum:
            - email
            - webhook
            - twilio
            - push
            - in_app
            - inbox
            readOnly: true
            example: email
          deduplicate_id:
            x-scalar-ignore: true
            type: string
            readOnly: true
            description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Campaigns, Deliveries, Exports, Identities, Newsletters, Segments, and Templates), and the timestamp is the last time the object was updated.
            example: 15:1492548073
      - type: object
        properties:
          type:
            type: string
            enum:
            - inbox
            readOnly: true
          body_json:
            type: string
            description: 'JSON body content for the inbox message, as a stringified JSON object. The fields you include depend on how you [set up your inbox](/journeys/channels/in-app/inbox/setup/):

              - `topics`—array, topics your audience can filter by in their inbox

              - `type`—string, context that helps render the inbox message

              - `properties`—object, your message info like the title, body, link, and image

              - `expiration`—object; if omitted, the message expires after 30 days. Otherwise set `type` (`relative` or `absolute`), `unit` (`seconds`, `minutes`, `hours`, or `days`; relative only), and `value` (number of units, or a unix timestamp if absolute)

              '
            example: '{"topics": ["general", "updates"], "type": "notification", "expiration": {"type": "relative", "value": "30", "unit": "days"}, "properties": {"title": "Welcome!", "message": "Thanks for signing up", "link": "https://customer.io"}}'
    updateSmsContent:
