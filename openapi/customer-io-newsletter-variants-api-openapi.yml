  /v1/newsletters/{newsletter_id}/language:
    servers:
    - url: https://api.customer.io
      description: This API uses bearer authorization, requiring a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: newsletter_id
      in: path
      required: true
      description: The identifier of a newsletter.
      schema:
        type: integer
    post:
      summary: Add a translation to a newsletter
      operationId: createNewsletterLanguageVariant
      security:
      - Bearer-Auth: []
      description: 'Add a language variant to a newsletter.


        If you omit optional fields, the values from the default template are copied over untranslated. Make sure you translate all aspects of your default template.


        You can''t add language variants to a newsletter that has already been sent. You can''t manage emails created with the drag-and-drop editor or Design Studio via this endpoint—use [Create an email translation](#tag/design-studio/createEmailTranslation) for Design Studio emails.


        If the newsletter has A/B tests, use [Add a translation to a newsletter test group](#operation/createNewsletterTestLanguageVariant) instead.

        '
      tags:
      - Newsletter Variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Add a language variant to a newsletter. The payload the endpoint accepts depends on the parent newsletter's channel type.
              oneOf:
              - title: Email
                description: Add a language variant to an email newsletter. Requires `language`, `subject`, and `body`.
                allOf:
                - type: object
                  required:
                  - language
                  properties:
                    language:
                      type: string
                      description: The [language tag](/journeys/channels/localization/attribute/#supported-languages) for the new variant, e.g. `es`, `fr`, `de`.
                      example: es
                - type: object
                  required:
                  - subject
                  - body
                  properties:
                    subject:
                      type: string
                      description: The subject line for the variant.
                      example: ¡Hola, {{ customer.name }}!
                    preheader_text:
                      type: string
                      description: The preheader text for the email variant.
                      example: Mira nuestras últimas novedades
                    body:
                      type: string
                      description: The HTML body content for the variant.
                      example: <html><body><h1>¡Hola!</h1></body></html>
                    body_plain:
                      type: string
                      description: The plaintext body content for the variant.
                    body_amp:
                      type: string
                      description: The AMP HTML body content for the variant.
              - title: SMS
                description: Add a language variant to an SMS newsletter. Requires `language` and `body`.
                allOf:
                - type: object
                  required:
                  - language
                  properties:
                    language:
                      type: string
                      description: The [language tag](/journeys/channels/localization/attribute/#supported-languages) for the new variant, e.g. `es`, `fr`, `de`.
                      example: es
                - type: object
                  required:
                  - body
                  properties:
                    body:
                      type: string
                      description: The body content of the SMS message.
                      example: ¡Hola {{ customer.first_name }}! Tu pedido ha sido enviado.
              - title: Push
                description: Add a language variant to a push notification newsletter. Requires `language` and at least one of `subject` or `body`.
                allOf:
                - type: object
                  required:
                  - language
                  properties:
                    language:
                      type: string
                      description: The [language tag](/journeys/channels/localization/attribute/#supported-languages) for the new variant, e.g. `es`, `fr`, `de`.
                      example: es
                - type: object
                  properties:
                    subject:
                      type: string
                      description: The title of the push notification.
                      example: ¡Oferta por tiempo limitado!
                    body:
                      type: string
                      description: The body content of the push notification.
                      example: Obtén 30% de descuento en todo.
              - title: Webhook
                description: Add a language variant to a webhook newsletter. Requires `language` and `body`.
                allOf:
                - type: object
                  required:
                  - language
                  properties:
                    language:
                      type: string
                      description: The [language tag](/journeys/channels/localization/attribute/#supported-languages) for the new variant, e.g. `es`, `fr`, `de`.
                      example: es
                - type: object
                  required:
                  - body
                  properties:
                    body:
                      type: string
                      description: The body content of the webhook request.
                      example: '{"channel":"#marketing","text":"Boletín enviado a {{ customer.email }}"}'
              - title: Inbox message
                description: Add a language variant to an inbox message newsletter. Requires `language` and `body_json`.
                allOf:
                - type: object
                  required:
                  - language
                  properties:
                    language:
                      type: string
                      description: The [language tag](/journeys/channels/localization/attribute/#supported-languages) for the new variant, e.g. `es`, `fr`, `de`.
                      example: es
                - type: object
                  required:
                  - body_json
                  properties:
                    body_json:
                      type: string
                      description: JSON body content for the inbox message variant. Learn more about [message settings](/journeys/channels/in-app/inbox/send-inbox/) in our docs.
                      example: '{"topics": ["general", "updates"], "type": "notification", "expiration": {"type": "relative", "value": "30", "unit": "days"}, "properties": {"title": "Welcome!", "message": "Thanks for signing up", "link": "https://customer.io"}}'
      responses:
        '200':
          description: Returns the updated newsletter, including new `content_ids`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    x-scalar-ignore: true
                    type: object
                    properties:
                      id:
                        x-scalar-ignore: true
                        description: The identifier for a newsletter.
                        type: integer
                        example: 10
                      deduplicate_id:
                        x-scalar-ignore: true
                        type: string
                        readOnly: true
                        description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Campaigns, Deliveries, Exports, Identities, Newsletters, Segments, and Templates), and the timestamp is the last time the object was updated.
                        example: 15:1492548073
                      content_ids:
                        type: array
                        description: A list of message variants in a newsletter, where a variant is a translation or A/B test.
                        items:
                          type: integer
                      name:
                        type: string
                        description: The name of the newsletter. Must be 190 characters or less.
                        readOnly: true
                      sent_at:
                        type: integer
                        format: unix timestamp
                        description: The last time the newsletter was sent.
                      created:
                        x-scalar-ignore: true
                        type: integer
                        format: unix timestamp
                        description: The date time when the referenced ID was created.
                        example: 1552341937
                        readOnly: true
                      updated:
                        x-scalar-ignore: true
                        type: integer
                        format: unix timestamp
                        description: The date time when the referenced ID was last updated.
                        example: 1552341937
                        readOnly: true
                      type:
                        x-scalar-ignore: true
                        description: Channel type for a newsletter or newsletter content variant.
                        type: string
                        enum:
                        - email
                        - webhook
                        - twilio
                        - push
                        - in_app
                        - inbox
                        readOnly: true
                        example: email
                      tags:
                        type: array
                        description: An array of tags associated with the newsletter.
                        items:
                          type: string
                      recipient_segment_ids:
                        description: If the recipient conditions included segments, this returns a list of those segment ids.
                        type: array
                        items:
                          type: integer
                      subscription_topic_id:
                        type: integer
                        description: If you enabled a [subscription center](/journeys/channels/subscriptions/center/) on your workspace, this returns the id of the subscription preference you set.
                    example:
                      id: 128275
                      deduplicate_id: 128275:1484870424
                      type: email
                      content_ids:
                      - 45
                      name: Weekly Product Update
                      sent_at: 1481653929
                      created: 1481653919
                      updated: 1481653929
                      recipient_segment_ids:
                      - 42
                      - 99
                      tags:
                      - Product Updates
                      subscription_topic_id: 5
        '400':
          description: 'The request is invalid. Possible reasons include: the newsletter has already been sent, the newsletter has multiple test groups ([add a translation to a test group](#tag/newsletter-variants/createNewsletterTestLanguageVariant) instead), or the newsletter uses Design Studio or drag-and-drop editors.

