openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Newsletter Variants API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Newsletter Variants
  x-displayName: One-time send variants
  description: 'A one-time send variant is a translation or an A/B test. You can create, update, or delete variants in one-time sends from these endpoints. You can also create a new A/B test group.


    If your one-time sends include assets like images or PDFs, host them in your workspace''s assets or at another public URL, and include the URL in your message content.'
paths:
  /v1/newsletters/{newsletter_id}/contents:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    get:
      summary: List one-time send variants
      operationId: listNewsletterVariants
      security:
      - Bearer-Auth: []
      description: Returns a one-time send's content variants (a one-time send is referred to as a "newsletter" in our APIs)—these are either different languages in a multi-language one-time send or A/B tests.
      tags:
      - Newsletter Variants
      responses:
        '200':
          description: Returns one-time send `content_id`s. Each object represents an individual variant of this one-time send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    items:
                      $ref: '#/components/schemas/getContentObject'
        '404':
          description: The one-time send you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/contents/{content_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/content_id'
    get:
      summary: Get a one-time send variant
      operationId: getNewsletterVariant
      security:
      - Bearer-Auth: []
      description: Returns information about a specific variant of a one-time send (referred to as a "newsletter" in our APIs), where a variant is either a language in a multi-language one-time send or a part of an A/B test.
      tags:
      - Newsletter Variants
      responses:
        '200':
          description: Returns one-time send `content`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update a one-time send variant
      operationId: updateNewsletterVariant
      security:
      - Bearer-Auth: []
      description: 'Update the content of a one-time send (referred to as a "newsletter" in our APIs): the default message, a test variant in an A/B test group, or a translation.


        For an email, you can also update the envelope: from address, subject line, etc.


        **NOTE**: You cannot manage content made with the drag-and-drop editor via API, and you cannot use this endpoint to update Design Studio emails. You can, however, manage Design Studio content with other endpoints. You also can''t update in-app or inbox message content through the API—use the message editor instead.'
      tags:
      - Newsletter Variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateContentRequest'
      responses:
        '200':
          description: Returns the updated one-time send variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '400':
          description: The request is malformed.
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/language:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    post:
      summary: Add a translation to a one-time send
      operationId: createNewsletterLanguageVariant
      security:
      - Bearer-Auth: []
      description: 'Add a language variant to a one-time send (referred to as a "newsletter" in our APIs).


        If you omit optional fields, the values from the default template are copied over untranslated. Make sure you translate all aspects of your default template.


        You can''t add language variants to a one-time send that has already been sent. You can''t manage emails created with the drag-and-drop editor or Design Studio via this endpoint—use Create an email translation for Design Studio emails.


        If it has A/B tests, use Add a translation to a one-time send test group instead.'
      tags:
      - Newsletter Variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createLanguageVariantRequest'
      responses:
        '200':
          description: Returns the updated one-time send, including new `content_ids`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    $ref: '#/components/schemas/newsletterObject'
        '400':
          description: 'The request is invalid. Possible reasons include: the one-time send has already been sent, the one-time send has multiple test groups ([add a translation to a test group](/integrations/api/app/tag/newsletter-variants/createNewsletterTestLanguageVariant/) instead), or the one-time send uses Design Studio or drag-and-drop editors.

            '
        '404':
          description: The one-time send does not exist.
        '422':
          description: 'Validation error. Possible reasons: `language` is missing, required content fields are missing for the channel type, or the language variant already exists.

            '
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/language/{language}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/language-2'
    get:
      summary: Get a one-time send translation
      operationId: getNewsletterVariantTranslation
      security:
      - Bearer-Auth: []
      description: Returns information about a specific language variant of a one-time send (referred to as a "newsletter" in our APIs). If it includes A/B tests, use Get a translation in a one-time send test group.
      tags:
      - Newsletter Variants
      responses:
        '200':
          description: Returns one-time send `content` for a language variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '400':
          description: The `language` does not exist.
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update a translation of a one-time send
      operationId: updateNewsletterVariantTranslation
      security:
      - Bearer-Auth: []
      description: 'Update the translation of a one-time send (referred to as a "newsletter" in our APIs) variant. If it includes A/B tests, use Update a translation in a one-time send test group.


        **NOTE**: You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead. You also can''t update in-app or inbox message content through the API—change it in the message editor.'
      tags:
      - Newsletter Variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateContentRequest'
      responses:
        '200':
          description: Returns the updated one-time send variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '400':
          description: The `language` does not exist.
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    delete:
      summary: Delete a translation of a one-time send
      operationId: deleteNewsletterLanguageVariant
      security:
      - Bearer-Auth: []
      description: 'Delete a specific language variant of a one-time send (referred to as a "newsletter" in our APIs). You cannot delete the default language variant. If it has already been sent, you cannot delete language variants.


        If it includes A/B tests, use Delete a translation in a one-time send test group.'
      tags:
      - Newsletter Variants
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          description: You cannot delete the default language variant, or the one-time send has already been sent.
        '404':
          description: The one-time send or language variant does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/test_groups:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    get:
      summary: List a one-time send's A/B test groups
      operationId: getNewsletterTestGroups
      security:
      - Bearer-Auth: []
      description: Returns information about each test group in a one-time send (referred to as a "newsletter" in our APIs), including content ids for each group.
      tags:
      - Newsletter Variants
      responses:
        '200':
          description: Returns metadata for each test group in a one-time send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_groups:
                    type: array
                    description: Each object represents one of the test groups.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The ID of the A/B test group.
                        name:
                          type: string
                          description: The name of the A/B test group.
                        label:
                          type: string
                          description: The name of the variant.
                        winner:
                          type: boolean
                          description: Whether this variant is the winner of the test.
                        content_ids:
                          description: A list of content_ids for each variant in the test group.
                          type: array
                          items:
                            type: string
                example:
                  test_groups:
                  - id: 0
                    name: A
                    label: test 1
                    winner: false
                    content_ids:
                    - 25
                    - 26
                  - id: 2
                    name: B
                    label: test 2
                    winner: false
                    content_ids:
                    - 27
                    - 28
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    post:
      summary: Create an A/B test group for a one-time send
      operationId: createNewsletterTestGroup
      security:
      - Bearer-Auth: []
      description: 'Create a new A/B test group for a one-time send (referred to as a "newsletter" in our APIs). This duplicates the existing one-time send''s content into a new test group, allowing you to test different versions of your message.


        This endpoint does not require a request body. The new test group is created as a copy of the existing content.


        You cannot add test groups to a one-time send that has already been sent.'
      tags:
      - Newsletter Variants
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: No request body is required.
      responses:
        '200':
          description: Returns the updated one-time send with the new test group's content IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    $ref: '#/components/schemas/newsletterObject'
        '400':
          description: The one-time send has already been sent. You cannot add test groups to a sent one-time send.
        '404':
          description: The one-time send does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/test_group/{test_group_id}/language:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - name: test_group_id
      in: path
      description: The ID of the A/B test group.
      required: true
      schema:
        type: string
    post:
      summary: Add a translation to a one-time send test group
      operationId: createNewsletterTestLanguageVariant
      security:
      - Bearer-Auth: []
      description: 'Add a language variant to a specific A/B test group in a one-time send (referred to as a "newsletter" in our APIs). The new variant is a copy of the default template in the test group with the content you provide. The payload the endpoint accepts depends on the parent one-time send''s channel type: if it''s an email, the payload will be an email variant; if it''s an SMS, the payload will be an SMS variant.


        You cannot add language variants to a one-time send that has already been sent, or to one-time sends created with the drag-and-drop editor or Design Studio.'
      tags:
      - Newsletter Variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createLanguageVariantRequest'
      responses:
        '200':
          description: Returns the updated one-time send, including new `content_ids`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    $ref: '#/components/schemas/newsletterObject'
        '400':
          description: 'The request is invalid. Possible reasons include: the one-time send has already been sent, the test group does not exist, or the one-time send uses Design Studio or drag-and-drop editor.

            '
        '404':
          description: The one-time send does not exist.
        '422':
          description: 'Validation error. Possible reasons: `language` is missing, required content fields are missing for the channel type, or the language variant already exists.

            '
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/test_group/{test_group_id}/language/{language}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - name: test_group_id
      in: path
      description: The ID of the A/B test group.
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/language-2'
    get:
      summary: Get a translation in a one-time send test group
      operationId: getNewsletterVariantTranslationTest
      security:
      - Bearer-Auth: []
      description: Returns information about a specific language variant of a one-time send (referred to as a "newsletter" in our APIs) in an A/B test group. You can retrieve `test_group_ids` from List a one-time send's A/B test groups.
      tags:
      - Newsletter Variants
      responses:
        '200':
          description: Returns one-time send `content` for a language variant in a test group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '400':
          description: The `language` does not exist.
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update a translation in a one-time send test group
      operationId: updateNewsletterTestTranslation
      security:
      - Bearer-Auth: []
      description: 'Update the translation of a one-time send (referred to as a "newsletter" in our APIs) variant in an A/B test. You can retrieve a list of `test_group_ids` from List a one-time send''s A/B test groups.


        **NOTE**: You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead. You also can''t update in-app or inbox message content through the API—change it in the message editor.'
      tags:
      - Newsletter Variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateContentRequest'
      responses:
        '200':
          description: Returns the updated one-time send variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getContentObject'
        '400':
          description: The `language` does not exist.
        '404':
          description: The one-time send or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
    delete:
      summary: Delete a translation in a one-time send test group
      operationId: deleteNewsletterTestLanguageVariant
      security:
      - Bearer-Auth: []
      description: 'Delete a specific language variant of a one-time send (referred to as a "newsletter" in our APIs) in an A/B test group. You cannot delete the default language variant. If it has already been sent, you cannot delete language variants.


        You can retrieve a list of `test_group_ids` from List A/B test groups in a one-time send.'
      tags:
      - Newsletter Variants
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          description: You cannot delete the default language variant, or the one-time send has already been sent. It may also mean the `test_group_id` does not exist.
        '404':
          description: The one-time send or language variant does not exist.
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    reply_to:
      x-scalar-ignore: true
      type: string
      description: The address that receives replies for the message, if applicable.
      readOnly: true
      example: replyto@example.com
    preprocessor:
      x-scalar-ignore: true
      type: string
      description: If CSS pre-processing is enabled, this key is populated with `premailer`. Note, Juice replaced Premailer as the pre-processor, but you will only see `premailer` as the value.
      enum:
      - premailer
      readOnly: true
    createWebhookLanguageVariant:
      x-scalar-ignore: true
      title: Webhook
      description: Add a language variant to a webhook one-time send. Requires `language` and `body`.
      allOf:
      - $ref: '#/components/schemas/createLanguageVariantCommon'
      - type: object
        required:
        - body
        properties:
          body:
            type: string
            description: The body content of the webhook request.
            example: '{"channel":"#marketing","text":"Boletín enviado a {{ customer.email }}"}'
    updateContentRequest:
      x-scalar-ignore: true
      oneOf:
      - $ref: '#/components/schemas/updateEmailContent'
      - $ref: '#/components/schemas/updateSmsContent'
      - $ref: '#/components/schemas/updatePushContent'
      - $ref: '#/components/schemas/updateWebhookContent'
      - $ref: '#/components/schemas/updateInAppContent'
      - $ref: '#/components/schemas/updateInboxContent'
      discriminator:
        propertyName: type
    preheader_text:
      x-scalar-ignore: true
      type: string
      description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

        '
    language:
      x-scalar-ignore: true
      type: string
      description: The language variant for your message. If you don't use our [localization feature](/journeys/channels/localization/getting-started), or this is the default message, this value is an empty string.
      example: fr
      readOnly: true
    from:
      x-scalar-ignore: true
      type: string
      description: The address that the message is from, relevant if the action `type` is `email`.
      readOnly: true
      example: sentFrom@example.com
    body_amp:
      x-scalar-ignore: true
      type: string
      description: AMP-enabled content for your email. If a recipient's email client doesn't support AMP, they receive your `body` content instead. Make sure you're [set up to send AMP](/journeys/channels/email/layouts/amp-for-email/) first.
    subject:
      x-scalar-ignore: true
      type: string
      description: The subject line for an `email` action.
      example: Did you get that thing I sent you?
    updatePushContent:
      x-scalar-ignore: true
      title: Push
      description: Update the contents of a push notification one-time send variant.
      allOf:
      - $ref: '#/components/schemas/updateContentCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - push
            readOnly: true
          subject:
            type: string
            description: The title of the push notification.
            example: 24-hour flash sale!
          body:
            type: string
            description: The body of the push notification.
            example: Get 30% off everything. Tap to shop now.
    updateWebhookContent:
      x-scalar-ignore: true
      title: Webhook
      description: Update the contents of a webhook one-time send variant.
      allOf:
      - $ref: '#/components/schemas/updateContentCommon'
      - type: object
        properties:
          type:
            type: string
            enum:
            - webhook
            readOnly: true
          body:
            type: string
            description: The body content of the webhook request.
            example: '{"channel":"#marketing","text":"One-time send sent to {{ customer.email }}"}'
          headers:
            $ref: '#/components/schemas/update_headers'
    from_id:
      x-scalar-ignore: true
      type: integer
      description: The identifier of the `from` address, commonly known as the "sender". Use [List sender identities](/integrations/api/app/tag/sender-identities/listSenders/) to find valid IDs.
      example: 1
    appApiError:
      x-scalar-ignore: true
      type: object
      description: An array/list of failures where each entry is a separate failure reason.
      required:
      - errors
      properties:
        errors:
          type: array
          description: One entry for each reason the request failed.
          items:
            type: object
            required:
            - detail
            - status
            properties:
              detail:
                type: string
                description: What went wrong, in plain text. Most messages end with a support reference you can use if you need to contact support.
                example: bad request (reference a1b2c3)
              status:
                type: string
                description: The HTTP status code as a string.
                example: '400'
              code:
                type: string
                description: A stable identifier for the failure, on the errors that carry one. Use this rather than the text in `detail` if you need to identify the error programmatically.
                example: invalid_credentials
              source:
                type: object
                description: The part of the request that the error refers to.
                properties:
                  pointer:
                    type: string
                    description: A JSON pointer to the part of the request body that the error refers to.
                    example: /data/attributes/email
              meta:
                type: object
                additionalProperties: true
                description: Extra context (if available).
    updateInAppContent:
      x-scalar-ignore: true
      title: In-App
      description: 'You can''t update in-app message content through the API—you can only set it when you [create the message](/integrations/api/app/tag/newsletters/createNewsletter/). Use the message editor to update the content of your message.

        '
      allOf:
      - $ref: '#/components/schemas/updateContentCommon'
