openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Newsletter Metrics API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Newsletter Metrics
  x-displayName: One-time send metrics
  description: 'One-time send metrics include metrics for translations, A/B tests, and links.


    These endpoints return information about one-time send metrics including metrics for translations and A/B tests. You can update variants in one-time sends from these endpoints, but you must perform all other create, update, and/or delete operations through the UI.'
paths:
  /v1/newsletters/{newsletter_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/newsletterMetricsType'
    get:
      summary: Get one-time send metrics
      operationId: getNewsletterMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of metrics for an individual one-time send (referred to as a "newsletter" in our APIs) in `steps` (days, weeks, etc). We return metrics from oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Newsletter Metrics
      responses:
        '200':
          description: Returns one-time send metrics by `series` (with increments are based on the `period` and `step` in your request) for the one-time send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: object
                    properties:
                      type:
                        $ref: '#/components/schemas/newsletterMessageType'
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
        '404':
          description: The one-time send you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/unique'
    get:
      summary: Get click metrics for one-time send links
      operationId: getNewsletterLinks
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for link clicks within a one-time send (referred to as a "newsletter" in our APIs), both in total and in `series` periods (days, weeks, etc). `series` metrics are ordered oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Newsletter Metrics
      responses:
        '200':
          description: Returns an array of link objects. Each object represents a different link in your one-time send and contains independent metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '404':
          description: The one-time send you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/metric'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      summary: Get delivery data for a one-time send
      operationId: getNewsletterMsgMeta
      security:
      - Bearer-Auth: []
      description: 'Returns information about the "deliveries" (rendered messages) sent to your recipients for a specific one-time send (referred to as a "newsletter" in our APIs).


        Provide query parameters to refine the metrics you want to return. Use `start_ts` and `end_ts` to find messages within a time range. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return up to 6 months of results beginning with the first delivery generated from the one-time send. If your `start_ts` and `end_ts` range is more than 12 months, we''ll return 12 months of data from the most recent timestamp in your request.


        Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      tags:
      - Newsletter Metrics
      responses:
        '200':
          description: Returns an array of `messages`. Each object represents a different delivery to a recipient.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/newsletterMessageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    messages:
                    - id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=
                      deduplicate_id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=:1609957872
                      msg_template_id: 178
                      action_id: null
                      customer_id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                      recipient: person@email.com
                      subject: Did you get that thing I sent you?
                      metrics:
                        delivered: 1609957872
                        sent: 1609957832
                      created: 1609957805
                      failure_message: null
                      newsletter_id: 72
                      content_id: 178
                      campaign_id: null
                      broadcast_id: null
                      type: email
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    messages:
                    - id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 87
                      action_id: null
                      customer_id: user_2048
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: 72
                      content_id: null
                      campaign_id: null
                      broadcast_id: null
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '404':
          description: The one-time send you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/contents/{content_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/content_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/newsletterMetricsType'
    get:
      summary: Get metrics for a test or translation variant of a one-time send
      operationId: getVariantMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns a metrics for an individual one-time send (referred to as a "newsletter" in our APIs) variant—either an individual language in a multi-language one-time send or a message in an A/B test. This endpoint returns metrics both in total and in `steps` (days, weeks, etc) over a `period` of time. Stepped `series` metrics are arranged from oldest to newest (i.e. the 0-index for any result is the oldest period/step).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Newsletter Metrics
      responses:
        '200':
          description: Returns one-time send variant metrics by `series` (with increments are based on the `period` and `step` in your request) for the one-time send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: object
                    properties:
                      type:
                        $ref: '#/components/schemas/newsletterMessageType'
                        description: When metrics are scoped to a single one-time send channel, this matches the `type` query parameter.
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
        '404':
          description: The one-time send and/or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/contents/{content_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    - $ref: '#/components/parameters/content_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/newsletterMetricsType'
    get:
      summary: Get click metrics for links in one-time send variants
      operationId: getVariantLinks
      security:
      - Bearer-Auth: []
      description: 'Returns link click metrics for an individual one-time send (referred to as a "newsletter" in our APIs) variant—an individual language in a multi-language one-time send or a message in an A/B test. Unless you specify otherwise, the response contains data for the maximum period by days (45 days).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Newsletter Metrics
      responses:
        '200':
          description: Returns one-time send variant metrics by `series` (with increments are based on the `period` and `step` in your request) for the one-time send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    description: Each object in the array represents a link in your one-time send variant.
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '404':
          description: The one-time send and/or variant does not exist.
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    cio_id:
      x-scalar-ignore: true
      type: string
      description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
      example: a3000001
    customer_id:
      x-scalar-ignore: true
      type:
      - string
      - 'null'
      description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
      example: '42'
    content_id:
      x-scalar-ignore: true
      description: The identifier for a message in a one-time send. One-time sends can have multiple content IDs (for multi-language messages or A/B tests).
      type: integer
      readOnly: true
      example: 1
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: A person's email address, if set.
          example: test@example.com
        id:
          type:
          - string
          - 'null'
          description: A person's unique ID, if set. This is the same as the `customer_id` if present.
          example: 2
        cio_id:
          $ref: '#/components/schemas/cio_id'
    subject:
      x-scalar-ignore: true
      type: string
      description: The subject line for an `email` action.
      example: Did you get that thing I sent you?
    action_id:
      x-scalar-ignore: true
      description: The identifier for an action.
      type: integer
      readOnly: true
      example: 96
    messageMetrics:
      x-scalar-ignore: true
      type: object
      description: Metrics for an individual instance of a message; each item in the object represents the timestamp when a message achieved a particular metric. This object only contains metrics that have been recorded.
      properties:
        bounced:
          type: integer
          description: The timestamp when the message `bounced`.
        clicked:
          type: integer
          description: The timestamp when the message was `clicked`.
        human_clicked:
          type: integer
          description: The number of `clicked` messages excluding machine clicks. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_clicked:
          type: integer
          description: The number of `clicked` messages attributed to machines. This metric is reliable starting April 20, 2025.
        converted:
          type: integer
          description: The timestamp when the message was `converted`.
        created:
          type: integer
          description: The timestamp when the message was `created`.
        delivered:
          type: integer
          description: The timestamp when the message was `delivered`.
        drafted:
          type: integer
          description: The timestamp when the message was `drafted`.
        dropped:
          type: integer
          description: The timestamp when the message was `dropped`.
        failed:
          type: integer
          description: The timestamp when the message `failed`.
        opened:
          type: integer
          description: The timestamp when the message was `opened`.
        human_opened:
          type: integer
          description: The number of `opened` messages excluding machine opens. This metric is reliable starting March 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_opened:
          type: integer
          description: The number of `opened` messages attributed to machines. This metric is reliable starting March 20, 2025.
        sent:
          type: integer
          description: The timestamp when the message was `sent`.
        spammed:
          type: integer
          description: The timestamp when the message was marked as spam.
        undeliverable:
          type: integer
          description: The timestamp when the message became `undeliverable`.
        unsubscribed:
          type: integer
          description: The timestamp when a person unsubscribed based on this message.
    message_template_id:
      x-scalar-ignore: true
      description: The identifier of the message template used to create a message.
      type: integer
      readOnly: true
      deprecated: true
    parent_action_id:
      x-scalar-ignore: true
      type: integer
      description: The ID of the parent action, if the action occurred within an automation and has a parent (like a randomized split, etc).
      example: 1
      readOnly: true
    appApiError:
      x-scalar-ignore: true
      type: object
      description: An array/list of failures where each entry is a separate failure reason.
      required:
      - errors
      properties:
        errors:
          type: array
          description: One entry for each reason the request failed.
          items:
            type: object
            required:
            - detail
            - status
            properties:
              detail:
                type: string
                description: What went wrong, in plain text. Most messages end with a support reference you can use if you need to contact support.
                example: bad request (reference a1b2c3)
              status:
                type: string
                description: The HTTP status code as a string.
                example: '400'
              code:
                type: string
                description: A stable identifier for the failure, on the errors that carry one. Use this rather than the text in `detail` if you need to identify the error programmatically.
                example: invalid_credentials
              source:
                type: object
                description: The part of the request that the error refers to.
                properties:
                  pointer:
                    type: string
                    description: A JSON pointer to the part of the request body that the error refers to.
                    example: /data/attributes/email
              meta:
                type: object
                additionalProperties: true
                description: Extra context (if available).
    newsletterMessageObject:
      x-scalar-ignore: true
      description: Each object is a delivery of a one-time send.
      allOf:
      - $ref: '#/components/schemas/messageObjectBase'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/newsletterMessageType'
    messageObjectBase:
      x-scalar-ignore: true
      type: object
      description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
      properties:
        id:
          $ref: '#/components/schemas/message_id'
        deduplicate_id:
          $ref: '#/components/schemas/deduplicate_id'
        message_template_id:
          $ref: '#/components/schemas/message_template_id'
        customer_id:
          $ref: '#/components/schemas/customer_id'
        customer_identifiers:
          $ref: '#/components/schemas/customer_identifiers'
        recipient:
          $ref: '#/components/schemas/recipient'
        subject:
          $ref: '#/components/schemas/subject'
        metrics:
          $ref: '#/components/schemas/messageMetrics'
        created:
          $ref: '#/components/schemas/created'
        failure_message:
          type:
          - string
          - 'null'
          description: Explains why a message failed, if applicable.
        campaign_id:
          oneOf:
          - $ref: '#/components/schemas/campaign_id'
          - type: 'null'
        action_id:
          $ref: '#/components/schemas/action_id'
        parent_action_id:
          $ref: '#/components/schemas/parent_action_id'
        newsletter_id:
          oneOf:
          - $ref: '#/components/schemas/newsletter_id'
          - type: 'null'
        content_id:
          $ref: '#/components/schemas/content_id'
        broadcast_id:
          oneOf:
          - $ref: '#/components/schemas/broadcast_id'
          - type: 'null'
        trigger_event_id:
          $ref: '#/components/schemas/trigger_event_id'
        forgotten:
          type: boolean
          description: If true message contents are not retained by Customer.io.
        tracked_responses:
          type: object
          description: Tracked in-app survey responses, keyed by response option name. Present only when `get_tracked_responses` is `true`.
          additionalProperties:
            type: object
            properties:
              id:
                type: integer
                description: The identifier for the tracked response.
              ts:
                type: integer
                description: A unix timestamp representing when the response was tracked.
          example:
            cool-button:
              id: 1
              ts: 1715769600
            cool-button-2:
              id: 2
              ts: 1715769600
    newsletterMessageType:
      x-scalar-ignore: true
      description: Channel type for a one-time send or one-time send content variant.
      type: string
      enum:
      - email
      - webhook
      - twilio
      - push
      - in_app
      - inbox
      readOnly: true
      example: email
    linkMetrics:
      x-scalar-ignore: true
      type: object
      properties:
        link:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the link.
              example: 1234
            href:
              type: string
              description: The link destination—a URL, mailto, etc.
              example: https://docs.customer.io
        metric:
          type: object
          description: Contains metrics for the link.
          properties:
            series:
              type: object
              properties:
                clicked:
                  type: array
                  description: An array of results from oldest to newest, where each result indicates a period.
                  items:
                    type: integer
                  example:
                  - 1
                  - 3
                  - 5
                  - 7
                human_clicked:
                  type: array
                  description: An array of human click counts (clicks excluding machine clicks) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  - 4
                machine_clicked:
                  type: array
                  description: An array of machine click counts (clicks attributed to bots or prefetching) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
                  items:
                    type: integer
                  example:
                  - 0
                  - 1
                  - 1
                  - 2
    campaign_id:
      x-scalar-ignore: true
      description: The identifier for an automation.
      type: integer
      example: 5
    periodMessageMetrics:
      x-scalar-ignore: true
      description: Metrics grouped by the requested resolution. Each property is an array where each entry represents one period, such as one day.
      type: object
      properties:
        attempted:
          type: array
          items:
            type: integer
          description: The number of `attempted` messages.
        bounced:
          type: array
          items:
            type: integer
          description: The number of `bounced` messages.
        clicked:
          type: array
          items:
            type: integer
          description: The number of `clicked` messages.
        human_clicked:
          type: array
          items:
            type: integer
          description: The number of `clicked` emails excluding machine clicks. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        machine_clicked:
          type: array
          items:
            type: integer
          description: The number of `clicked` emails attributed to machines—security scanners, bot user agents, known proxy services, and repetitive click patterns. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        converted:
          type: array
          items:
            type: integer
          description: The number of `converted` messages.
        created:
          type: array
          items:
            type: integer
          description: The number of `created` messages.
        deferred:
          type: array
          items:
            type: integer
          description: The number of `deferred` messages.
        delivered:
          type: array
          items:
            type: integer
          description: The number of `delivered` messages.
        drafted:
          type: array
          items:
            type: integer
          description: The number of `drafted` messages.
        failed:
          type: array
          items:
            type: integer
          description: The number of `failed` messages.
        opened:
          type: array
          items:
            type: integer
          description: The number of `opened` messages.
        human_opened:
          type: array
          items:
            type: integer
          description: The number of `opened` emails excluding machine opens. This metric is reliable starting March 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_opened:
