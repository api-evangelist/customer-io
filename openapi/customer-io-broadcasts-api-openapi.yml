openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Broadcasts API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Broadcasts
  x-displayName: Broadcasts
  description: In the UI, we frequently refer to broadcasts that you trigger through these endpoints as "API triggered" broadcasts.
paths:
  /v1/campaigns/{broadcast_id}/triggers/{trigger_id}/errors:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/get_apitb_broadcast_id'
    - $ref: '#/components/parameters/trigger_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/get_apitb_broadcast_id'
    - $ref: '#/components/parameters/trigger_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    get:
      operationId: broadcastErrors
      security:
      - Bearer-Auth: []
      - Bearer-Auth: []
      tags:
      - Broadcasts
      summary: Get broadcast error descriptions
      description: If your broadcast produced validation errors, this endpoint can help you better understand what went wrong. Broadcast errors are generally issues in your broadcast audience and associated.
      responses:
        '200':
          description: Returns an array of errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    description: 'A list of errors in the format `line <x>: <error text>` to help you troubleshoot errors associated with your audience or data file.'
                    type: array
                    items:
                      type: string
                  next:
                    type: integer
                    description: The offset to pass as the `start` value to fetch the next page of errors.
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: The automation ID or trigger ID from your request do not exist.
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    get:
      summary: List broadcasts
      operationId: listBroadcasts
      security:
      - Bearer-Auth: []
      description: Returns a list of your API-triggered broadcasts and associated metadata.
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns an array of API-triggered broadcasts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  broadcasts:
                    type: array
                    items:
                      $ref: '#/components/schemas/broadcastObject'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    get:
      operationId: getBroadcast
      summary: Get a broadcast
      security:
      - Bearer-Auth: []
      description: Returns metadata for an individual broadcast.
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns metadata for the broadcast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  broadcast:
                    $ref: '#/components/schemas/broadcastObject'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{broadcast_id}/triggers/{trigger_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/get_apitb_broadcast_id'
    - $ref: '#/components/parameters/trigger_id'
    get:
      operationId: broadcastStatus
      security:
      - Bearer-Auth: []
      tags:
      - Broadcasts
      summary: Get the status of a broadcast
      description: After triggering a broadcast you can retrieve the status of that broadcast using a GET of the `trigger_id`. You can retrieve the `trigger_id` from Get broadcast triggers.
      responses:
        '200':
          description: Returns the status of your broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/broadcastTriggerObject'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/metricType'
    get:
      operationId: broadcastMetrics
      summary: Get broadcast metrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of metrics for an individual broadcast in `steps` (days, weeks, etc). We return metrics from oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns broadcast metrics by `series` (with increments are based on the `period` and `step` in your request) for the broadcast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: object
                    properties:
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/unique'
    get:
      operationId: broadcastLinks
      summary: Get broadcast link metrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for link clicks within a broadcast, both in total and in `series` periods (days, weeks, etc). `series` metrics are ordered oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns an array of link objects. Each object represents a different link in your broadcast and contains independent metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/actions:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    get:
      operationId: broadcastActions
      summary: List broadcast actions
      security:
      - Bearer-Auth: []
      description: 'Returns the actions that occur as a part of a broadcast.


        If a message block contains multiple languages, this endpoint returns an object for each language variant. Each language variant includes the `multi_language_branch_action_id` property with the same value. Use this id to retrieve metrics for each language variant in a single request through Get broadcast action metrics.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns broadcast `actions`. Each object represents an individual variant for this broadcast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: '#/components/schemas/broadcastActionObject'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/metric'
    - $ref: '#/components/parameters/state'
    - $ref: '#/components/parameters/metricType'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      operationId: broadcastMessages
      summary: Get messages for a broadcast
      security:
      - Bearer-Auth: []
      description: 'Returns information about the deliveries (instances of messages sent to individual people) sent from an API-triggered broadcast. Provide query parameters to refine the metrics you want to return.


        Use the `start_ts` and `end_ts` to find messages within a time range. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return results for the 1 month period after the first trigger. If your `start_ts` and `end_ts` range is more than 12 months, we''ll return 12 months of data from the most recent timestamp in your request. Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns an array of `messages`. Each object represents a different message in your broadcast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/messageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    messages:
                    - id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=
                      deduplicate_id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=:1609957872
                      msg_template_id: 0
                      action_id: 196
                      customer_id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                      customer_identifiers:
                        id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                        email: person@example.com
                        cio_id: 3000001
                      recipient: person@example.com
                      subject: Did you get that thing I sent you?
                      metrics:
                        delivered: 1609957872
                        sent: 1609957832
                      created: 1609957805
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: null
                      broadcast_id: 94
                      type: email
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    messages:
                    - id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 87
                      action_id: 312
                      customer_id: user_2048
                      customer_identifiers:
                        id: user_2048
                        cio_id: '04000001'
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: null
                      broadcast_id: 94
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/actions/{action_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/action_id'
    get:
      operationId: getBroadcastAction
      summary: Get a broadcast action
      security:
      - Bearer-Auth: []
      description: Returns information about a specific action within a broadcast.
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns the requested broadcast `action`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/broadcastActionObject'
        '400':
          $ref: '#/components/responses/400-broadcasts-lang'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
    put:
      operationId: updateBroadcastAction
      summary: Update a broadcast action
      security:
      - Bearer-Auth: []
      description: 'Update the contents of a broadcast action, including the body of messages or HTTP requests.


        **NOTE** You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Broadcasts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateBroadcastActionObject'
      responses:
        '200':
          description: Returns the updated broadcast action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/broadcastActionObject'
        '400':
          $ref: '#/components/responses/400-broadcasts-lang'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/actions/{action_id}/language/{language}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/action_id'
    - $ref: '#/components/parameters/language-2'
    get:
      operationId: getBroadcastActionLanguage
      summary: Get a translation of a broadcast message
      security:
      - Bearer-Auth: []
      description: Returns information about a translation of message in a broadcast. The message is identified by the `action_id`.
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns information for the requested language variant for a broadcast `action`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/broadcastActionObject'
        '400':
          $ref: '#/components/responses/400-broadcasts-lang'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
    put:
      operationId: updateBroadcastActionLanguage
      summary: Update a translation of a broadcast message
      security:
      - Bearer-Auth: []
      description: 'Update a translation of a specific broadcast action, including the body of messages or HTTP requests.


        **NOTE** You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Broadcasts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateBroadcastActionObject'
      responses:
        '200':
          description: Returns the updated broadcast action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/broadcastActionObject'
        '400':
          $ref: '#/components/responses/400-broadcasts-lang'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/actions/{action_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - name: action_id
      in: path
      required: true
      description: 'The action in the broadcast. If the action is a message with translations, you can pass the `id` of the action to get metrics for a specific language variant or pass the `multi_language_branch_action_id` to get metrics for each language variant and total metrics across the variants.

        '
      schema:
        type: integer
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/metricType'
    get:
      operationId: broadcastActionMetrics
      summary: Get broadcast action metrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of metrics for an individual action both in total and in `steps` (days, weeks, etc) over a period of time. Stepped `series` metrics return from oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.


        **Multi-language messages**


        If the action is a multi-language message, you can retrieve metrics for a single language variant or all language variants. To retrieve metrics for a single language variant, pass the `id` of the action. To retrieve aggregate metrics and a breakdown for each language variant, pass the `multi_language_branch_action_id`, which is the same for each variant of a message. You can get both ids from the List broadcast actions endpoint.


        If you pass the `multi_language_branch_action_id`, then the `metric` object shows the *total* across every variant. The `language_variants` object shows a breakdown for each language variant.


        If you want to get the sum of all metrics across all of a broadcast''s actions, you can use each action id of a multi-language message, like you would for other types of actions.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns action metrics by `series` (with increments are based on the `period` and `step` in your request) for the broadcast. For a multi-language message, also returns a per-variant breakdown in `language_variants`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: object
                    properties:
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
                  language_variants:
                    $ref: '#/components/schemas/languageVariantMetrics'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/actions/{action_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    - $ref: '#/components/parameters/action_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/metricType'
    get:
      operationId: broadcastActionLinks
      summary: Get broadcast action link metrics
      security:
      - Bearer-Auth: []
      description: 'Returns link click metrics for an individual broadcast action. Unless you specify otherwise, the response contains data for the maximum period by days (45 days).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns broadcast variant metrics by `series` (with increments are based on the `period` and `step` in your request) for the broadcast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    description: Each object in the array represents a link in your broadcast variant.
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
  /v1/broadcasts/{broadcast_id}/triggers:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/broadcast_id'
    get:
      operationId: listBroadcastTriggers
      summary: Get broadcast triggers
      security:
      - Bearer-Auth: []
      description: Returns a list of the `triggers` for a broadcast.
      tags:
      - Broadcasts
      responses:
        '200':
          description: Returns an array of `triggers`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    description: Each object in the array represents a time that your broadcast was triggered/sent.
                    items:
                      $ref: '#/components/schemas/broadcastTriggerObject'
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    reply_to:
      x-scalar-ignore: true
      type: string
      description: The address that receives replies for the message, if applicable.
      readOnly: true
      example: replyto@example.com
    emailActionObject:
      x-scalar-ignore: true
      type: object
      properties:
        id:
          $ref: '#/components/schemas/action_id'
        broadcast_id:
          $ref: '#/components/schemas/broadcast_id'
          readOnly: true
        deduplicate_id:
          $ref: '#/components/schemas/deduplicate_id'
        name:
          type: string
          description: The name of the action, if it exists.
          readOnly: true
          example: Opening Message
        layout:
          type: string
          description: The layout used for the action, if it exists.
          readOnly: true
        created:
          $ref: '#/components/schemas/created'
        updated:
          $ref: '#/components/schemas/updated'
        body:
          type: string
          description: The body of the action. You cannot modify the body if you created it with our drag-and-drop editor.
        type:
          type: string
          description: The type of action.
          enum:
          - email
          - in_app
          - push
          - twilio
          - slack
          - whatsapp
          readOnly: true
        sending_state:
          $ref: '#/components/schemas/sending_state'
        language:
          $ref: '#/components/schemas/language'
        from:
          $ref: '#/components/schemas/from'
        from_id:
          $ref: '#/components/schemas/from_id'
        reply_to:
          $ref: '#/components/schemas/reply_to'
        reply_to_id:
          $ref: '#/components/schemas/reply_to_id'
        preprocessor:
          $ref: '#/components/schemas/preprocessor'
        recipient:
          $ref: '#/components/schemas/recipient'
        subject:
          $ref: '#/components/schemas/subject'
        cc:
          $ref: '#/components/schemas/cc'
        bcc:
          $ref: '#/components/schemas/bcc'
        fake_bcc:
          $ref: '#/components/schemas/fake_bcc'
        preheader_text:
          $ref: '#/components/schemas/preheader_text'
        body_amp:
          $ref: '#/components/schemas/body_amp'
    preprocessor:
      x-scalar-ignore: true
      type: string
      description: If CSS pre-processing is enabled, this key is populated with `premailer`. Note, Juice replaced Premailer as the pre-processor, but you will only see `premailer` as the value.
      enum:
      - premailer
      readOnly: true
    cio_id:
      x-scalar-ignore: true
      type: string
      description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
      example: a3000001
    customer_id:
      x-scalar-ignore: true
      type:
      - string
      - 'null'
      description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
      example: '42'
    messageObject:
      x-scalar-ignore: true
      description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
      allOf:
      - $ref: '#/components/schemas/messageObjectBase'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/messageType'
      example:
        id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
        deduplicate_id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=:1619137768
        msg_template_id: 43
        action_id: 215
        parent_action_id: null
        customer_id: null
        recipient: person@example.com
        subject: Did you get that thing I sent you?
        metrics:
          delivered: 1619137768
          sent: 1619137768
        created: 1619137767
        failure_message: null
        newsletter_id: null
        content_id: null
        campaign_id: 23
        broadcast_id: null
        trigger_event_id: null
        type: email
        forgotten: false
    msg_template_ids:
      x-scalar-ignore: true
      type: array
      deprecated: true
      description: Indicates the message template(s) used in this broadcast.
      items:
        type: object
        properties:
          id:
            type: integer
            description: The identifier for the template.
          type:
            type: string
            description: The type of template.
            enum:
            - email
            - webhook
            - push
            - sms
            - slack
    content_id:
      x-scalar-ignore: true
      description: The identifier for a message in a one-time send. One-time sends can have multiple content IDs (for multi-language messages or A/B tests).
      type: integer
      readOnly: true
      example: 1
    preheader_text:
      x-scalar-ignore: true
      type: string
      description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

        '
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
