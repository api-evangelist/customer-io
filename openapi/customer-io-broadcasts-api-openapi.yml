        - $ref: '#/components/schemas/emailActionObject'
        - type: object
          properties:
            headers:
              $ref: '#/components/schemas/update_headers'
      - title: SMS / MMS
        allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/action_id'
            broadcast_id:
              $ref: '#/components/schemas/broadcast_id'
        - $ref: '#/components/schemas/smsActionObject'
      - title: WhatsApp
        allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/action_id'
            broadcast_id:
              $ref: '#/components/schemas/broadcast_id'
        - $ref: '#/components/schemas/whatsAppActionObject'
      - title: Webhook
        allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/action_id'
            broadcast_id:
              $ref: '#/components/schemas/broadcast_id'
        - $ref: '#/components/schemas/webhookActionObject'
    language:
      x-scalar-ignore: true
      type: string
      description: The language variant for your message. If you don't use our [localization feature](/journeys/channels/localization/getting-started), or this is the default message, this value is an empty string.
      example: fr
      readOnly: true
    from:
      x-scalar-ignore: true
