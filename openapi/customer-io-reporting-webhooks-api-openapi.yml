openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Reporting Webhooks API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Reporting Webhooks
  description: Set up webhooks to inform an external service about Customer.io events. Webhooks can notify you immediately when immediately when customer attributes change or when people open your messages.
paths:
  /v1/reporting_webhooks:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      summary: Create a reporting webhook
      operationId: createWebhook
      security:
      - Bearer-Auth: []
      description: Create a new webhook configuration.
      tags:
      - Reporting Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reportingWebhook'
      responses:
        '200':
          description: Returns your webhook configuration and the ID of the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportingWebhook'
        '400':
          description: The request was malformed.
        '429':
          $ref: '#/components/responses/429'
    get:
      summary: List reporting webhooks
      operationId: listWebhooks
      security:
      - Bearer-Auth: []
      description: Return a list of all of your reporting webhooks
      tags:
      - Reporting Webhooks
      responses:
        '200':
          description: Returns an array of your `reporting_webhooks`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reporting_webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/reportingWebhook'
        '429':
          $ref: '#/components/responses/429'
  /v1/reporting_webhooks/{webhook_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/webhook_id'
    get:
      summary: Get a reporting webhook
      operationId: getWebhook
      security:
      - Bearer-Auth: []
      description: Returns information about a specific reporting webhook.
      tags:
      - Reporting Webhooks
      responses:
        '200':
          description: Returns an individual webhook configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportingWebhook'
        '404':
          description: The webhook ID does not exist.
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update a webhook configuration
      operationId: updateWebhook
      security:
      - Bearer-Auth: []
      description: Update the configuration of a reporting webhook. Turn events on or off, change the webhook URL, etc.
      tags:
      - Reporting Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reportingWebhook'
      responses:
        '200':
          description: Returns your webhook configuration and the ID of the webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportingWebhook'
        '400':
          description: The request was malformed.
        '404':
          description: The webhook ID does not exist.
        '429':
          $ref: '#/components/responses/429'
    delete:
      summary: Delete a reporting webhook
      operationId: deleteWebhook
      security:
      - Bearer-Auth: []
      description: Delete a reporting webhook's configuration.
      tags:
      - Reporting Webhooks
      responses:
        '200':
          description: A successful request has no response.
        '404':
          description: The webhook ID does not exist.
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    reportingWebhook:
      x-scalar-ignore: true
      type: object
      required:
      - name
      - endpoint
      - events
      properties:
        name:
          type: string
          description: The name of your webhook.
          example: my cool webhook
        id:
          type: integer
          description: The identifier for the webhook.
          readOnly: true
          example: 4
        type:
          type: string
          description: The type of webhook—`webhook` for a standard reporting webhook or `js` for a JavaScript webhook.
          enum:
          - webhook
          - js
          readOnly: true
          example: webhook
        endpoint:
          type: string
          format: url
          description: The webhook URL.
          example: https://example.com/webhook
        disabled:
          type: boolean
          description: Set to `true` to quit sending events to the webhook URL. Set to `false` to enable the webhook.
          example: false
        full_resolution:
          type: boolean
          description: Set to `false` to send unique open and click events to the webhook. Set to `true` to send all events.
          default: false
          example: true
        with_content:
          type: boolean
          description: Set to `true` to include the message `body` in `_sent` events.
          example: false
        events:
          description: Specifies the types of events you want to report to your webhook. See our [reporting webhooks reference](/integrations/api/webhooks/) for more information about event types and the information they return.
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - customer_subscribed
            - customer_unsubscribed
            - customer_subscription_preferences_changed
            - email_drafted
            - email_attempted
            - email_sent
            - email_delivered
            - email_opened
            - email_clicked
            - email_converted
            - email_bounced
            - email_dropped
            - email_deferred
            - email_spammed
            - email_failed
            - email_unsubscribed
            - email_undeliverable
            - in_app_drafted
            - in_app_attempted
            - in_app_sent
            - in_app_opened
            - in_app_clicked
            - in_app_converted
            - in_app_failed
            - in_app_undeliverable
            - push_drafted
            - push_attempted
            - push_sent
            - push_delivered
            - push_opened
            - push_clicked
            - push_converted
            - push_bounced
            - push_dropped
            - push_failed
            - push_undeliverable
            - slack_drafted
            - slack_attempted
            - slack_sent
            - slack_clicked
            - slack_converted
            - slack_failed
            - sms_drafted
            - sms_attempted
            - sms_sent
            - sms_delivered
            - sms_clicked
            - sms_converted
            - sms_bounced
            - sms_dropped
            - sms_failed
            - sms_undeliverable
            - sms_replied
            - whatsapp_drafted
            - whatsapp_attempted
            - whatsapp_sent
            - whatsapp_delivered
            - whatsapp_opened
            - whatsapp_clicked
            - whatsapp_converted
            - whatsapp_bounced
            - whatsapp_dropped
            - whatsapp_failed
            - whatsapp_undeliverable
            - whatsapp_replied
            - webhook_drafted
            - webhook_attempted
            - webhook_sent
            - webhook_clicked
            - webhook_converted
            - webhook_failed
            - webhook_undeliverable
          example:
          - email_failed
          - webhook_failed
    appApiError:
      x-scalar-ignore: true
      type: object
      description: An array/list of failures where each entry is a separate failure reason.
      required:
      - errors
      properties:
        errors:
          type: array
          description: One entry for each reason the request failed.
          items:
            type: object
            required:
            - detail
            - status
            properties:
              detail:
                type: string
                description: What went wrong, in plain text. Most messages end with a support reference you can use if you need to contact support.
                example: bad request (reference a1b2c3)
              status:
                type: string
                description: The HTTP status code as a string.
                example: '400'
              code:
                type: string
                description: A stable identifier for the failure, on the errors that carry one. Use this rather than the text in `detail` if you need to identify the error programmatically.
                example: invalid_credentials
              source:
                type: object
                description: The part of the request that the error refers to.
                properties:
                  pointer:
                    type: string
                    description: A JSON pointer to the part of the request body that the error refers to.
                    example: /data/attributes/email
              meta:
                type: object
                additionalProperties: true
                description: Extra context (if available).
  responses:
    '429':
      description: Your request is over the 10-per-second limit. `Retry-After` tells you how many seconds you must wait before you send the next request.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/appApiError'
          example:
            errors:
            - detail: rate limited to 10 requests per 1s (reference a1b2c3)
              status: '429'
  headers:
    Retry-After:
      description: How many seconds you must wait before you send another request. This header is present when you are rate limited by a per-second limit. If you hit a daily quota, this header is not set.
      schema:
        type: integer
        minimum: 1
        example: 1
  parameters:
    webhook_id:
      name: webhook_id
      in: path
      required: true
      description: The identifier of a webhook.
      schema:
        type: integer
  securitySchemes:
    Tracking-API-Key:
      type: http
      scheme: basic
      description: 'The Track API uses a basic authentication scheme. Your credentials are your **Site ID** and your **API key**, **Base-64 encoded** in the format `site_id:api_key`.


        You can find your Site ID and API key on the [Track API Keys page](https://fly.customer.io/settings/api_credentials).

        '
    Bearer-Auth:
      type: http
      scheme: bearer
      description: 'The App API uses a bearer authentication scheme.


        You can generate a bearer token, known as an **App API Key**, with a defined scope in [your account settings](https://fly.customer.io/settings/api_credentials?keyType=app). [Learn more about bearer authorization in Customer.io](/accounts/settings/managing-credentials).

        '
    ServiceAccount-Auth:
      x-scalar-ignore: true
      type: http
      scheme: bearer
      bearerFormat: sa_live_
      description: 'Transactional send endpoints (`/v1/send/email`, `/v1/send/push`, `/v1/send/sms`, `/v1/send/whatsapp`, `/v1/send/in_app`, `/v1/send/inbox_message`) also accept a service-account bearer token, prefixed with `sa_live_`. Service-account tokens work across workspaces, so you must pass the target workspace as the `X-Workspace-Id` header on each request.


        Service-account tokens are intended for testing and one-off sends—for example, using the Customer.io CLI with an AI agent like Claude to verify that a transactional message renders correctly before wiring it into your production backend. **For the production integration that triggers the message from your application, use an App API Key instead**: it''s workspace-scoped, easier to rotate, and has a smaller blast radius.


        Service-account tokens are server-side credentials. Treat them like any API key—keep them in environment variables or a secret manager, and never embed them in client-side code, mobile apps, or other untrusted contexts.

        '
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed as a Bearer token.
