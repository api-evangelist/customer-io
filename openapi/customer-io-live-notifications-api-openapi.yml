    get:
      summary: Get a live notification's status
      operationId: getLiveNotification
      security:
      - Bearer-Auth: []
      description: 'Look up a live notification''s current state, lifecycle timestamps, and the status of its most recent delivery.

        '
      tags:
      - Live Notifications
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
        description: The activity's instance ID (ULID), returned when you started it.
      responses:
        '200':
          description: The activity's current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id:
                    type: string
                    description: The activity's instance ID.
                  notification_type:
                    type: string
                    description: The activity's reverse-DNS type identifier.
                  platform:
                    type: string
                    description: The device platform—`ios` or `android`.
                  state:
                    type: string
                    enum:
                    - active
                    - ended
                    - expired
                    - failed
                    description: The activity's lifecycle state.
                  failure_reason:
                    type: string
                    nullable: true
                    description: Why the activity failed, when `state` is `failed`.
                  started_at:
                    type: integer
                    description: When the activity started (unix timestamp).
                  ended_at:
                    type: integer
                    nullable: true
                    description: When the activity ended (unix timestamp).
                  expires_at:
                    type: integer
                    nullable: true
                    description: When the activity expires (unix timestamp).
                  last_delivery:
                    type: object
                    nullable: true
                    description: The most recent delivery for the activity.
                    properties:
                      id:
                        type: string
                        description: The delivery ID.
                      operation:
                        type: string
                        enum:
                        - start
                        - update
                        - end
                        description: The lifecycle operation the delivery carried.
                      status:
                        type: string
                        enum:
                        - queued
                        - sent
                        - failed
                        - undeliverable
                        description: The delivery's status.
                      source:
                        type: string
                        description: Where the operation originated—the API or the device.
                      created_at:
                        type: integer
                        description: When the delivery was created (unix timestamp).
        '400':
          description: '`instance_id` isn''t a valid ULID.'
        '404':
          description: The activity wasn't found—a recently started one may not be processed yet—or live notifications aren't enabled for this workspace.
