  parameters:
    device_id:
      name: device_id
      in: path
      required: true
      description: The ID of the device you want to perform an operation against.
      schema:
        type: string
    delivery_id:
      name: delivery_id
      description: The delivery resulting in a request to unsubscribe.
      in: path
      required: true
      schema:
        type: string
    track_customer_id:
      name: identifier
      required: true
      in: path
      description: 'The unique value representing a person. The values you use to identify a person may be an `id`, `email` address, or the `cio_id` (when updating people), depending on your workspace settings. When you reference people by `cio_id`, you must prefix the value with `cio_`.


        You can''t reference a person by their `phone` number here. We determine the identifier type from the shape of the value, so a phone number in the path is treated as an `id`. To identify people by phone number, use the [Track v2 API](/api/track/#tag/track_v2).

        '
      schema:
        oneOf:
        - title: id
          type: string
          example: 12345
          description: The unique identifier for a person that you want to create or modify.
        - title: email
          type: string
          example: person@example.com
          description: A person's email address. If adding a new person in an email-based workspace, you must use this value.
        - title: cio_id
          type: string
          format: cio_[a-zA-Z0-9]*
          description: 'A canonical identifier assigned by Customer.io when you add a person. When referencing a person by this value, you must prefix the value with `cio_`. You can [look up a person using the App API](#tag/Customers) to find their `cio_id`.


            You must use this value to update a person''s other identifiers—their `id` or `email`, unless you enable your workspace''s [Allow updates to email using ID](/accounts/workspaces#update-email-with-id) setting.

            '
          example: cio_03000001
  securitySchemes:
    Tracking-API-Key:
      type: http
      scheme: basic
      description: 'The Track API uses a basic authentication scheme. Your credentials are your **Site ID** and your **API key**, **Base-64 encoded** in the format `site_id:api_key`.


        You can find your Site ID and API key on the [Track API Keys page](https://fly.customer.io/settings/api_credentials).

        '
