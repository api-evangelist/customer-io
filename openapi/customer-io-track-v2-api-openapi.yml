      items:
        type: object
        properties:
          identifiers:
            oneOf:
            - title: id
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/not_nullable_customer_id'
            - title: email
              type: object
              properties:
                email:
                  $ref: '#/components/schemas/not_nullable_email_address'
            - title: cio_id
              type: object
              properties:
                cio_id:
                  $ref: '#/components/schemas/cio_id'
          relationship_attributes:
            type: object
            description: 'The attributes associated with a relationship. Passing null or an empty string removes the attribute from the relationship.

              '
            additionalProperties:
              x-additionalPropertiesName: Relationship Attributes
        example:
          identifiers:
            id: '42'
          relationship_attributes:
            role: admin
            date_created: 1702480414
    object_delete_relationships:
      title: 'Object: Delete relationships'
      description: Delete relationships between an object and one or more people.
      example:
        type: object
        identifiers:
          object_type_id: '1'
          object_id: acme
        action: delete_relationships
        cio_relationships:
        - identifiers:
            id: '42'
      allOf:
      - $ref: '#/components/schemas/object_common'
      - type: object
        required:
        - action
        - cio_relationships
        properties:
          action:
            type: string
            description: This operation deletes an object relationship from one or more people.
            enum:
            - delete_relationships
          cio_relationships:
            $ref: '#/components/schemas/v2_cio_relationships'
    object_attributes:
      x-scalar-ignore: true
