                              delivery_id:
                                type: string
                                description: The message ID.
                              opened:
                                type:
                                - boolean
                                - 'null'
                                description: Indicates whether or not a customer opened a message, if the message was delivered.
                            example:
                              delivery_id: ZAIAAVTJVG0QcCok0-0ZKj6yiQ==
                              opened: null
                              delivered: null
                          - title: Attribute change
