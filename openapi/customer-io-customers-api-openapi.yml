  /v1/customers/{customer_id}/subscription_preferences:
    servers:
    - url: https://api.customer.io
      description: This API uses bearer authorization, requiring a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: customer_id
      required: true
      in: path
      description: The ID of the customer you want to perform an operation against.
      schema:
        type: string
        example: 12345
    - name: id_type
      required: false
      in: query
      description: The type of `customer_id` you want to use to reference a person. If you don't provide this parameter, we assume that the `customer_id` in your request is a person's `id`. You can use `email` and `phone` only if they're enabled as identifiers in your [workspace settings](/accounts/workspaces/overview/#migrate-workspace); otherwise the request returns `400`. Reference `phone` values in [E.164 format](https://en.wikipedia.org/wiki/E.164), like `+14155552671`, and URL-encode the leading `+` as `%2B`.
      schema:
        type: string
        enum:
        - id
        - email
        - phone
        - cio_id
    - name: language
      required: false
      in: query
      description: A [language tag](/journeys/channels/subscriptions/unsubscribe-faqs/#currently-supported-languages) you want the content translated in. If none is provided, the content will be sent in the default language of your subscription center.
      schema:
        type: string
    - in: header
      name: Accept-Language
      schema:
        type: string
        format: string
        description: The [language tag](/journeys/channels/subscriptions/unsubscribe-faqs/#currently-supported-languages) you want the content translated in. If none is provided, the content will be sent in the default lanauge of your subscription center.
      required: false
    get:
      tags:
      - Customers
      summary: Lookup a customer's subscription preferences
      operationId: getPersonSubscriptionPreferences
      security:
      - Bearer-Auth: []
      description: Returns a list of subscription preferences for a person, including the custom header of the subscription preferences page, topic names, and topic descriptions. Returns translated data when you send a language in the query.
      responses:
        '200':
          description: Returns the customer's associated subscription preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    type: object
                    description: The profile you referenced by ID in the request.
                    properties:
                      id:
                        x-scalar-ignore: true
                        type:
                        - string
                        - 'null'
                        description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
                        example: '42'
                      identifiers:
                        x-scalar-ignore: true
                        type: object
                        description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
                        required:
                        - email
                        - id
                        - cio_id
                        properties:
                          email:
                            type:
                            - string
                            - 'null'
                            format: email
                            description: A person's email address, if set.
                            example: test@example.com
                          id:
                            type:
                            - string
                            - 'null'
                            description: A person's unique ID, if set. This is the same as the `customer_id` if present.
                            example: 2
                          cio_id:
                            x-scalar-ignore: true
                            type: string
                            description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
                            example: a3000001
                      topics:
                        type: array
                        description: A list of all subscription preferences for the customer.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: System-generated ID of the topic.
                            subscribed:
                              type: boolean
                              description: If true, the customer is subscribed to the topic. If false, the customer is unsubscribed from the topic.
                            name:
                              type: string
                              description: The name of the subscription topic.
                            description:
                              type: string
                              description: The (optional) description of the topic.
                      unsubscribed:
                        type: boolean
                        description: If true, the customer is unsubscribed from all messaging. If false, the customer is subscribed according to their topic preferences.
                      header:
                        type: object
                        properties:
                          title:
                            type: string
                            description: The header of the subscription preferences page.
                          subtitle:
                            type: string
                            description: The subtitle or headline beneath the header of the subscription preferences page.
              example:
                customer:
                  id: '1'
                  identifiers:
                    cio_id: '01000001'
                    email: me@example.com
                    id: '1'
                  topics:
                  - id: 1
                    subscribed: true
                    name: Offers
                    description: Description for topic 1, if any
                  - id: 2
                    subscribed: true
                    name: News and Programs
                    description: Description for topic 2, if any
                  - id: 3
                    subscribed: false
                    name: Feedback
                    description: Description for topic 3, if any
                  unsubscribed: false
                  header:
                    title: Manage your subscription preferences
                    subtitle: Check the box next to each topic you'd like to subscribe to.
        '400':
          description: Invalid or malformed request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      errors:
                        type: array
                        description: An array of errors.
                        items:
                          type: string
                          description: Error descriptions.
        '404':
          description: The `customer_id` does not exist.
        '429':
          description: Your request is over the 10-per-second limit.
