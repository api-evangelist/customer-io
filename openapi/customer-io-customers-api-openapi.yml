openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Customers API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Customers
  x-displayName: Profiles
  description: Find profiles (referred to as "customers" in our APIs), their attributes, the segments they belong to, etc. Use the track API to add profiles to your workspace and assign their attributes.
paths:
  /v1/customers:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    get:
      parameters:
      - name: email
        description: The email address you want to search for.
        in: query
        required: true
        schema:
          type: string
          format: email
      summary: Get customers by email
      operationId: getPeopleEmail
      security:
      - Bearer-Auth: []
      description: 'Return a list of people in your workspace matching an email address.


        If the email contains special characters like `+`, make sure you percent-encode them in the query parameter. For example, use `jane%2Bnotifications%40example.com` instead of `jane+notifications@example.com`. Unencoded special characters can return empty results without an error.'
      tags:
      - Customers
      responses:
        '200':
          description: Returns an array of `results`; each result represents a person.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: A list of customers matching the email address in your query.
                    items:
                      type: object
                      required:
                      - cio_id
                      - id
                      - email
                      properties:
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                          description: A person's email address, if set.
                          example: hugh.mann@example.com
                        id:
                          type:
                          - string
                          - 'null'
                          description: A person's unique ID, if set.
                          example: 2
                        cio_id:
                          $ref: '#/components/schemas/cio_id'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
    post:
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/limit-50-1000'
      summary: Search for customers
      operationId: getPeopleFilter
      security:
      - Bearer-Auth: []
      description: 'Provide a filter to search for people in your workspace. Your filter can filter people by segment (using the Segment ID) and attribute values; when you filter by attributes, you can use `eq` (matching an attribute value) or `exists` (matching when a person has the attribute). Use the `and` array, `or` array, and `not` object to create a complex filter. The `not` selector is an object that takes a single filter.


        Returns arrays of `identifiers` and `ids`. In general, you should rely on the newer `identifiers` array, which contains more complete information about each person captured by the filter in your request, than the `ids` array, which only contains `id` values.


        You can return up to 1000 people per request. If you want to return a larger set of people in a single request, you may want to use the `/exports` API instead.'
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - filter
              properties:
                filter:
                  description: Describe the customers you want to return. Use `and`, `or`, and `not` arrays to group and determine the logic for filter criteria. You can nest and, or, and not arrays to produce complex filters.
                  $ref: '#/components/schemas/audienceFilter'
            example:
              filter:
                and:
                - attribute:
                    field: email
                    operator: eq
                    value: '{{customer.email}}'
                - not:
                    attribute:
                      field: source
                      operator: eq
                      value: website_newsletter
      responses:
        '200':
          description: Returns an array of customers matching your filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifiers:
                    type: array
                    description: An array of objects, where each object represents a customer. Each object contains identifiers for a customer.
                    items:
                      type: object
                      required:
                      - email
                      - id
                      - cio_id
                      properties:
                        email:
                          type:
                          - string
                          - 'null'
                          format: email
                          description: A person's email address, if set.
                          example: hugh.mann@example.com
                        id:
                          type:
                          - string
                          - 'null'
                          description: A person's unique ID, if set.
                          example: 2
                        cio_id:
                          $ref: '#/components/schemas/cio_id'
                  ids:
                    type: array
                    description: 'In general, you should use the `identifiers` array. This array contains identifiers for people captured in your filter. However, as of June 2021, some workspaces let you add people without an `id`. Entries without an `id` are empty strings in this array, where the `identifiers` array contains more complete information for each person captured in the filter.

                      '
                    items:
                      type: string
                  next:
                    type: string
                    description: The `start` value for the next page of results.
                example:
                  identifiers:
                  - id: 1
                    email: person@example.com
                    cio_id: 3000001
                  - id: 2
                    email: second.person@exapmle.com
                    cio_id: 3000002
                  ids:
                  - 1
                  - 2
                  next: MDox
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
      x-codeSamples:
      - label: cURL
        lang: shell
        source: 'curl --request POST \

          --url ''https://api.customer.io/v1/customers?start=SOME_STRING_VALUE&limit=SOME_INTEGER_VALUE'' \

          --header ''Authorization: Bearer REPLACE_BEARER_TOKEN'' \

          --header ''content-type: application/json'' \

          --data ''{"filter":{"and": [{"segment":{"id": 4}},{"attribute":{"field": "likes_pizza","operator": "eq","value": true}}]}}''

          '
  /v1/customers/{customer_id}/attributes:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    get:
      tags:
      - Customers
      summary: Lookup a customer's attributes
      operationId: getPersonAttributes
      security:
      - Bearer-Auth: []
      description: Return a list of attributes for a customer profile. You can use attributes to fashion segments or as liquid merge fields in your messages.
      responses:
        '200':
          description: Returns the `customer` and associated attributes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customerAttributesObject'
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/{customer_id}/relationships:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - Customers
      summary: Lookup a customer's relationships
      operationId: getPersonRelationships
      security:
      - Bearer-Auth: []
      description: 'Return a list of objects that a person is related to.


        You can use the `start` parameter with the `next` property in responses to return pages of results. However, it''s possible that you''ll see duplicate entries across pages. If you want to export objects or relationships, you may want to use the export feature in our UI to return complete results.'
      responses:
        '200':
          description: Returns an array of `cio_relationships`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cio_relationships:
                    type: array
                    description: A list of "objects" that the customer is related to; each JSON object in the array represents an "object" in Customer.io.
                    items:
                      type: object
                      properties:
                        object_type_id:
                          type: integer
                          description: The type of object that the customer is related to.
                        identifiers:
                          type: object
                          description: The `object_id` and `cio_object_id` that a person is related to.
                          properties:
                            object_id:
                              type: string
                              description: The ID of the object that the customer is related to.
                            cio_object_id:
                              type: string
                              description: The canonical, immutable identifier for the object that the customer is related to.
                        attributes:
                          type: object
                          description: Attributes for the relationship between the person and the object.
                          additionalProperties:
                            x-additionalPropertiesName: Object Attributes
                        timestamps:
                          type: object
                          description: Unix timestamps when the object's attributes were last updated.
                          additionalProperties:
                            type: integer
                            format: unix timestamp
                            x-additionalPropertiesName: Object Attribute Timestamps
                  next:
                    $ref: '#/components/schemas/next'
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/attributes:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      tags:
      - Customers
      summary: List customers, attributes, and devices
      operationId: getPeopleById
      security:
      - Bearer-Auth: []
      description: Return attributes and devices for up to 100 customers by ID. If an ID in the request does not exist, the response omits it.
      parameters:
      - $ref: '#/components/parameters/id_type'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  description: An array of up to 100 customer identifiers. All values must match the `id_type` query parameter—`id` values by default.
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: Returns an array of `customers`. Each object represents a customer profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: '#/components/schemas/customerAttributesObject'
        '400':
          description: The request is malformed.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/{customer_id}/segments:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    get:
      tags:
      - Customers
      summary: Lookup a customer's segments
      operationId: getPersonSegments
      security:
      - Bearer-Auth: []
      description: Returns a list of segments that a customer profile belongs to.
      responses:
        '200':
          description: Returns an array of segments that the customer belongs to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The segment identifier.
                        name:
                          type: string
                          description: The name of the segment.
                        description:
                          type: string
                          description: The description of the segment, as entered in the UI.
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/{customer_id}/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit-50-1000'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    get:
      tags:
      - Customers
      summary: Lookup messages sent to a customer
      operationId: getPersonMessages
      security:
      - Bearer-Auth: []
      description: 'Returns information about the deliveries sent to a person. Provide query parameters to refine the data you want to return.


        Use the `start_ts` and `end_ts` to find messages within a time range. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return the most recent 6 months of messages. If your `start_ts` and `end_ts` range is more than 6 months, we''ll return 6 months of data from the most recent timestamp in your request. Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      responses:
        '200':
          description: Returns an array of message objects. Each object represents a message that you sent a customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The message identifier.
                        deduplicate_id:
                          type: string
                          description: A group identifier to deduplicate messages (useful if a customer may have received multiple messages of the same type).
                        msg_template_id:
                          type: string
                          deprecated: true
                          description: The message template the message was created from.
                        customer_id:
                          type: string
                          description: The customer the message was sent to.
                        campaign_id:
                          type: integer
                          description: The automation the message belongs to.
                        action_id:
                          type: integer
                          description: The identifier for the message action within the automation or broadcast the message belonged to.
                        recipient:
                          type: string
                          description: The address of the recipient. May be an email address, MSISDN, or a device UUID.
                        subject:
                          type: string
                          description: The subject line of the message.
                        metrics:
                          type: object
                          description: Contains information about the send and delivery time of the message.
                          properties:
                            delivered:
                              type: integer
                              format: unix timestamp
                              description: The date and time when the customer received the message.
                            sent:
                              type: integer
                              format: unix timestamp
                              description: The date and time when the message was sent.
                        created:
                          type: integer
                          format: unix timestamp
                          description: The date and time when the message was created.
                        failure_message:
                          type:
                          - string
                          - 'null'
                          description: An error, if the message did not make it to the customer.
                        newsletter_id:
                          type:
                          - integer
                          - 'null'
                          description: The one-time send that the message was sent as a part of, if applicable.
                        content_id:
                          type:
                          - integer
                          - 'null'
                          description: The one-time send variant for the message, if applicable.
                        broadcast_id:
                          type:
                          - integer
                          - 'null'
                          description: The broadcast the message was sent as a part of, if applicable.
                        type:
                          type: string
                          description: The type of message.
                          enum:
                          - email
                          - webhook
                          - twilio
                          - slack
                          - push
                          - in_app
                          - whatsapp
                        forgotten:
                          type: boolean
                          description: If true, the message content was forgotten.
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/{customer_id}/activities:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit-10-100'
    - $ref: '#/components/parameters/activityTypes'
    - name: name
      in: query
      description: For `event` and `attribute_update` types, you can search by event or attribute name respectively. For the `consent` type, you can search by consent action, like `opted_in` or `opted_out`.
      required: false
      schema:
        type: string
    get:
      tags:
      - Customers
      summary: Lookup a customer's activities
      operationId: getPersonActivities
      security:
      - Bearer-Auth: []
      description: 'Return a list of activities performed by, or for, a customer. Activities are things like attribute changes and message sends.


        This endpoint is guaranteed to return activity history within the past 30 days. It might return data older than 30 days in some circumstances, but activites older than 30 days are not guaranteed.'
      responses:
        '200':
          description: Returns an array of activity objects. Each object represents an activity that the customer performed, or that you performed on behalf of the customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: '#/components/schemas/activityObject'
        '400':
          description: The request parameters are malformed.
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/customers/{customer_id}/subscription_preferences:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/customer_id'
    - $ref: '#/components/parameters/id_type'
    - $ref: '#/components/parameters/language-1'
    - in: header
      name: Accept-Language
      schema:
        type: string
        format: string
        description: The [language tag](/journeys/channels/subscriptions/unsubscribe-faqs/#currently-supported-languages) you want the content translated in. If none is provided, the content will be sent in the default lanauge of your subscription center.
      required: false
    get:
      tags:
      - Customers
      summary: Lookup a customer's subscription preferences
      operationId: getPersonSubscriptionPreferences
      security:
      - Bearer-Auth: []
      description: Returns a list of subscription preferences for a person, including the custom header of the subscription preferences page, topic names, and topic descriptions. Returns translated data when you send a language in the query.
      responses:
        '200':
          description: Returns the customer's associated subscription preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    type: object
                    description: The profile you referenced by ID in the request.
                    properties:
                      id:
                        $ref: '#/components/schemas/customer_id'
                      identifiers:
                        $ref: '#/components/schemas/customer_identifiers'
                      topics:
                        type: array
                        description: A list of all subscription preferences for the customer.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: System-generated ID of the topic.
                            subscribed:
                              type: boolean
                              description: If true, the customer is subscribed to the topic. If false, the customer is unsubscribed from the topic.
                            name:
                              type: string
                              description: The name of the subscription topic.
                            description:
                              type: string
                              description: The (optional) description of the topic.
                      unsubscribed:
                        type: boolean
                        description: If true, the customer is unsubscribed from all messaging. If false, the customer is subscribed according to their topic preferences.
                      header:
                        type: object
                        properties:
                          title:
                            type: string
                            description: The header of the subscription preferences page.
                          subtitle:
                            type: string
                            description: The subtitle or headline beneath the header of the subscription preferences page.
              example:
                customer:
                  id: '1'
                  identifiers:
                    cio_id: '01000001'
                    email: me@example.com
                    id: '1'
                  topics:
                  - id: 1
                    subscribed: true
                    name: Offers
                    description: Description for topic 1, if any
                  - id: 2
                    subscribed: true
                    name: News and Programs
                    description: Description for topic 2, if any
                  - id: 3
                    subscribed: false
                    name: Feedback
                    description: Description for topic 3, if any
                  unsubscribed: false
                  header:
                    title: Manage your subscription preferences
                    subtitle: Check the box next to each topic you'd like to subscribe to.
        '400':
          $ref: '#/components/responses/400-app'
        '404':
          description: The `customer_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    cio_id:
      x-scalar-ignore: true
      type: string
      description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
      example: a3000001
    customer_id:
      x-scalar-ignore: true
      type:
      - string
      - 'null'
      description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
      example: '42'
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: A person's email address, if set.
          example: test@example.com
        id:
          type:
          - string
          - 'null'
          description: A person's unique ID, if set. This is the same as the `customer_id` if present.
          example: 2
        cio_id:
          $ref: '#/components/schemas/cio_id'
    activityTypes:
      x-scalar-ignore: true
      description: The type of activity. Types with `_o:<object_type_id>` are for objects and types with `_r:<object_type_id>` are for relationships.
      type: string
      enum:
      - add_relationship
      - anon_merge
      - attempted_action
      - attempted_email
      - attempted_in_app
      - attempted_push
      - attempted_slack
      - attempted_twilio
      - attempted_webhook
      - attempted_whatsapp
      - attribute_change
      - bounced_action
      - bounced_email
      - bounced_push
      - bounced_twilio
      - bounced_whatsapp
      - clicked_action
