openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Messages API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Messages
  description: Return information about message and webhook "deliveries"—the instance of a message or webhook intended for an individual recipient.
paths:
  /v1/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit-50-1000'
    - $ref: '#/components/parameters/metricType'
    - $ref: '#/components/parameters/metric'
    - $ref: '#/components/parameters/drafts'
    - $ref: '#/components/parameters/campaign_id_query'
    - $ref: '#/components/parameters/newsletter_id_query'
    - $ref: '#/components/parameters/action_id_query'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      summary: List messages
      operationId: listMessages
      security:
      - Bearer-Auth: []
      description: 'Return a list of deliveries, including metrics for each delivery, for messages in your workspace. The request body contains filters determining the deliveries you want to return information about.


        Use the `start_ts` and `end_ts` parameters to find messages within a time range. We limit your requests to 6 months. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return the most recent 6 months of deliveries. If `start_ts` is greater than 6-months before `end_ts`, we only send back 6 months of data. If only `end_ts` is specified, we return 6 months of data before this timestamp. If only `start_ts` is specified, we then set the `end_ts` to the current time and deliver 6 months of data prior to this timestamp. Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      tags:
      - Messages
      responses:
        '200':
          description: Returns an array of message objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    description: Each object in the array describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
                    items:
                      $ref: '#/components/schemas/messageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    messages:
                    - id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
                      deduplicate_id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=:1619137768
                      msg_template_id: 43
                      action_id: 215
                      parent_action_id: null
                      customer_id: null
                      recipient: person@example.com
                      subject: Did you get that thing I sent you?
                      metrics:
                        delivered: 1619137768
                        sent: 1619137768
                      created: 1619137767
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 23
                      broadcast_id: null
                      trigger_event_id: null
                      type: email
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    messages:
                    - id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 87
                      action_id: 312
                      parent_action_id: null
                      customer_id: user_2048
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 45
                      broadcast_id: null
                      trigger_event_id: null
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '400':
          description: The request was malformed.
        '429':
          $ref: '#/components/responses/429'
  /v1/messages/{message_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/message_id'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      summary: Get a message
      operationId: getMessage
      security:
      - Bearer-Auth: []
      description: Return a information about, and metrics for, a delivery—the instance of a message intended for an individual recipient person.
      tags:
      - Messages
      responses:
        '200':
          description: Returns a message object.
          content:
            application/json:
              schema:
                type: object
                description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
                properties:
                  message:
                    $ref: '#/components/schemas/messageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    message:
                      id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
                      deduplicate_id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=:1619137768
                      msg_template_id: 43
                      action_id: 215
                      parent_action_id: null
                      customer_id: null
                      recipient: person@example.com
                      subject: Did you get that thing I sent you?
                      metrics:
                        delivered: 1619137768
                        sent: 1619137768
                      created: 1619137767
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 23
                      broadcast_id: null
                      trigger_event_id: null
                      type: email
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    message:
                      id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 87
                      action_id: 312
                      parent_action_id: null
                      customer_id: user_2048
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 45
                      broadcast_id: null
                      trigger_event_id: null
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '404':
          description: The message does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/messages/{message_id}/archived_message:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/message_id'
    get:
      summary: Get an archived message
      operationId: getArchivedMessage
      security:
      - Bearer-Auth: []
      description: Returns the archived copy of a delivery, including the message body, recipient, and metrics. This endpoint is limited to 100 requests per day.
      tags:
      - Messages
      responses:
        '200':
          description: Returns the archived message object.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                description: Describes an archived message delivery.
                properties:
                  archived_message:
                    $ref: '#/components/schemas/archivedMessageObject'
        '404':
          description: The message does not exist.
        '429':
          $ref: '#/components/responses/429-archived'
components:
  schemas:
    reply_to:
      x-scalar-ignore: true
      type: string
      description: The address that receives replies for the message, if applicable.
      readOnly: true
      example: replyto@example.com
    cio_id:
      x-scalar-ignore: true
      type: string
      description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
      example: a3000001
    customer_id:
      x-scalar-ignore: true
      type:
      - string
      - 'null'
      description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
      example: '42'
    messageObject:
      x-scalar-ignore: true
      description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
      allOf:
      - $ref: '#/components/schemas/messageObjectBase'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/messageType'
      example:
        id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
        deduplicate_id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=:1619137768
        msg_template_id: 43
        action_id: 215
        parent_action_id: null
        customer_id: null
        recipient: person@example.com
        subject: Did you get that thing I sent you?
        metrics:
          delivered: 1619137768
          sent: 1619137768
        created: 1619137767
        failure_message: null
        newsletter_id: null
        content_id: null
        campaign_id: 23
        broadcast_id: null
        trigger_event_id: null
        type: email
        forgotten: false
    forgotten:
      x-scalar-ignore: true
      type: boolean
      description: If true, Customer.io does not retain the message content.
      example: false
    content_id:
      x-scalar-ignore: true
      description: The identifier for a message in a one-time send. One-time sends can have multiple content IDs (for multi-language messages or A/B tests).
      type: integer
      readOnly: true
      example: 1
    preheader_text:
      x-scalar-ignore: true
      type: string
      description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

        '
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: A person's email address, if set.
          example: test@example.com
        id:
          type:
          - string
          - 'null'
          description: A person's unique ID, if set. This is the same as the `customer_id` if present.
          example: 2
        cio_id:
          $ref: '#/components/schemas/cio_id'
    from:
      x-scalar-ignore: true
      type: string
      description: The address that the message is from, relevant if the action `type` is `email`.
      readOnly: true
      example: sentFrom@example.com
    subject:
      x-scalar-ignore: true
      type: string
      description: The subject line for an `email` action.
      example: Did you get that thing I sent you?
    action_id:
      x-scalar-ignore: true
      description: The identifier for an action.
      type: integer
      readOnly: true
      example: 96
    messageMetrics:
      x-scalar-ignore: true
      type: object
      description: Metrics for an individual instance of a message; each item in the object represents the timestamp when a message achieved a particular metric. This object only contains metrics that have been recorded.
      properties:
        bounced:
          type: integer
          description: The timestamp when the message `bounced`.
        clicked:
          type: integer
          description: The timestamp when the message was `clicked`.
        human_clicked:
          type: integer
          description: The number of `clicked` messages excluding machine clicks. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_clicked:
          type: integer
          description: The number of `clicked` messages attributed to machines. This metric is reliable starting April 20, 2025.
        converted:
          type: integer
          description: The timestamp when the message was `converted`.
        created:
          type: integer
          description: The timestamp when the message was `created`.
        delivered:
          type: integer
          description: The timestamp when the message was `delivered`.
        drafted:
          type: integer
          description: The timestamp when the message was `drafted`.
        dropped:
          type: integer
          description: The timestamp when the message was `dropped`.
        failed:
          type: integer
          description: The timestamp when the message `failed`.
        opened:
          type: integer
          description: The timestamp when the message was `opened`.
        human_opened:
          type: integer
          description: The number of `opened` messages excluding machine opens. This metric is reliable starting March 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_opened:
          type: integer
          description: The number of `opened` messages attributed to machines. This metric is reliable starting March 20, 2025.
        sent:
          type: integer
          description: The timestamp when the message was `sent`.
        spammed:
          type: integer
          description: The timestamp when the message was marked as spam.
        undeliverable:
          type: integer
          description: The timestamp when the message became `undeliverable`.
        unsubscribed:
          type: integer
          description: The timestamp when a person unsubscribed based on this message.
    message_template_id:
      x-scalar-ignore: true
      description: The identifier of the message template used to create a message.
      type: integer
      readOnly: true
      deprecated: true
    parent_action_id:
      x-scalar-ignore: true
      type: integer
      description: The ID of the parent action, if the action occurred within an automation and has a parent (like a randomized split, etc).
      example: 1
      readOnly: true
    appApiError:
      x-scalar-ignore: true
      type: object
      description: An array/list of failures where each entry is a separate failure reason.
      required:
      - errors
      properties:
        errors:
          type: array
          description: One entry for each reason the request failed.
          items:
            type: object
            required:
            - detail
            - status
            properties:
              detail:
                type: string
                description: What went wrong, in plain text. Most messages end with a support reference you can use if you need to contact support.
                example: bad request (reference a1b2c3)
              status:
                type: string
                description: The HTTP status code as a string.
                example: '400'
              code:
                type: string
                description: A stable identifier for the failure, on the errors that carry one. Use this rather than the text in `detail` if you need to identify the error programmatically.
                example: invalid_credentials
              source:
                type: object
                description: The part of the request that the error refers to.
                properties:
                  pointer:
                    type: string
                    description: A JSON pointer to the part of the request body that the error refers to.
                    example: /data/attributes/email
              meta:
                type: object
                additionalProperties: true
                description: Extra context (if available).
    cc:
      x-scalar-ignore: true
      readOnly: true
      description: The carbon-copy address(es) for this action.
      type: string
    headers:
      x-scalar-ignore: true
      description: A JSON string containing header objects with `name` and `value`. Names and values must be strings, with no non-ASCII characters or spaces. You can't overwrite reserved headers.
      type: string
      format: json
      example: '[{"name":"X-Mailgun-Tag","value":"my-cool-tag"},{"name":"X-Custom-Header","value":"custom-value"}]'
    messageObjectBase:
      x-scalar-ignore: true
      type: object
      description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
      properties:
        id:
          $ref: '#/components/schemas/message_id'
        deduplicate_id:
          $ref: '#/components/schemas/deduplicate_id'
        message_template_id:
          $ref: '#/components/schemas/message_template_id'
        customer_id:
          $ref: '#/components/schemas/customer_id'
        customer_identifiers:
          $ref: '#/components/schemas/customer_identifiers'
        recipient:
          $ref: '#/components/schemas/recipient'
        subject:
          $ref: '#/components/schemas/subject'
        metrics:
          $ref: '#/components/schemas/messageMetrics'
        created:
          $ref: '#/components/schemas/created'
        failure_message:
          type:
          - string
          - 'null'
          description: Explains why a message failed, if applicable.
        campaign_id:
          oneOf:
          - $ref: '#/components/schemas/campaign_id'
          - type: 'null'
        action_id:
          $ref: '#/components/schemas/action_id'
        parent_action_id:
          $ref: '#/components/schemas/parent_action_id'
        newsletter_id:
          oneOf:
          - $ref: '#/components/schemas/newsletter_id'
          - type: 'null'
        content_id:
          $ref: '#/components/schemas/content_id'
        broadcast_id:
          oneOf:
          - $ref: '#/components/schemas/broadcast_id'
          - type: 'null'
        trigger_event_id:
          $ref: '#/components/schemas/trigger_event_id'
        forgotten:
          type: boolean
          description: If true message contents are not retained by Customer.io.
        tracked_responses:
          type: object
          description: Tracked in-app survey responses, keyed by response option name. Present only when `get_tracked_responses` is `true`.
          additionalProperties:
            type: object
            properties:
              id:
                type: integer
                description: The identifier for the tracked response.
              ts:
                type: integer
                description: A unix timestamp representing when the response was tracked.
          example:
            cool-button:
              id: 1
              ts: 1715769600
            cool-button-2:
              id: 2
              ts: 1715769600
    messageType:
      x-scalar-ignore: true
      description: The type of message or action for a delivery, automation action, or related object. Includes channels that one-time sends do not support (for example, `slack` and `whatsapp`).
      type: string
      enum:
      - email
      - webhook
      - twilio
      - push
      - in_app
      - slack
      - whatsapp
      - live_notification
      readOnly: true
      example: email
    archivedMessageObject:
      x-scalar-ignore: true
      description: 'An archived message, including a complete message body.

        '
      type: object
      properties:
        id:
          $ref: '#/components/schemas/message_id'
        body:
          type: string
          description: The body of the variant. You cannot modify the body if you created it with our drag-and-drop editor.
          example: <!DOCTYPE html><html><head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"/><h1>Hello World</h1>\n\n</body></html>
        from:
          $ref: '#/components/schemas/from'
        reply_to:
          $ref: '#/components/schemas/reply_to'
        recipient:
          description: The recipient address for an action.
          type: string
          example: person@example.com
        subject:
          $ref: '#/components/schemas/subject'
        cc:
          $ref: '#/components/schemas/cc'
        bcc:
          $ref: '#/components/schemas/bcc'
        fake_bcc:
          $ref: '#/components/schemas/fake_bcc'
        preheader_text:
          $ref: '#/components/schemas/preheader_text'
        url:
          $ref: '#/components/schemas/url'
        request_method:
          $ref: '#/components/schemas/request_method'
        headers:
          $ref: '#/components/schemas/headers'
        forgotten:
          $ref: '#/components/schemas/forgotten'
    bcc:
      x-scalar-ignore: true
      readOnly: true
      description: The blind-copy address(es) for this action.
      type: string
    campaign_id:
      x-scalar-ignore: true
      description: The identifier for an automation.
      type: integer
      example: 5
    deduplicate_id:
      x-scalar-ignore: true
      type: string
      readOnly: true
      description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Automations, Deliveries, Exports, Identities, One-time sends, Segments, and Templates), and the timestamp is the last time the object was updated.
      example: 15:1492548073
    newsletter_id:
      x-scalar-ignore: true
      description: The identifier for a one-time send.
      type: integer
      example: 10
    url:
      x-scalar-ignore: true
      type: string
      description: The URL of a webhook or action.
      example: https://example.com/webhook
    fake_bcc:
      x-scalar-ignore: true
      readOnly: true
      type: boolean
      description: 'If true, rather than sending true copies to BCC addresses, Customer.io sends a copy of the message with the subject line containing the recipient address(es).

        '
    trigger_event_id:
      x-scalar-ignore: true
      type: string
      description: The id of the event that triggered an event-triggered automation (not an API-triggered broadcast).
      example: 21E4C3CT6YDC7Y4N7FE1GWWABC
    request_method:
      x-scalar-ignore: true
      type: string
      description: The method used in conjunction with a webhook `url`.
      enum:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      example: POST
    broadcast_id:
      x-scalar-ignore: true
      type: integer
      description: The identifier for a broadcast.
      example: 2
    recipient:
      x-scalar-ignore: true
      description: The recipient address for an action.
      type: string
      example: '{{customer.email}}'
    created:
      x-scalar-ignore: true
      type: integer
      format: unix timestamp
      description: The date time when the referenced ID was created.
      example: 1552341937
      readOnly: true
    message_id:
      x-scalar-ignore: true
      description: The identifier for a delivery—the instance of a message intended for an individual recipient.
      type: string
      readOnly: true
      example: dgOq6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
  headers:
    X-RateLimit-Remaining:
      description: How many requests are left in today's quota for this endpoint. Endpoints with a daily quota set it on every response, not only on a 429, so you can slow down before you run out.
      schema:
        type: integer
        example: 97
    Retry-After:
      description: How many seconds you must wait before you send another request. This header is present when you are rate limited by a per-second limit. If you hit a daily quota, this header is not set.
      schema:
        type: integer
        minimum: 1
        example: 1
    X-RateLimit-Limit:
      description: How many requests the daily quota on this endpoint allows.
      schema:
        type: integer
        example: 100
  parameters:
    end_ts:
      name: end_ts
      in: query
      required: false
      description: The ending timestamp for your query.
      schema:
        type: integer
        format: unix timestamp
    newsletter_id_query:
      name: newsletter_id
      in: query
      required: false
      description: The one-time send you want to filter for.
      schema:
        type: integer
    campaign_id_query:
      name: campaign_id
      in: query
      required: false
      description: The automation you want to filter for.
      schema:
        type: integer
    drafts:
