openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Transactional API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Transactional
  x-displayName: Transactional Messages
  description: 'Send, and return information about, transactional messages. Transactional messages are messages that your audience explicitly requests or expects, like purchase receipts or password reset requests.


    The `transactional_id` in requests represents the transactional message template. Each individual send—the instance of a message sent to an individual person—is called a "delivery".'
paths:
  /v1/transactional:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    get:
      summary: List transactional messages
      operationId: listTransactional
      security:
      - Bearer-Auth: []
      description: Returns a list of your transactional messages—the transactional IDs that you use to trigger an individual transactional delivery. This endpoint does not return information about deliveries (instances of a message sent to a person) themselves.
      tags:
      - Transactional
      responses:
        '200':
          description: Returns an array of transactional messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/transactionalObject'
        '429':
          $ref: '#/components/responses/429'
  /v1/transactional/{transactional_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    get:
      operationId: getTransactional
      summary: Get a transactional message
      security:
      - Bearer-Auth: []
      description: Returns information about an individual transactional message.
      tags:
      - Transactional
      responses:
        '200':
          description: Returns metadata for the transactional message ID in the path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/transactionalObject'
        '404':
          description: The transactional message does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/transactional/{transactional_id}/contents:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    get:
      operationId: listTransactionalVariants
      summary: List all variants of a transactional message
      security:
      - Bearer-Auth: []
      description: Returns the content variants of a transactional message, where each variant represents a different language.
      tags:
      - Transactional
      responses:
        '200':
          description: Returns each variant of the transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contents:
                    type: array
                    description: Each object represents one of the variants.
                    items:
                      $ref: '#/components/schemas/getTransactionalActionObject'
        '400':
          description: The request was malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
        '404':
          description: The `transactional_id` or `content_id` in your request do not exist.
  /v1/transactional/{transactional_id}/content/{content_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - name: content_id
      description: The content variant of your transactional message. You'll find the id in the URL of your transactional message. For example, if this is the path of a transactional message URL - `/transactional/3/templates/139` - the `content_id` is 139.
      in: path
      required: true
      schema:
        type: integer
    put:
      operationId: updateTransactional
      summary: Update a transactional message
      security:
      - Bearer-Auth: []
      description: 'Update the body of a transactional email. This fully overwrites your existing transactional message. We''ll use your updated content for any future transactional requests (`/v1/send/email`), so make sure that you test your message before you update it.


        **NOTE**: You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Transactional
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateTransactionalActionObject'
      responses:
        '200':
          description: Returns the updated transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    description: The object includes the transactional message content and metadata.
                    items:
                      $ref: '#/components/schemas/getTransactionalActionObject'
        '400':
          description: The request was malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
        '404':
          description: The `transactional_id` or `content_id` in your request do not exist
  /v1/transactional/{transactional_id}/contents/{content_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - name: content_id
      description: A translated variant of your transactional message. You'll find the id in the URL of your transactional message. For example, if this is the path of a transactional message URL - `/transactional/3/templates/139` - the `content_id` is 139.
      in: path
      required: true
      schema:
        type: integer
    get:
      operationId: getTransactionalTranslationById
      summary: Get a translation of a transactional by ID
      security:
      - Bearer-Auth: []
      description: Returns an individual translation variant of a transactional message, including the message content. To look up a translation by its language instead of its id, see Get a translation of a transactional message.
      tags:
      - Transactional
      responses:
        '200':
          description: Returns the specified translation of the transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    $ref: '#/components/schemas/getTransactionalActionObject'
        '400':
          description: The `content_id` does not belong to the transactional message specified in `transactional_id`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
        '404':
          description: The `content_id` or `transactional_id` does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/transactional/{transactional_id}/language/{language}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - $ref: '#/components/parameters/language-2'
    get:
      operationId: getTransactionalVariant
      summary: Get a translation of a transactional message
      security:
      - Bearer-Auth: []
      description: Returns information about a translation of an individual transactional message, including the message content. To look up a translation by its id instead of its language, see Get a translation of a transactional by ID.
      tags:
      - Transactional
      responses:
        '200':
          description: Returns the specified variant of the transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    description: The object represents a variant.
                    items:
                      $ref: '#/components/schemas/getTransactionalActionObject'
        '400':
          description: The `language` in your request does not exist.
        '404':
          description: The transactional message does not exist.
        '429':
          $ref: '#/components/responses/429'
    put:
      operationId: updateTransactionalVariant
      summary: Update a translation of a transactional message
      security:
      - Bearer-Auth: []
      description: 'Update the body and other data of a specific language variant for a transactional message. This fully overwrites this specific translation of your existing transactional message.


        **NOTE**: You cannot manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Transactional
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateTransactionalActionObject'
      responses:
        '200':
          description: Returns the updated variant of the transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    description: Each object represents one of the variants.
                    items:
                      $ref: '#/components/schemas/getTransactionalActionObject'
        '400':
          description: The `language` in your request does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
  /v1/transactional/{transactional_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    get:
      operationId: transactionalMetrics
      summary: Get transactional message metrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of metrics for a transactional message in `steps` (days, weeks, etc). We return metrics from oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Transactional
      responses:
        '200':
          description: Returns transactional message metrics by `series` (with increments are based on the `period` and `step` in your request) for transactional message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: object
                    properties:
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
        '404':
          description: The transactional message you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/transactional/{transactional_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/unique'
    get:
      operationId: transactionalLinks
      summary: Get transactional message link metrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for clicked links from a transactional message, both in total and in `series` periods (days, weeks, etc). `series` metrics are ordered oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Transactional
      responses:
        '200':
          description: Returns an array of link objects. Each object represents a different link in your transactional message and contains independent metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '404':
          description: The transactional message you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
  /v1/transactional/{transactional_id}/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/transactional_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/metric'
    - $ref: '#/components/parameters/state'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      operationId: transactionalMessages
      summary: Get transactional message deliveries
      security:
      - Bearer-Auth: []
      description: 'Returns information about the deliveries (instances of messages sent to individual people) from a transactional message. Provide query parameters to refine the metrics you want to return.


        Use the `start_ts` and `end_ts` to find messages within a time range. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return the most recent 6 months of messages. If your `start_ts` and `end_ts` range is more than 12 months, we''ll return 12 months of data from the most recent timestamp in your request. Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      tags:
      - Transactional
      responses:
        '200':
          description: "Returns an array of `messages`. Each object represents a different delivery originating from the transactional ID. \n\nFor transactional messages, the action, one-time send, automation, content, and broadcast IDs are all `null`. All deliveries originate from the transactional ID in the path of your request.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/messageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    messages:
                    - id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=
                      deduplicate_id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=:1609957872
                      msg_template_id: 589
                      action_id: null
                      customer_id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                      identifiers:
                        id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                        email: person@example.com
                        cio_id: 3000001
                      recipient: person@example.com
                      subject: Reset your password
                      metrics:
                        delivered: 1609957872
                        sent: 1609957832
                      created: 1609957805
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: null
                      broadcast_id: null
                      type: email|push
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    messages:
                    - id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 589
                      action_id: null
                      customer_id: user_2048
                      identifiers:
                        id: user_2048
                        cio_id: '04000001'
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: null
                      broadcast_id: null
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '404':
          description: The transactional message you requested does not exist.
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    reply_to:
      x-scalar-ignore: true
      type: string
      description: The address that receives replies for the message, if applicable.
      readOnly: true
      example: replyto@example.com
    preprocessor:
      x-scalar-ignore: true
      type: string
      description: If CSS pre-processing is enabled, this key is populated with `premailer`. Note, Juice replaced Premailer as the pre-processor, but you will only see `premailer` as the value.
      enum:
      - premailer
      readOnly: true
    cio_id:
      x-scalar-ignore: true
      type: string
      description: A unique identifier set by Customer.io, used to reference a person if you want to update their identifiers.
      example: a3000001
    customer_id:
      x-scalar-ignore: true
      type:
      - string
      - 'null'
      description: The ID of a customer profile, analogous to a "person" in the UI. If your workspace supports multiple identifiers (email and ID), this value can be null.
      example: '42'
    messageObject:
      x-scalar-ignore: true
      description: Describes an individual message delivery. The object contains keys for all possible parents of the message (`newsletter_id`, `broadcast_id`, etc) but only the parents of the delivery are populated. Other parent IDs are null.
      allOf:
      - $ref: '#/components/schemas/messageObjectBase'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/messageType'
      example:
        id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=
        deduplicate_id: ag1q6QWq6QUBAAF4_CGoeVX7mFkDbRFu7ek=:1619137768
        msg_template_id: 43
        action_id: 215
        parent_action_id: null
        customer_id: null
        recipient: person@example.com
        subject: Did you get that thing I sent you?
        metrics:
          delivered: 1619137768
          sent: 1619137768
        created: 1619137767
        failure_message: null
        newsletter_id: null
        content_id: null
        campaign_id: 23
        broadcast_id: null
        trigger_event_id: null
        type: email
        forgotten: false
    content_id:
      x-scalar-ignore: true
      description: The identifier for a message in a one-time send. One-time sends can have multiple content IDs (for multi-language messages or A/B tests).
      type: integer
      readOnly: true
      example: 1
    preheader_text:
      x-scalar-ignore: true
      type: string
      description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

        '
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: A person's email address, if set.
          example: test@example.com
        id:
          type:
          - string
          - 'null'
          description: A person's unique ID, if set. This is the same as the `customer_id` if present.
          example: 2
        cio_id:
          $ref: '#/components/schemas/cio_id'
    language:
      x-scalar-ignore: true
      type: string
      description: The language variant for your message. If you don't use our [localization feature](/journeys/channels/localization/getting-started), or this is the default message, this value is an empty string.
      example: fr
      readOnly: true
    getTransactionalActionObject:
      x-scalar-ignore: true
      allOf:
      - $ref: '#/components/schemas/transactionalActionObject'
      - type: object
        properties:
          headers:
            $ref: '#/components/schemas/headers'
    from:
      x-scalar-ignore: true
      type: string
      description: The address that the message is from, relevant if the action `type` is `email`.
      readOnly: true
      example: sentFrom@example.com
    body_amp:
      x-scalar-ignore: true
      type: string
      description: AMP-enabled content for your email. If a recipient's email client doesn't support AMP, they receive your `body` content instead. Make sure you're [set up to send AMP](/journeys/channels/email/layouts/amp-for-email/) first.
    subject:
      x-scalar-ignore: true
      type: string
      description: The subject line for an `email` action.
      example: Did you get that thing I sent you?
    action_id:
      x-scalar-ignore: true
      description: The identifier for an action.
      type: integer
      readOnly: true
      example: 96
    messageMetrics:
      x-scalar-ignore: true
      type: object
      description: Metrics for an individual instance of a message; each item in the object represents the timestamp when a message achieved a particular metric. This object only contains metrics that have been recorded.
      properties:
        bounced:
          type: integer
          description: The timestamp when the message `bounced`.
        clicked:
          type: integer
          description: The timestamp when the message was `clicked`.
        human_clicked:
          type: integer
          description: The number of `clicked` messages excluding machine clicks. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
        prefetch_clicked:
          type: integer
          description: The number of `clicked` messages attributed to machines. This metric is reliable starting April 20, 2025.
        converted:
          type: integer
