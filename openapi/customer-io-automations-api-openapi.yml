openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Automations API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Automations
  x-displayName: Automations/Campaigns
  description: An automation, sometimes referred to as a campaign, is a workflow that people in your audience trigger and traverse.
paths:
  /v1/campaigns:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    get:
      summary: List automations
      operationId: listCampaigns
      security:
      - Bearer-Auth: []
      description: Returns a list of your automations and associated metadata.
      tags:
      - Automations
      responses:
        '200':
          description: Returns an array of automation objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    description: Each object is an automation in your workspace with one of seven types of automation triggers.
                    items:
                      $ref: '#/components/schemas/campaignObject'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    get:
      summary: Get an automation
      operationId: getCampaigns
      security:
      - Bearer-Auth: []
      description: Returns metadata for an individual automation.
      tags:
      - Automations
      responses:
        '200':
          description: Returns metadata for the automation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    description: An automation in your workspace with one of seven types of automation triggers.
                    $ref: '#/components/schemas/campaignObject'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - name: version
      in: query
      required: false
      description: 'Send `2`. We recommend version 2: it takes an explicit window (`start`, `end`, and `res`) in the time zone you pass as `tz`.


        Any other value, including leaving the parameter off, uses version 1: a window derived from `period` and `steps`, always in Eastern time.

        '
      example: '2'
      schema:
        type: string
        enum:
        - '1'
        - '2'
    - name: res
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. Sets the increment for each point in the series—hourly, daily, weekly, or monthly.'
      example: days
      schema:
        type: string
        enum:
        - hours
        - hourly
        - days
        - daily
        - weeks
        - weekly
        - months
        - monthly
    - name: start
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. The unix timestamp for the beginning of your metrics.'
      example: 1735718400
      schema:
        type: integer
        format: unix timestamp
    - name: end
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. The unix timestamp for the end of your metrics. Limited to 10 years from the `start` parameter.'
      example: 1735804800
      schema:
        type: integer
        format: unix timestamp
    - name: tz
      in: query
      required: false
      description: '**Version 2.** The time zone for the window you request. Defaults to UTC. Use the [region format](/messaging/send/timezones/example-timezones/#region-format).'
      examples:
        default:
          value: America/New_York
          x-disabled: true
      schema:
        type: string
    - name: period
      in: query
      required: false
      deprecated: true
      description: '**Version 1.** The unit of time for your report. Send `version=2` and set `res` instead.'
      examples:
        default:
          value: days
          x-disabled: true
      schema:
        type: string
        default: days
        enum:
        - hours
        - days
        - weeks
        - months
    - name: steps
      in: query
      required: false
      deprecated: true
      description: '**Version 1.** The number of periods you want to return. Defaults to the maximum available, or `12` if the period is in `months`. Maximums are 24 hours, 45 days, 12 weeks, or 121 months. Days start at 00:00 EST, weeks at 00:00 EST on Sunday, months at 00:00 EST on the 1st. Send `version=2` and set `start` and `end` instead.'
      examples:
        default:
          value: 45
          x-disabled: true
      schema:
        type: integer
    - $ref: '#/components/parameters/metricType'
    get:
      summary: Get automation metrics
      operationId: campaignMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for an individual automation as a series of counts, oldest first—the 0-index of any result is the oldest point in the window.


        **We recommend version 2. Send `version=2`.** It accepts an explicit `start`, `end`, and `res`, reported in the `tz` you choose. Without it, the endpoint answers with version 1 behavior instead: a window built from `period` and `steps`, always in Eastern time.


        Version 1 can''t return fewer than 2 steps of any period. `?period=days&steps=1` means two days—the 48 hours before the request—and `?period=days&steps=0` returns the maximum for the period, the same as `?period=days&steps=45`.'
      tags:
      - Automations
      x-codeSamples:
      - label: cURL
        lang: shell
        source: "curl --request GET \\\n  --url \"https://api.customer.io/v1/campaigns/{campaign_id}/metrics?start=1735718400&end=1735804800&res=days&version=2\"\n"
      - label: Node.js (SDK)
        lang: javascript
        source: "const http = require(\"https\");\n\nconst options = {\n  \"method\": \"GET\",\n  \"hostname\": \"api.customer.io\",\n  \"port\": null,\n  \"path\": \"/v1/campaigns/{campaign_id}/metrics?start=1735718400&end=1735804800&res=days&version=2\",\n  \"headers\": {}\n};\n\nconst req = http.request(options, function (res) {\n  const chunks = [];\n\n  res.on(\"data\", function (chunk) {\n    chunks.push(chunk);\n  });\n\n  res.on(\"end\", function () {\n    const body = Buffer.concat(chunks);\n    console.log(body.toString());\n  });\n});\n\nreq.end();\n"
      - label: Ruby (SDK)
        lang: ruby
        source: 'require ''uri''

          require ''net/http''

          require ''openssl''


          url = URI("https://api.customer.io/v1/campaigns/{campaign_id}/metrics?start=1735718400&end=1735804800&res=days&version=2")


          http = Net::HTTP.new(url.host, url.port)

          http.use_ssl = true

          http.verify_mode = OpenSSL::SSL::VERIFY_NONE


          request = Net::HTTP::Get.new(url)


          response = http.request(request)

          puts response.read_body

          '
      - label: Python (SDK)
        lang: python
        source: 'import http.client


          conn = http.client.HTTPSConnection("api.customer.io")


          conn.request("GET", "/v1/campaigns/{campaign_id}/metrics?start=1735718400&end=1735804800&res=days&version=2")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))

          '
      - label: Go (SDK)
        lang: go
        source: "package main\n\nimport (\n  \"fmt\"\n  \"net/http\"\n  \"io/ioutil\"\n)\n\nfunc main() {\n\n  url := \"https://api.customer.io/v1/campaigns/{campaign_id}/metrics?start=1735718400&end=1735804800&res=days&version=2\"\n\n  req, _ := http.NewRequest(\"GET\", url, nil)\n\n  res, _ := http.DefaultClient.Do(req)\n\n  defer res.Body.Close()\n  body, _ := ioutil.ReadAll(res.Body)\n\n  fmt.Println(res)\n  fmt.Println(string(body))\n\n}\n"
      responses:
        '200':
          description: Returns automation metrics by `series` based on the parameters of the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  start:
                    type: string
                    format: ISO 8601
                    description: The start period set in the request, in ISO 8601 format.
                    example: 2025-01-01 00:00:00 +0000 UTC
                  end:
                    type: string
                    format: ISO 8601
                    description: The end period set in the request, in ISO 8601 format.
                    example: 2025-01-02 00:00:00 +0000 UTC
                  res:
                    type: string
                    description: The resolution for metrics set in the request.
                    enum:
                    - hours
                    - hourly
                    - days
                    - daily
                    - weeks
                    - weekly
                    - months
                    - monthly
                    example: days
                  metric:
                    type: object
                    properties:
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/unique'
    get:
      summary: Get automation link metrics
      operationId: campaignLinkMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for link clicks within an automation, both in total and in `series` periods (days, weeks, etc). `series` metrics are ordered oldest to newest (i.e. the 0-index for any result is the oldest step/period).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Automations
      responses:
        '200':
          description: Returns an array of link objects. Each object represents a different link in your automation and contains independent metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/actions:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/start'
    get:
      summary: List automation actions
      operationId: listCampaignActions
      security:
      - Bearer-Auth: []
      description: 'Returns the operations in an automation workflow. Each object in the response represents an action or ''tile'' in the automation builder.


        This endpoint returns up to 10 `actions` at a time. If there is another page of results, the response will include a `next` string. Pass this string as the `start` parameter to get the next page of results.


        You get the actions that have content, like messages, attribute updates, and events—not delays or flow control blocks like t/f branches.


        If a message block contains multiple languages, this endpoint returns an object for each language variant. Each language variant includes the `multi_language_branch_action_id` property with the same value. Use this id to retrieve metrics for each language variant in a single request through Get automation action metrics.'
      tags:
      - Automations
      responses:
        '200':
          description: Returns automation `actions`. Each object represents an individual action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    description: Each object in the array represents an action in your automation.
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/actionObject'
                  next:
                    $ref: '#/components/schemas/next'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/messages:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/start'
    - $ref: '#/components/parameters/limit-50-1000'
    - $ref: '#/components/parameters/metricType'
    - $ref: '#/components/parameters/metric'
    - $ref: '#/components/parameters/drafts'
    - $ref: '#/components/parameters/start_ts'
    - $ref: '#/components/parameters/end_ts'
    - $ref: '#/components/parameters/get_tracked_responses'
    get:
      summary: Get automation message metadata
      operationId: getCampaignMessages
      security:
      - Bearer-Auth: []
      description: 'Returns information about the deliveries (instances of messages sent to individual people) sent from an automation. Provide query parameters to refine the metrics you want to return.

        Use the `start_ts` and `end_ts` to find messages within a time range. If your request doesn''t include `start_ts` and `end_ts` parameters, we''ll return the most recent 6 months of messages. If your `start_ts` and `end_ts` range is more than 12 months, we''ll return 12 months of data from the most recent timestamp in your request. Timestamps reflect when deliveries were created in our system, not when they were actually sent to recipients. There may be a delay between creation and sending.'
      tags:
      - Automations
      responses:
        '200':
          description: Returns an array of `messages`. Each object represents a different message in your automation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/messageObject'
              examples:
                email:
                  summary: An email message
                  value:
                    messages:
                    - id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=
                      deduplicate_id: dgOq6QWq6QUDAAF22PaOyFVqVxHY3rI5fsg=:1609957872
                      msg_template_id: 0
                      action_id: 196
                      customer_id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                      customer_identifiers:
                        id: 1a55d8d1-b13d-4f1f-858f-a93ef21e3a7d
                        email: person@example.com
                        cio_id: 3000001
                      recipient: person@email.com
                      subject: Did you get that thing I sent you?
                      metrics:
                        delivered: 1609957872
                        sent: 1609957832
                      created: 1609957805
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 89
                      broadcast_id: null
                      type: email
                      forgotten: false
                in-app:
                  summary: An in-app message with tracked survey responses
                  value:
                    messages:
                    - id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=
                      deduplicate_id: bX2r7YZq8RCAAB5_DGopeWY8nGlEcSGv8fl=:1715769500
                      msg_template_id: 87
                      action_id: 312
                      customer_id: user_2048
                      customer_identifiers:
                        id: user_2048
                        cio_id: '04000001'
                      recipient: user_2048
                      subject: null
                      metrics:
                        opened: 1715769550
                        sent: 1715769500
                      created: 1715769500
                      failure_message: null
                      newsletter_id: null
                      content_id: null
                      campaign_id: 89
                      broadcast_id: null
                      type: in_app
                      forgotten: false
                      tracked_responses:
                        how-satisfied:
                          id: 1
                          ts: 1715769560
                        would-recommend:
                          id: 2
                          ts: 1715769565
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/actions/{action_id}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/action_id'
    get:
      summary: Get an automation action
      operationId: getCampaignAction
      security:
      - Bearer-Auth: []
      description: Returns information about a specific action in an automation.
      tags:
      - Automations
      responses:
        '200':
          description: Returns the requested automation `action`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/actionObject'
        '400':
          $ref: '#/components/responses/400-campaigns-lang'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update an automation action
      operationId: updateCampaignAction
      security:
      - Bearer-Auth: []
      description: 'Update the contents of an automation action, including the body of messages and HTTP requests.


        **NOTE**: You can''t manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateActionObject'
      responses:
        '200':
          description: Returns the updated automation `action`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/actionObject'
        '400':
          $ref: '#/components/responses/400-campaigns-lang'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/actions/{action_id}/language/{language}:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/action_id'
    - $ref: '#/components/parameters/language-2'
    get:
      summary: Get a translation of an automation message
      operationId: getCampaignActionTranslation
      security:
      - Bearer-Auth: []
      description: Returns a translated version of a message in an automation. The message is identified by the `action_id`.
      tags:
      - Automations
      responses:
        '200':
          description: Returns information for the requested automation `action` language variant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/actionObject'
        '400':
          $ref: '#/components/responses/400-campaigns-lang'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
    put:
      summary: Update a translation of an automation message
      operationId: updateCampaignActionTranslation
      security:
      - Bearer-Auth: []
      description: 'Update the contents of a language variant of an automation action, including the body of the messages and HTTP requests.


        **NOTE**: You can''t manage content made with Design Studio with this endpoint. Use the Design Studio APIs instead.'
      tags:
      - Automations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateActionObject'
      responses:
        '200':
          description: Returns the updated automation action.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: '#/components/schemas/actionObject'
        '400':
          $ref: '#/components/responses/400-campaigns-lang'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/actions/{action_id}/metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - name: action_id
      in: path
      required: true
      description: 'The action in the automation. If the action is a message with translations, you can pass the `id` of the action to get metrics for a specific language variant or pass the `multi_language_branch_action_id` to get metrics for each language variant and total metrics across the variants.

        '
      schema:
        type: integer
    - name: version
      in: query
      required: false
      description: 'Send `2`. We recommend version 2: it takes an explicit window (`start`, `end`, and `res`) in the time zone you pass as `tz`.


        Any other value, including leaving the parameter off, uses version 1: a window derived from `period` and `steps`, always in Eastern time.

        '
      example: '2'
      schema:
        type: string
        enum:
        - '1'
        - '2'
    - name: res
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. Sets the increment for each point in the series—hourly, daily, weekly, or monthly.'
      example: days
      schema:
        type: string
        enum:
        - hours
        - hourly
        - days
        - daily
        - weeks
        - weekly
        - months
        - monthly
    - name: start
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. The unix timestamp for the beginning of your metrics.'
      example: 1735718400
      schema:
        type: integer
        format: unix timestamp
    - name: end
      in: query
      required: false
      description: '**Version 2.** Required when you send `version=2`. The unix timestamp for the end of your metrics. Limited to 10 years from the `start` parameter.'
      example: 1735804800
      schema:
        type: integer
        format: unix timestamp
    - name: tz
      in: query
      required: false
      description: '**Version 2.** The time zone for the window you request. Defaults to UTC. Use the [region format](/messaging/send/timezones/example-timezones/#region-format).'
      examples:
        default:
          value: America/New_York
          x-disabled: true
      schema:
        type: string
    - name: period
      in: query
      required: false
      deprecated: true
      description: '**Version 1.** The unit of time for your report. Send `version=2` and set `res` instead.'
      examples:
        default:
          value: days
          x-disabled: true
      schema:
        type: string
        default: days
        enum:
        - hours
        - days
        - weeks
        - months
    - name: steps
      in: query
      required: false
      deprecated: true
      description: '**Version 1.** The number of periods you want to return. Defaults to the maximum available, or `12` if the period is in `months`. Maximums are 24 hours, 45 days, 12 weeks, or 121 months. Days start at 00:00 EST, weeks at 00:00 EST on Sunday, months at 00:00 EST on the 1st. Send `version=2` and set `start` and `end` instead.'
      examples:
        default:
          value: 45
          x-disabled: true
      schema:
        type: integer
    - $ref: '#/components/parameters/metricType'
    get:
      summary: Get automation action metrics
      operationId: campaignActionMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns metrics for an individual action, both in total and as a series of counts, oldest first—the 0-index of any result is the oldest point in the window.


        **We recommend version 2. Send `version=2`.** It accepts an explicit `start`, `end`, and `res`, reported in the `tz` you choose. Without it, the endpoint answers with version 1 behavior instead: a window built from `period` and `steps`, always in Eastern time.


        Version 1 can''t return fewer than 2 steps of any period. `?period=days&steps=1` means two days—the 48 hours before the request—and `?period=days&steps=0` returns the maximum for the period, the same as `?period=days&steps=45`.


        **Multi-language messages**


        If the action is a multi-language message, you can retrieve metrics for a single language variant or all language variants. To retrieve metrics for a single language variant, pass the `id` of the action. To retrieve aggregate metrics and a breakdown for each language variant, pass the `multi_language_branch_action_id`, which is the same for each variant of a message. You can get both ids from the List automation actions endpoint.


        If you pass the `multi_language_branch_action_id`, then the `metric` object shows the *total* across every variant. The `language_variants` object shows a breakdown for each language variant.


        If you want to get the sum of all metrics across all of an automation''s actions, you can use each action id of a multi-language message, like you would for other types of actions.'
      tags:
      - Automations
      responses:
        '200':
          description: Returns action metrics by `series`, where each increment is based on the `res` in your request. For a multi-language message, also returns a per-variant breakdown in `language_variants`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  start:
                    type: string
                    format: ISO 8601
                    description: The start of the window we reported on, in ISO 8601 format.
                    example: 2025-01-01 00:00:00 +0000 UTC
                  end:
                    type: string
                    format: ISO 8601
                    description: The end of the window we reported on, in ISO 8601 format.
                    example: 2025-01-02 00:00:00 +0000 UTC
                  res:
                    type: string
                    description: The resolution we reported at.
                    enum:
                    - hours
                    - hourly
                    - days
                    - daily
                    - weeks
                    - weekly
                    - months
                    - monthly
                    example: days
                  metric:
                    type: object
                    properties:
                      series:
                        $ref: '#/components/schemas/periodMessageMetrics'
                  language_variants:
                    $ref: '#/components/schemas/languageVariantMetrics'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/actions/{action_id}/metrics/links:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - $ref: '#/components/parameters/action_id'
    - $ref: '#/components/parameters/period'
    - $ref: '#/components/parameters/steps'
    - $ref: '#/components/parameters/metricType'
    - $ref: '#/components/parameters/unique'
    get:
      summary: Get link metrics for an action
      operationId: campaignActionLinks
      security:
      - Bearer-Auth: []
      description: 'Returns link click metrics for an individual action. Unless you specify otherwise, the response contains data for the maximum period by days (45 days).


        You cannot request fewer than 2 steps of any period (2 hours, 2 days, 2 weeks, or 2 months). For instance, `?period=days&steps=1` means two days - the 48 hours before the API request was made. `?period=days&steps=0` returns the same as the maximum of the period - `?period=days&steps=45`. See the `steps` parameter below for the maximum count of each period.'
      tags:
      - Automations
      responses:
        '200':
          description: Returns action metrics by `series` (with increments are based on the `period` and `step` in your request) for the automation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    description: Each object in the array represents a link in your action.
                    items:
                      $ref: '#/components/schemas/linkMetrics'
        '400':
          $ref: '#/components/responses/400-campaigns'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
  /v1/campaigns/{campaign_id}/journey_metrics:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/campaign_id'
    - name: start
      in: query
      description: The unix timestamp for the beginning of your journey metrics report.
      required: true
      schema:
        type: integer
        format: unix timestamp
        example: 1652718066
    - name: end
      in: query
      description: The unix timestamp for the end of your journey metrics report.
      required: true
      schema:
        type: integer
        format: unix timestamp
    - $ref: '#/components/parameters/journey_resolution'
    get:
      summary: Get automation journey metrics
      operationId: campaignJourneyMetrics
      security:
      - Bearer-Auth: []
      description: 'Returns a list of Journey Metrics for your automation. These metrics show how many people triggered your automation, were messaged, etc for the time period and "resolution" you set. You must provide the `start`, `end`, and `resolution` parameters or your request will return `400`.


        Metrics in the response are arrays, and each index in the array corresponds to the `resolution` in your request. If you request metrics in `days`, the first result in each metric array is the first day of results and each successive increment represents another day.


        Each increment represents the number of journeys that started within a time period and eventually achieved a particular metric. For example, array index 0 for the `converted` metric represents the number of journeys that started on the first day/month of results that achieved a conversion.'
      tags:
      - Automations
      responses:
        '200':
          description: Each `journey_metric` item in the response is an array. Each item in a metric array represents the number of journeys that started within the time increment ("resolution"—day or month) and eventually achieved that metric.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journey_metric:
                    type: object
                    properties:
                      started:
                        description: The total number of people who meet the trigger criteria for a journey. This count occurs before filters are applied.
                        type: array
                        items:
                          type: integer
                      activated:
                        description: People who started a journey and were not filtered out before they experienced an action.
                        type: array
                        items:
                          type: integer
                      exited_early:
                        description: People who started a journey but stopped meeting the automation trigger/filter criteria.
                        type: array
                        items:
                          type: integer
                      finished:
                        description: People who finished the journey.
                        type: array
                        items:
                          type: integer
                      converted:
                        description: People who matched the conversion criteria for the automation.
                        type: array
                        items:
                          type: integer
                      never_activated:
                        description: People who started a journey but were filtered out before they could experience any of the actions in the journey.
                        type: array
                        items:
                          type: integer
                      messaged:
                        description: People who experienced at least one non-delay action in the journey. This metric typically represents journeys in progress.
                        type: array
                        items:
                          type: integer
        '400':
          description: You may have omitted query parameters or the `start` time occurred after the `end` time. The `campaignID` or `actionID` may also be invalid.
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-codeSamples:
      - label: cURL
        lang: shell
        source: 'curl --request GET \

          --url ''https://api.customer.io/v1/campaigns/{campaign_id}/journey_metrics?start=1650151266&end=1652052066&resolution=weeks'' \

          --header ''Authorization: Bearer REPLACE_BEARER_TOKEN''

          '
      - label: Node.js (SDK)
        lang: javascript
        source: "const http = require(\"https\");\n\nconst options = {\n  method: \"GET\",\n  hostname: \"api.customer.io\",\n  port: null,\n  path: \"/v1/campaigns/{campaign_id}/journey_metrics?start=1650151266&end=1650151266&resolution=weeks\",\n  headers: {\n    Authorization: \"Bearer REPLACE_BEARER_TOKEN\",\n  },\n};\n\nconst req = http.request(options, function (res) {\n  const chunks = [];\n  res.on(\"data\", function (chunk) {\n    chunks.push(chunk);\n  });\n  res.on(\"end\", function () {\n    const body = Buffer.concat(chunks);\n    console.log(body.toString());\n  });\n});\n\nreq.end();\n"
      - label: Ruby (SDK)
        lang: ruby
        source: 'require ''uri''

          require ''net/http''

          require ''openssl''


          url = URI(''https://api.customer.io/v1/campaigns/{campaign_id}/journey_metrics'')

          params = { start: ''1650151266'', end: ''1652052066'', resolution: ''weeks'' }

          url.query = URI.encode_www_form(params)


          http = Net::HTTP.new(url.host, url.port)

          http.use_ssl = true

          http.verify_mode = OpenSSL::SSL::VERIFY_NONE


          request = Net::HTTP::Get.new(url)

          request[''Authorization''] = ''Bearer REPLACE_BEARER_TOKEN''


          response = http.request(request)

          puts response.read_body

          '
      - label: Python (SDK)
        lang: python
        source: "import requests\n\nurl = \"https://api.customer.io/v1/campaigns/{campaign_id}/journey_metrics\"\n\nheaders = { \"Authorization\": \"Bearer REPLACE_BEARER_TOKEN\" }\n\nparams = {\n    \"start\": \"1650151266\",\n    \"end\": \"1652052066\",\n    \"resolution\": \"weeks\"\n}\n\nr = requests.get(url=url, params=params, headers=headers)\n\ndata = r.json()\n\nprint(data)\n"
      - label: Go (SDK)
        lang: go
        source: "package main\n\nimport (\n  \"fmt\"\n  \"io/ioutil\"\n  \"net/http\"\n)\n\nfunc main() {\n\n  url := \"https://api.customer.io/v1/campaigns/{campaign_id}/journey_metrics\"\n\n  req, _ := http.NewRequest(\"GET\", url, nil)\n  req.Header.Add(\"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\")\n\n  params := req.URL.Query()\n  params.Add(\"start\", \"1650151266\")\n  params.Add(\"end\", \"1652052066\")\n  params.Add(\"resolution\", \"weeks\")\n  req.URL.RawQuery = params.Encode()\n\n  res, _ := http.DefaultClient.Do(req)\n\n  defer res.Body.Close()\n  body, _ := ioutil.ReadAll(res.Body)\n\n  fmt.Println(res)\n  fmt.Println(string(body))\n\n}\n"
components:
  schemas:
    content_id:
      x-scalar-ignore: true
      description: The identifier for a message in a one-time send. One-time sends can have multiple content IDs (for multi-language messages or A/B tests).
      type: integer
      readOnly: true
      example: 1
    preheader_text:
      x-scalar-ignore: true
      type: string
      description: '[Also known as "preview text"](/journeys/channels/email/headers/custom-preheader-text/), this is the small block of text shown in an email inbox next to or underneath the subject line.

        '
    customer_identifiers:
      x-scalar-ignore: true
      type: object
      description: Identifiers for the person in a response—`id`, `cio_id`, and `email`. Unset `id` or `email` values are `null`. We recommend this object over the less descriptive `customer_id`. This object doesn't include `phone`, even if your workspace uses phone numbers as an identifier; look for the person's `phone` attribute instead.
      required:
      - email
      - id
      - cio_id
      properties:
        email:
          type:
          - string
          - 'null'
          format: email
          description: A person's email address, if set.
          example: test@example.com
        id:
          type:
          - string
          - 'null'
          description: A person's unique ID, if set. This is the same as the `customer_id` if present.
          example: 2
        cio_id:
          $ref: '#/components/schemas/cio_id'
    action_id:
      x-scalar-ignore: true
      description: The identifier for an action.
      type: integer
      readOnly: true
      example: 96
    parent_action_id:
      x-scalar-ignore: true
      type: integer
      description: The ID of the parent action, if the action occurred within an automation and has a parent (like a randomized split, etc).
      example: 1
      readOnly: true
    headers:
      x-scalar-ignore: true
      description: A JSON string containing header objects with `name` and `value`. Names and values must be strings, with no non-ASCII characters or spaces. You can't overwrite reserved headers.
      type: string
      format: json
      example: '[{"name":"X-Mailgun-Tag","value":"my-cool-tag"},{"name":"X-Custom-Header","value":"custom-value"}]'
    linkMetrics:
      x-scalar-ignore: true
      type: object
      properties:
        link:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the link.
              example: 1234
            href:
              type: string
              description: The link destination—a URL, mailto, etc.
              example: https://docs.customer.io
        metric:
          type: object
          description: Contains metrics for the link.
          properties:
            series:
              type: object
              properties:
                clicked:
                  type: array
                  description: An array of results from oldest to newest, where each result indicates a period.
                  items:
                    type: integer
                  example:
                  - 1
                  - 3
                  - 5
                  - 7
                human_clicked:
                  type: array
                  description: An array of human click counts (clicks excluding machine clicks) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  - 4
                machine_clicked:
                  type: array
                  description: An array of machine click counts (clicks attributed to bots or prefetching) from oldest to newest, where each result indicates a period. This metric is reliable starting April 20, 2025. [Learn more](/messaging/metrics/analytics/#delivery-metrics).
                  items:
                    type: integer
                  example:
                  - 0
                  - 1
                  - 1
                  - 2
    bcc:
