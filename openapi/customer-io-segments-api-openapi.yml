                          - 'null'
                          description: The tags assigned to the segment, if any. Tags may help you sort through your segments.
                          items:
                            type: string
                          example: null
                        created_at:
                          x-scalar-ignore: true
                          type: integer
                          format: unix timestamp
                          description: The date time when the referenced ID was created.
                          example: 1552341937
