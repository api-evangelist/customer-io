                          - finished
                        progress:
                          type:
                          - integer
                          - 'null'
                          description: If Customer.io has not finished processing the segment, this indicates the percentage complete. Otherwise, this key is null.
                          example: null
                        type:
                          type: string
                          description: The type of segment.
                          enum:
