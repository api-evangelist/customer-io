openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference Send Messages API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Send Messages
  description: Use these endpoints to send broadcasts or transactional messages to your audience.
paths:
  /v1/campaigns/{broadcast_id}/triggers:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: broadcast_id
      in: path
      required: true
      description: The ID of the broadcast that you want to trigger.
      schema:
        type: integer
    post:
      operationId: triggerBroadcast
      tags:
      - Send Messages
      summary: Send an API-triggered broadcast
      security:
      - Bearer-Auth: []
      description: 'Trigger a broadcast and optionally provide data to populate liquid placeholders in the message. To trigger one-time send broadcasts, use the one-time send endpoint.


        Broadcasts are optimized to send messages to a large audience and not for one-to-one interactions. Use our transactional API or event-triggered automations to respond to your audience on an individual, one-to-one basis.


        **Define your audience**


        **The shape of the request depends on how you define your audience**: default (the recipients set in the UI), custom conditions, a list of emails, a list of customer IDs, a map of users, or a data file.


        You can narrow any of these audiences, except the default audience, with the `filter` object. This is useful when a file or a list of people is broader than the audience you want for your broadcast.


        **You can only trigger broadcasts to send to people you''ve already added to your workspace.** A broadcast cannot add or identify new people. If you reference people who don''t exist in your broadcast audience, the broadcast will fail by default. You can override this behavior by setting the `email_ignore_missing` and/or `id_ignore_missing` flags to `true`. The broadcast will skip over any people who don''t exist in your workspace and send to the remaining recipients.


        You can reference properties in the `data` object in your broadcast using liquid—`{{trigger.}}`.


        **Send or schedule your broadcast**


        By default, we send your broadcast as soon as you trigger it. Set `scheduled_at` to send it at a future time instead. You can cancel the trigger to stop a scheduled send before it starts sending. You can''t change a trigger''s `scheduled_at` value later; if you need to reschedule your broadcast, you must cancel the trigger and re-trigger the broadcast with the new timestamp.


        If your broadcast produces a `422` error, you can get more information about the errors to see what went wrong.


        **This endpoint is rate-limited to one request every 10 seconds.** After exceeding this, you''ll receive a status of `429`. Learn more about API-triggered broadcast limits above.'
      requestBody:
        content:
          application/json:
            x-rate-limit: 10
            schema:
              $ref: '#/components/schemas/campaignRequest'
      responses:
        '200':
          description: A successful request returns the trigger ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: The `trigger_id` for this operation. You can use this ID to get the status of your broadcast or [check for errors](/integrations/api/app/tag/broadcasts/broadcastErrors/).
                    example: 3
        '401':
          $ref: '#/components/responses/401'
        '404':
          description: The `broadcast_id` does not exist.
        '422':
          description: The broadcast has one or more validation errors. You can learn more by [checking your broadcast for errors](/integrations/api/app/tag/broadcasts/broadcastErrors/) using the `trigger_id` found in the error `detail`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    description: Contains one or more validation errors found in your request payload.
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          description: Describes the error and provides the trigger ID you can use to look up more information.
                          example: Errors were found while processing per user data (ids, emails or json data). More detail available from the errors endpoint for trigger 12"
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                              description: Points to the key in your payload that contained validation errors.
                              example: /data/attributes/per_user_data
                        status:
                          type: string
                          description: The error code.
                          enum:
                          - '422'
                          example: '422'
      x-codeSamples:
      - label: Node.js (SDK)
        lang: javascript
        source: "const { APIClient, RegionUS } = require('customerio-node');\nconst api = new APIClient('bearer-app-key', { region: RegionUS });\n\nconst data = {\n  headline: 'Roadrunner spotted in Albuquerque!',\n  date: 1511315635,\n  text:\n    \"We've received reports of a roadrunner in your immediate area! Head to your dashboard to view more information!\",\n};\n\napi.triggerBroadcast(campaignId, data, { segment: { id: 7 } });\n"
  /v1/campaigns/{broadcast_id}/triggers/{trigger_id}/cancel:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: broadcast_id
      in: path
      required: true
      description: The ID of the broadcast you triggered.
      schema:
        type: integer
        example: 3
    - name: trigger_id
      in: path
      required: true
      description: The ID of the trigger you want to cancel. You get it back from the [trigger](/integrations/api/app/tag/send-messages/triggerBroadcast/) request that scheduled the send.
      schema:
        type: integer
        example: 12
    post:
      operationId: cancelBroadcastTrigger
      security:
      - Bearer-Auth: []
      tags:
      - Send Messages
      summary: Cancel a scheduled broadcast
      description: 'Cancel a trigger you scheduled with `scheduled_at`, before it fires.


        The request fails if the broadcast has started calculating its audience, is already sending, or has already sent.'
      responses:
        '200':
          description: The trigger was canceled. Returns the trigger's current state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The ID of the trigger you canceled.
                        example: 12
                      broadcast_id:
                        type: integer
                        description: The ID of the broadcast you cancelled the trigger for. Canceling a trigger doesn't cancel the broadcast itself, so you can trigger it again.
                        example: 3
                      created_at:
                        type: integer
                        description: Unix timestamp when you created this trigger.
                        example: 1796040000
                      scheduled_at:
                        type: integer
                        description: Unix timestamp when the trigger was scheduled to send.
                        example: 1796128200
                      cancelled_at:
                        type: integer
                        description: Unix timestamp when the trigger was cancelled, or `0` if it hasn't been cancelled.
                        example: 1796041200
                      processed_at:
                        type: integer
                        description: Unix timestamp when Customer.io processed the trigger, or `0` if it hasn't. A canceled trigger usually shows `0`. In rare cases the send job starts before it sees the cancel request, exits without sending anything, and stamps this value anyway.
                        example: 0
                      expires_after:
                        type: integer
                        description: The send window in seconds that you set when you triggered the broadcast, or `0` if the send has no expiry.
                        example: 0
        '400':
          $ref: '#/components/responses/400-broadcasts'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404-broadcasts'
        '409':
          description: When the broadcast is resolving its audience, already sending, or already sent.
  /v1/newsletters/{newsletter_id}/send:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    post:
      operationId: sendNewsletter
      tags:
      - Send Messages
      summary: Trigger a one-time send
      security:
      - Bearer-Auth: []
      description: 'Trigger a one-time send (referred to as a "newsletter" in our APIs) immediately. It must be in a draft state. If it has already been sent, you''ll get a `400` error. The recipients are fixed when you create the one-time send. If you''re not sure who will receive it, you can use the List one-time sends endpoint to get a list of one-time sends and their recipients.


        To reschedule a one-time send, use the Schedule a one-time send endpoint instead.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/newsletterRateLimitOptions'
              - type: object
                properties:
                  expires_after:
                    type: integer
                    minimum: 0
                    maximum: 2592000
                    description: 'A send window in seconds measured from the moment the send starts, or `0` for no expiry. Customer.io stops delivering the one-time send once the window closes. You can''t combine it with send time optimization, and on an A/B test it must outlast the test duration.

                      '
            examples:
              rateLimited:
                value:
                  rate_limit_email_rate: 1000
                  rate_limit_time_period: 3600
                  rate_limit_spread: true
              expiring:
                summary: stop delivering after 6 hours
                value:
                  expires_after: 21600
      responses:
        '200':
          description: The one-time send is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    $ref: '#/components/schemas/newsletterObject'
        '400':
          description: 'The request is invalid. Possible reasons include:

            - The one-time send has already been sent

            - The one-time send doesn''t have a valid channel set

            - No recipients have been configured

            - Segments are still processing

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newsletterErrorResponse'
        '404':
          description: The one-time send does not exist.
        '422':
          description: 'Validation error. The rate limit configuration is incomplete—if you provide `rate_limit_email_rate`, you must also provide `rate_limit_time_period` (and vice versa).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newsletterErrorResponse'
        '429':
          $ref: '#/components/responses/429'
  /v1/newsletters/{newsletter_id}/schedule:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - $ref: '#/components/parameters/newsletter_id'
    post:
      operationId: scheduleNewsletter
      tags:
      - Send Messages
      summary: Schedule a one-time send
      security:
      - Bearer-Auth: []
      description: 'Schedule a one-time send (referred to as a "newsletter" in our APIs) to send at a specific time. It must be in a draft state. If it has already been sent, you''ll get a `400` error. If it''s already scheduled, this endpoint updates the scheduled time.


        The response returns the one-time send, so you can read back the schedule you set: `send_state` and `scheduled_at` are always included, and `timezone` and `tz_match_enabled` are included when they apply.


        To retrieve the schedule parameters after scheduling with Get a one-time send. After you start a send with timezone-match, `scheduled_at` reports the next timezone batch or the remainder of an A/B test instead of the time you requested.


        The recipients are fixed when you create the one-time send. If you''re not sure who will receive it, you can use the List one-time sends endpoint to get a list of one-time sends and their recipients.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newsletterScheduleRequest'
      responses:
        '200':
          description: The one-time send is scheduled for sending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    $ref: '#/components/schemas/newsletterObject'
              example:
                newsletter:
                  id: 128275
                  deduplicate_id: 128275:1481653929
                  type: email
                  content_ids:
                  - 45
                  name: Weekly Product Update
                  sent_at: null
                  send_state: scheduled
                  scheduled_at: 1719849600
                  timezone: America/New_York
                  created: 1481653919
                  updated: 1481653929
                  recipient_segment_ids:
                  - 42
                  - 99
                  subscription_topic_id: 5
        '400':
          description: 'The request is invalid. Possible reasons include:

            - The one-time send has already been sent

            - The one-time send doesn''t have a valid channel set

            - No recipients have been configured

            - The one-time send is not currently scheduled (when descheduling with `scheduled_at: 0`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newsletterErrorResponse'
        '404':
          description: The one-time send does not exist.
        '422':
          description: 'Validation error. Possible reasons include:

            - `scheduled_at` is required

            - `scheduled_at` must be in the future

            - `timezone` is required (when `scheduled_at` is set)

            - Unknown timezone value

            - Incomplete rate limit—both `rate_limit_email_rate` and `rate_limit_time_period` are required when setting a rate limit

            - Cannot set rate limit periods longer than one hour when sending in the recipient''s timezone (`tz_match`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newsletterErrorResponse'
        '429':
          $ref: '#/components/responses/429'
  /v1/send/email:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      summary: Send a transactional email
      operationId: sendEmail
      security:
      - Bearer-Auth: []
      - ServiceAccount-Auth: []
      description: 'Send a transactional email. While not strictly required, we recommend that you include a `transactional_message_id` in your request. If you don''t, Customer.io attributes metrics to `"transactional_message_id": 1`, so multiple messages can roll up under the same ID.


        If this is the first time you send a message with the API, you can include the `auto_create` parameter along with a `transactional_message_id` string to create a record for you.


        You can also include a `body`, `subject`, and `from` values to override the message template. Or, if you create your message entirely through the API, you *must* include these values because your `transactional_message_id` won''t have any content. See Examples and API parameters for more details.'
      tags:
      - Send Messages
      parameters:
      - $ref: '#/components/parameters/workspace_id_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendemail'
      responses:
        '200':
          description: Returns a unique ID for the delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_id:
                    type: string
                    description: A unique identifier for the message.
                  queued_at:
                    type: integer
                    format: unix timestamp
                    description: A Unix timestamp for when Customer.io accepted and queued your request. For scheduled messages (using `send_at`), this is when we received your request, not when the message sends.
                  send_at:
                    type: integer
                    format: unix timestamp
                    description: For a scheduled message, the Unix timestamp when the message is set to send. Returned only when you provide a future `send_at`.
        '400':
          description: The request was malformed or the attachment is not base64-encoded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
                        example: '`Attachment must be base64 encoded: "filename.xyz"

                          '
        '403':
          description: Your attachment is not in a recognized format.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
                        example: Forbidden file type xyz for attachment filename.xyz.
        '413':
          description: This typically means your attachment exceeds the size limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
                        example: Total attachment size exceeds the limit
  /v1/send/in_app:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      summary: Send a transactional in-app message
      operationId: sendInApp
      security:
      - Bearer-Auth: []
      - ServiceAccount-Auth: []
      description: 'Send a transactional in-app message. In-app messages render in your application through the Customer.io SDK to the devices associated with the person you target by `identifiers`.


        You send a message using a `transactional_message_id` for an in-app message template that you''ve set up in the user interface. The `transactional_message_id` can be either the numerical ID for the template or the *Trigger Name* that you assigned the template.


        You can find your `transactional_message_id` from the code sample in the **Overview** tab for your transactional message in the user interface, or you can look up a list of your transactional messages through the App API.


        **Note**: Your workspace must have in-app messaging enabled. Requests sent to a workspace without the in-app capability return `403`.'
      tags:
      - Send Messages
      parameters:
      - $ref: '#/components/parameters/workspace_id_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendinapp'
      responses:
        '200':
          description: Returns a unique ID for the delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_id:
                    type: string
                    description: A unique identifier for the message.
                  queued_at:
                    type: integer
                    format: unix timestamp
                    description: A Unix timestamp for when Customer.io accepted and queued your request. For scheduled messages (using `send_at`), this is when we received your request, not when the message sends.
                  send_at:
                    type: integer
                    format: unix timestamp
                    description: For a scheduled message, the Unix timestamp when the message is set to send. Returned only when you provide a future `send_at`.
        '400':
          description: The request was malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
        '403':
          description: Your workspace is not authorized for transactional messaging or in-app messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
                        example: Account is not authorized for transactional messaging. Contact win@customer.io for support.
  /v1/send/inbox_message:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      summary: Send a transactional inbox message
      operationId: sendInboxMessage
      security:
      - Bearer-Auth: []
      - ServiceAccount-Auth: []
      description: 'Send a transactional inbox message. Inbox messages deliver raw JSON payloads to your application through our JavaScript SDK, allowing you to build custom notification centers, message feeds, and other UI components.


        You send a message using a `transactional_message_id` for an inbox message template created in the user interface. The `transactional_message_id` can be either the numerical ID for the template or the *Trigger Name* that you assigned the template.


        You can find your `transactional_message_id` from the code sample in the **Overview** tab for your transactional message in the user interface, or you can look up a list of your transactional messages through the App API.


        **Note**: Inbox messages are currently available for web platforms only and require the Customer.io In-App Plugin to be installed.'
      tags:
      - Send Messages
      parameters:
      - $ref: '#/components/parameters/workspace_id_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendinbox'
      responses:
        '200':
          description: Returns a unique ID for the delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_id:
                    type: string
                    description: A unique identifier for the message.
                  queued_at:
                    type: integer
                    format: unix timestamp
                    description: A Unix timestamp for when Customer.io accepted and queued your request. For scheduled messages (using `send_at`), this is when we received your request, not when the message sends.
                  send_at:
                    type: integer
                    format: unix timestamp
                    description: For a scheduled message, the Unix timestamp when the message is set to send. Returned only when you provide a future `send_at`.
        '400':
          description: The request was malformed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Contains errors.
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
        '403':
          description: Your workspace is not authorized for transactional messaging or inbox messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      error:
                        type: string
                        description: Describes the error that caused your request to fail.
                        example: Account is not authorized for transactional messaging. Contact win@customer.io for support.
  /v1/send/push:
    servers:
    - url: https://api.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    - url: https://api-eu.customer.io
      description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    post:
      summary: Send a transactional push
      operationId: sendPush
      security:
      - Bearer-Auth: []
      - ServiceAccount-Auth: []
      description: 'Send a transactional push. You send a message using a `transactional_message_id` for a transactional push message template composed in the user interface. You can optionally override any of the template values at send time. The `transactional_message_id` can be either the numerical ID for the template or the *Trigger Name* that you assigned the template.


        You can find your `transactional_message_id` from the code sample in the **Overview** tab for your transactional message in the user interface, or you can look up a list of your transactional messages through the App API.'
      tags:
      - Send Messages
      parameters:
      - $ref: '#/components/parameters/workspace_id_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendpush'
      responses:
        '200':
          description: Returns a unique ID for the delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_id:
                    type: string
                    description: A unique identifier for the message.
                  queued_at:
                    type: integer
                    format: unix timestamp
