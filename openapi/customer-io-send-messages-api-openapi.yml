      security:
      - Bearer-Auth: []
      - ServiceAccount-Auth: []
      description: 'Send a transactional in-app message. In-app messages render in your application through the Customer.io SDK to the devices associated with the person you target by `identifiers`.


        You send a message using a `transactional_message_id` for an in-app message template that you''ve set up in the user interface. The `transactional_message_id` can be either the numerical ID for the template or the *Trigger Name* that you assigned the template.


        You can find your `transactional_message_id` from the code sample in the **Overview** tab for your transactional message in the user interface, or you can look up a list of your transactional messages through the [App API](#tag/Transactional).


        **Note**: Your workspace must have in-app messaging enabled. Requests sent to a workspace without the in-app capability return `403`.

        '
      tags:
      - Send Messages
      parameters:
      - x-scalar-ignore: true
        name: X-Workspace-Id
        in: header
        required: false
        description: 'The numeric ID of the workspace you want to send a message in. This header is only needed when you authenticate with a service-account bearer token (`sa_live_…`). Service accounts work across workspaces, so you must supply this header so we know which workspace to send from. You can omit this header when you authenticate with a standard App API key, which is always scoped to one workspace.

          '
        schema:
          type: integer
          example: 100
      requestBody:
        content:
          application/json:
            schema:
              x-scalar-ignore: true
              allOf:
              - type: object
                required:
                - transactional_message_id
                - identifiers
                properties:
                  transactional_message_id:
                    description: The transactional message template that you want to use for your message. You can call the template by its numerical ID or by the *Trigger Name* that you assigned to the template in the UI (case insensitive).
                    oneOf:
                    - title: ID (integer)
                      type: integer
                      description: The ID of the transactional message you want to send.
                      example: 44
                    - title: Trigger Name (string)
                      type: string
                      description: The name of trigger for the transactional message you want to send; you set the trigger name in the *Configure Settings* step when setting up your message. This is case insensitive.
                      example: order_confirmation
                  identifiers:
                    description: Identifies the person represented by your transactional message by one of, and only one of, `id`, `email`, or `cio_id`.
                    oneOf:
                    - title: id
                      type: object
                      required:
                      - id
                      properties:
