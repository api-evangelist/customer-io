  /v1/newsletters/{newsletter_id}/send:
    servers:
    - url: https://api.customer.io
      description: This API uses bearer authorization, requiring a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
    parameters:
    - name: newsletter_id
      in: path
      required: true
      description: The identifier of a newsletter.
      schema:
        type: integer
    post:
      operationId: sendNewsletter
      tags:
      - Send Messages
      summary: Send a newsletter
      security:
      - Bearer-Auth: []
      description: 'Send a newsletter immediately. The newsletter must be in a draft state. If the newsletter has already been sent, you''ll get a `400` error. The recipients for the newsletter are defined when you create/update the newsletter. If you''re not sure who will receive the newsletter, you can use the [List newsletters](/integrations/api/app/#tag/newsletters/listNewsletters) endpoint to get a list of newsletters and their recipients.


        To reschedule a newsletter, use the [Schedule a newsletter](#tag/send-messages/scheduleNewsletter) endpoint instead.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              example:
                rate_limit_email_rate: 500
                rate_limit_time_period: 60
                rate_limit_spread: true
              description: Optional newsletter rate limiting. If you set `rate_limit_email_rate` or `rate_limit_time_period`, set both; `rate_limit_spread` can be set alone.
              properties:
                rate_limit_email_rate:
                  type: integer
                  minimum: 1
                  description: 'Maximum number of messages per time period. **NOTE:** Though this states `email_rate`, you can use this for other message channels. Only fixed rate limits are supported, not [daily ramp limits](/journeys/send/broadcasts/newsletters/#daily-ramp).

                    '
                rate_limit_time_period:
                  type: integer
                  enum:
                  - 60
                  - 3600
                  - 86400
                  description: Time period in seconds for rate limiting. Must be one of 60 (minute), 3600 (hour), or 86400 (day).
                rate_limit_spread:
                  type: boolean
                  description: When `true`, spreads messages evenly across the time period. Otherwise, it sends as fast as possible up to the limit in each period.
            examples:
              rateLimited:
                value:
                  rate_limit_email_rate: 1000
                  rate_limit_time_period: 3600
                  rate_limit_spread: true
      responses:
        '200':
          description: The newsletter is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  newsletter:
                    x-scalar-ignore: true
                    type: object
                    properties:
                      id:
                        x-scalar-ignore: true
                        description: The identifier for a newsletter.
                        type: integer
                        example: 10
                      deduplicate_id:
                        x-scalar-ignore: true
                        type: string
                        readOnly: true
                        description: An identifier in the format `id:timestamp` where the id is for the object you're working with (Campaigns, Deliveries, Exports, Identities, Newsletters, Segments, and Templates), and the timestamp is the last time the object was updated.
                        example: 15:1492548073
                      content_ids:
                        type: array
                        description: A list of message variants in a newsletter, where a variant is a translation or A/B test.
                        items:
                          type: integer
                      name:
                        type: string
                        description: The name of the newsletter. Must be 190 characters or less.
                        readOnly: true
                      sent_at:
                        type: integer
                        format: unix timestamp
                        description: The last time the newsletter was sent.
                      created:
                        x-scalar-ignore: true
                        type: integer
                        format: unix timestamp
                        description: The date time when the referenced ID was created.
                        example: 1552341937
                        readOnly: true
                      updated:
                        x-scalar-ignore: true
                        type: integer
                        format: unix timestamp
                        description: The date time when the referenced ID was last updated.
                        example: 1552341937
                        readOnly: true
                      type:
                        x-scalar-ignore: true
                        description: Channel type for a newsletter or newsletter content variant.
                        type: string
                        enum:
                        - email
                        - webhook
                        - twilio
                        - push
                        - in_app
                        - inbox
                        readOnly: true
                        example: email
                      tags:
                        type: array
                        description: An array of tags associated with the newsletter.
                        items:
                          type: string
                      recipient_segment_ids:
                        description: If the recipient conditions included segments, this returns a list of those segment ids.
                        type: array
                        items:
                          type: integer
                      subscription_topic_id:
                        type: integer
                        description: If you enabled a [subscription center](/journeys/channels/subscriptions/center/) on your workspace, this returns the id of the subscription preference you set.
