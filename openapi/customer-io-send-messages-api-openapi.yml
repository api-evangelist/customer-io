      oneOf:
      - title: and
        type: object
        properties:
          and:
            type: array
            description: Match *all* conditions to return results.
            items:
              $ref: '#/components/schemas/complexAudienceFilter'
      - title: or
        type: object
        properties:
          or:
            type: array
            description: Match *any* condition to return results.
            items:
              $ref: '#/components/schemas/complexAudienceFilter'
      - title: segment
        type: object
        properties:
          segment:
            $ref: '#/components/schemas/segmentAudienceFilter'
      - title: attribute
        type: object
        properties:
          attribute:
            $ref: '#/components/schemas/attributeAudienceFilter'
    notTriggerFilter:
      x-scalar-ignore: true
      title: not
      description: Returns people who don't match the condition inside it. `not` takes a single object, not an array. That object can be one condition, or an `and` or `or` group when you want to exclude people who match a combination of conditions.
      oneOf:
      - title: and
        type: object
        properties:
          and:
            type: array
            description: Match *all* conditions to return results.
            items:
              $ref: '#/components/schemas/complexTriggerFilter'
      - title: or
        type: object
        properties:
          or:
            type: array
            description: Match *any* condition to return results.
            items:
              $ref: '#/components/schemas/complexTriggerFilter'
      - $ref: '#/components/schemas/segmentTriggerCondition'
      - $ref: '#/components/schemas/attributeTriggerCondition'
      - $ref: '#/components/schemas/deviceAttributeTriggerCondition'
    andTriggerFilter:
      x-scalar-ignore: true
      title: and
      type: object
      properties:
        and:
          type: array
