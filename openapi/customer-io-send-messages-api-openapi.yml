            type: object
            properties:
              or:
                type: array
                description: Returns results matching *any* conditions.
                items:
                  $ref: '#/components/schemas/simpleTriggerFilter'
              not:
                $ref: '#/components/schemas/nestedNotTriggerFilter'
              segment:
