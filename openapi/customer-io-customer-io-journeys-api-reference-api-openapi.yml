openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer.io Journeys API Reference API
  description: Customer.io provides REST APIs to send real-time customer data, retrieve data from your account, and trigger messages.
servers:
- url: https://track.customer.io
  description: The base URL for the Track API. Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://track-eu.customer.io
  description: The base URL for the Track API (EU region). Track endpoints use basic authentication with your Site ID as the user name and your secret key as the password.
- url: https://api.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs. These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
- url: https://api-eu.customer.io
  description: The base URL for broadcasts, transactional messages, and data-retrieval APIs (EU region). These endpoints use bearer authorization, and require a [token that you generate in the UI](https://fly.customer.io/settings/api_credentials?keyType=app).
tags:
- name: Customer.io Journeys API Reference
paths: {}
webhooks:
  reportingWebhook:
    post:
      summary: Reporting webhook format
      description: Customer.io sends events to your webhook URL in the following format. Events are generally organized by `object_type`—representing the message or Customer.io action (i.e. `email`, `sms`, etc)—and the specific `metric` pertaining to the type (i.e. `sent`, `bounced`, etc).
      operationId: reportingWebhook
      security: []
      parameters:
      - name: x-cio-timestamp
        schema:
          type: integer
          format: unix timestamp
        description: The timestamp when the request was sent.
        in: header
        required: true
      - name: x-cio-signature
        in: header
        description: "A string combining your webhook signing key with the body of webhook request using an HMAC-SHA256 hash, used to help you [securely verify requests](/webhooks#securely-verifying-requests). \n"
        required: true
        schema:
          type: string
      responses: {}
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/customer_event'
              - $ref: '#/components/schemas/email_event'
              - $ref: '#/components/schemas/push_event'
              - $ref: '#/components/schemas/in_app_event'
              - $ref: '#/components/schemas/sms_event'
              - $ref: '#/components/schemas/slack_event'
              - $ref: '#/components/schemas/webhook_event'
              - $ref: '#/components/schemas/whatsapp_event'
            examples:
              customer_subscribed:
                summary: Customer subscribed event
                value:
                  metric: subscribed
                  event_id: 01E4C4CT6YDC7Y5M7FE1GWWPQJ
                  object_type: customer
                  timestamp: 1613063089
                  data:
                    customer_id: '0200000001'
                    email_address: test@example.com
                    identifiers:
                      id: '42'
                      email: test@example.com
                      cio_id: d9c106000001
              email_sent:
                summary: Email sent event
                value:
                  metric: sent
                  event_id: 01E4C4CT6YDC7Y5M7FE1GWWPQJ
                  object_type: email
                  timestamp: 1613063089
                  data:
                    action_id: 42
                    action_name: Welcome email
                    broadcast_id: 9
                    customer_id: '0200000001'
                    delivery_id: RPILAgUBcRhIBqSfeiIwdIYJKxTY
                    identifiers:
                      id: '42'
                      email: test@example.com
                      cio_id: d9c106000001
                    recipient: test@example.com
              sms_sent:
                summary: SMS sent event
                value:
                  metric: sent
                  event_id: 01E4C4CT6YDC7Y5M7FE1GWWPQJ
                  object_type: sms
                  timestamp: 1613063089
                  data:
                    action_id: 42
                    action_name: Welcome SMS
                    broadcast_id: 9
                    customer_id: '0200000001'
                    delivery_id: RPILAgUBcRhIBqSfeiIwdIYJKxTY
                    identifiers:
                      id: '42'
                      email: test@example.com
                      cio_id: d9c106000001
                    recipient: '+15551234567'
      tags:
      - Customer.io Journeys API Reference
components:
  schemas:
    action_id_webhook:
      x-scalar-ignore: true
      description: The identifier for an action.
      type: integer
      readOnly: true
      example: 96
    email_bounced:
      title: Email bounced
      allOf:
      - $ref: '#/components/schemas/email_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - bounced
            description: The delivery provider could not deliver an email.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/event_common_data'
            - type: object
              required:
              - recipient
              - subject
              - failure_message
              properties:
                subject:
                  type: string
                  description: The subject of the email.
                recipient:
                  $ref: '#/components/schemas/recipient_not_templated'
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    push_delivered:
      title: Push delivered
      allOf:
      - $ref: '#/components/schemas/push_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - delivered
            description: A push notification was delivered to a recipient device.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/event_common_data'
            - $ref: '#/components/schemas/push_meta_data'
            - type: object
              required:
              - recipients
              properties:
                recipients:
                  type: array
                  items:
                    type: object
                    required:
                    - device_id
                    description: Describes the device the push was sent to.
                    properties:
                      device_id:
                        type: string
                        description: The device identifier/token.
                      device_platform:
                        type: string
                        description: The device platform—ios or android.
                        enum:
                        - ios
                        - android
    whatsapp_failed:
      title: WhatsApp failed
      allOf:
      - $ref: '#/components/schemas/whatsapp_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - failed
            description: A WhatsApp message couldn't be sent to the delivery provider.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - failure_message
              properties:
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    sms_undeliverable:
      title: SMS undeliverable
      allOf:
      - $ref: '#/components/schemas/sms_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - undeliverable
            description: A message was undeliverable. Undeliverable messages are messages that have either hit a message limit, come from a one-time send that was cancelled or deleted, or an environment that has delivery disabled (which is something you might do if you’re testing an integration). If you’re not using message limits, you probably won’t see this event.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - failure_message
              properties:
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    failure_message:
      x-scalar-ignore: true
      type: string
      description: Indicates the reason that an attempted message failed.
      example: Something went wrong!
    parent_action_id:
      x-scalar-ignore: true
      type: integer
      description: The ID of the parent action, if the action occurred within an automation and has a parent (like a randomized split, etc).
      example: 1
      readOnly: true
    sms_drafted:
      title: SMS drafted
      allOf:
      - $ref: '#/components/schemas/sms_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - drafted
            description: An SMS notification was drafted.
          data:
            $ref: '#/components/schemas/other_event_common_data'
    email_unsubscribed:
      title: Email unsubscribed
      allOf:
      - $ref: '#/components/schemas/email_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - unsubscribed
            description: The recipient unsubscribed based on a particular message.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/event_common_data'
            - type: object
              required:
              - recipient
              - subject
              properties:
                subject:
                  type: string
                  description: The subject of the email.
                recipient:
                  $ref: '#/components/schemas/recipient_not_templated'
    email_undeliverable:
      title: Email undeliverable
      allOf:
      - $ref: '#/components/schemas/email_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - undeliverable
            description: A message was undeliverable. Undeliverable messages are messages that have either hit a message limit, come from a one-time send that was cancelled or deleted, or an environment that has delivery disabled (which is something you might do if you’re testing an integration). If you’re not using message limits, you probably won’t see this event.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/event_common_data'
            - type: object
              required:
              - recipient
              - subject
              - failure_message
              properties:
                subject:
                  type: string
                  description: The subject of the email.
                recipient:
                  $ref: '#/components/schemas/recipient_not_templated'
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    in_app_converted:
      title: In-app converted
      allOf:
      - $ref: '#/components/schemas/in_app_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - converted
            description: A person matched conversion criteria attributed to an in-app notification.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - recipient
              properties:
                recipient:
                  type: string
                  description: The ID or email address of the person the message was sent to. This identifier is determined by the settings in your message and the value you use to identify your app's users.
    whatsapp_event_common:
      x-scalar-ignore: true
      type: object
      required:
      - event_id
      - object_type
      - timestamp
      properties:
        event_id:
          $ref: '#/components/schemas/event_id'
        object_type:
          type: string
          enum:
          - whatsapp
          description: The event relates to a WhatsApp message.
        timestamp:
          $ref: '#/components/schemas/webhook_timestamp'
    whatsapp_event:
      x-scalar-ignore: true
      title: WhatsApp
      description: Events pertaining to WhatsApp messages.
      oneOf:
      - $ref: '#/components/schemas/whatsapp_drafted'
      - $ref: '#/components/schemas/whatsapp_attempted'
      - $ref: '#/components/schemas/whatsapp_sent'
      - $ref: '#/components/schemas/whatsapp_delivered'
      - $ref: '#/components/schemas/whatsapp_opened'
      - $ref: '#/components/schemas/whatsapp_clicked'
      - $ref: '#/components/schemas/whatsapp_converted'
      - $ref: '#/components/schemas/whatsapp_bounced'
      - $ref: '#/components/schemas/whatsapp_dropped'
      - $ref: '#/components/schemas/whatsapp_failed'
      - $ref: '#/components/schemas/whatsapp_undeliverable'
      - $ref: '#/components/schemas/whatsapp_replied'
      discriminator:
        propertyName: metric
    slack_sent:
      title: Slack sent
      allOf:
      - $ref: '#/components/schemas/slack_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - sent
            description: A slack message was sent. If you enabled the *Body Content* option with your webhook, the payload includes the `content` of your message.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - recipient
              properties:
                variables:
                  $ref: '#/components/schemas/variables_event'
                content:
                  type: string
                  description: The of your slack message. This key only appears if you enabled the *Body Content* option when setting up your webhook.
                recipient:
                  type: string
                  description: The channel or person that received the message, i.e. `#general`.
    push_meta_data:
      x-scalar-ignore: true
      type: object
      properties:
        app_id:
          type: integer
          description: The ID of the app that the push was sent to. Useful when your workspace has more than one app.
          example: 5
        related_delivery_ids:
          type: array
          items:
            type: string
          description: When a push matches multiple devices for a person, we create an individual delivery for each device. These are the IDs of the other deliveries created for the same push; the list doesn't include this event's own `delivery_id`.
    in_app_failed:
      title: In-app failed
      allOf:
      - $ref: '#/components/schemas/in_app_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - failed
            description: An in-app message failed to send.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - failure_message
              properties:
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    email_dropped:
      title: Email dropped
      allOf:
      - $ref: '#/components/schemas/email_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - dropped
            description: Customer.io did not send an email because it was addressed to a person who was suppressed.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/event_common_data'
            - type: object
              required:
              - recipient
              - subject
              - failure_message
              properties:
                subject:
                  type: string
                  description: The subject of the email.
                recipient:
                  $ref: '#/components/schemas/recipient_not_templated'
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    slack_clicked:
      title: Slack clicked
      allOf:
      - $ref: '#/components/schemas/slack_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - clicked
            description: A person clicked a tracked link in a Slack message.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - recipient
              - href
              - link_id
              properties:
                recipient:
                  type: string
                  description: The channel or person that received the message, i.e. `#general`.
                href:
                  $ref: '#/components/schemas/href'
                link_id:
                  $ref: '#/components/schemas/link_id'
    whatsapp_undeliverable:
      title: WhatsApp undeliverable
      allOf:
      - $ref: '#/components/schemas/whatsapp_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - undeliverable
            description: A message was undeliverable. Undeliverable messages are messages that have either hit a message limit, come from a one-time send that was cancelled or deleted, or an environment that has delivery disabled (which is something you might do if you're testing an integration). If you're not using message limits, you probably won't see this event.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - failure_message
              properties:
                failure_message:
                  $ref: '#/components/schemas/failure_message'
    webhook_timestamp:
      x-scalar-ignore: true
      type: integer
      format: unix timestamp
      description: The unix timestamp when the event occurred.
      example: 1613063089
    email_event:
      x-scalar-ignore: true
      title: Email
      description: Events representing an email.
      oneOf:
      - $ref: '#/components/schemas/email_drafted'
      - $ref: '#/components/schemas/email_attempted'
      - $ref: '#/components/schemas/email_sent'
      - $ref: '#/components/schemas/email_delivered'
      - $ref: '#/components/schemas/email_opened'
      - $ref: '#/components/schemas/email_clicked'
      - $ref: '#/components/schemas/email_converted'
      - $ref: '#/components/schemas/email_unsubscribed'
      - $ref: '#/components/schemas/email_bounced'
      - $ref: '#/components/schemas/email_dropped'
      - $ref: '#/components/schemas/email_spammed'
      - $ref: '#/components/schemas/email_failed'
      - $ref: '#/components/schemas/email_undeliverable'
      discriminator:
        propertyName: metric
    slack_event_common:
      x-scalar-ignore: true
      type: object
      required:
      - event_id
      - object_type
      - timestamp
      properties:
        event_id:
          $ref: '#/components/schemas/event_id'
        object_type:
          type: string
          enum:
          - slack
          description: The event relates to a Slack message.
        timestamp:
          $ref: '#/components/schemas/webhook_timestamp'
    other_event_common_data:
      x-scalar-ignore: true
      example:
        customer_id: user-123
        delivery_id: RPIyMTM6OjEyMzQ=
        action_id: 42
        action_name: Welcome SMS
        campaign_id: 7
        journey_id: 15
        identifiers:
          id: user-123
      oneOf:
      - title: API triggered broadcast
        required:
        - trigger_id
        - broadcast_id
        - delivery_id
        - action_id
        - identifiers
        type: object
        properties:
          trigger_id:
            $ref: '#/components/schemas/trigger_id'
          customer_id:
            $ref: '#/components/schemas/webhook_customer_id'
          delivery_id:
            $ref: '#/components/schemas/delivery_id'
          action_id:
            $ref: '#/components/schemas/action_id_webhook'
          action_name:
            type: string
            description: The current name of the workflow action identified by action_id, resolved when the event is processed. Omitted when the name isn't available, including when the action was deleted. For A/B splits, action_id is the selected variant sub-action, so action_name names that variant—the same value the legacy webhook's message_name carries. parent_action_id carries the split.
          broadcast_id:
            oneOf:
            - $ref: '#/components/schemas/broadcast_id'
            - type: 'null'
          journey_id:
            $ref: '#/components/schemas/journey_id'
          parent_action_id:
            $ref: '#/components/schemas/parent_action_id'
          identifiers:
            $ref: '#/components/schemas/webhook_identifiers'
          broadcast_name:
            type: string
            description: The name of the broadcast. Omitted when the name isn't available—for example, if the broadcast was deleted.
          broadcast_tags:
            type: array
            items:
              type: string
            description: The tags on the broadcast, as an array of tag names. Omitted when the broadcast has no tags or the tags aren't available.
          template_id:
            $ref: '#/components/schemas/template_id_event'
      - title: Campaign
        type: object
        required:
        - campaign_id
        - delivery_id
        - action_id
        - identifiers
        properties:
          campaign_id:
            oneOf:
            - $ref: '#/components/schemas/campaign_id'
            - type: 'null'
          customer_id:
            $ref: '#/components/schemas/webhook_customer_id'
          delivery_id:
            $ref: '#/components/schemas/delivery_id'
          action_id:
            $ref: '#/components/schemas/action_id_webhook'
          action_name:
            type: string
            description: The current name of the workflow action identified by action_id, resolved when the event is processed. Omitted when the name isn't available, including when the action was deleted. For A/B splits, action_id is the selected variant sub-action, so action_name names that variant—the same value the legacy webhook's message_name carries. parent_action_id carries the split.
          journey_id:
            $ref: '#/components/schemas/journey_id'
          identifiers:
            $ref: '#/components/schemas/webhook_identifiers'
          parent_action_id:
            $ref: '#/components/schemas/parent_action_id'
          trigger_event_id:
            $ref: '#/components/schemas/trigger_event_id'
          campaign_name:
            $ref: '#/components/schemas/campaign_name'
          campaign_tags:
            type: array
            items:
              type: string
            description: The tags on the automation, as an array of tag names. Omitted when the automation has no tags or the tags aren't available.
          template_id:
            $ref: '#/components/schemas/template_id_event'
      - title: Newsletter
        type: object
        required:
        - newsletter_id
        - delivery_id
        - identifiers
        properties:
          customer_id:
            $ref: '#/components/schemas/webhook_customer_id'
          delivery_id:
            $ref: '#/components/schemas/delivery_id'
          newsletter_id:
            oneOf:
            - $ref: '#/components/schemas/newsletter_id'
            - type: 'null'
          content_id:
            $ref: '#/components/schemas/content_id_event'
          identifiers:
            $ref: '#/components/schemas/webhook_identifiers'
          newsletter_name:
            type: string
            description: The name of the one-time send. Omitted when the name isn't available—for example, if the one-time send was deleted.
          newsletter_tags:
            type: array
            items:
              type: string
            description: The tags on the one-time send, as an array of tag names. Omitted when the one-time send has no tags or the tags aren't available.
          template_id:
            $ref: '#/components/schemas/template_id_event'
    whatsapp_converted:
      title: WhatsApp converted
      allOf:
      - $ref: '#/components/schemas/whatsapp_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - converted
            description: A person matched conversion criteria attributed to a WhatsApp message.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - recipient
              properties:
                recipient:
                  type: string
                  description: The phone number of the WhatsApp recipient.
    webhook_drafted:
      title: Webhook drafted
      allOf:
      - $ref: '#/components/schemas/webhook_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - drafted
            description: A webhook draft was created.
          data:
            $ref: '#/components/schemas/other_event_common_data'
    webhook_event_common:
      x-scalar-ignore: true
      type: object
      required:
      - event_id
      - object_type
      - timestamp
      properties:
        event_id:
          $ref: '#/components/schemas/event_id'
        object_type:
          type: string
          enum:
          - webhook
          description: The event relates to a webhook.
        timestamp:
          $ref: '#/components/schemas/webhook_timestamp'
    sms_bounced:
      title: SMS bounced
      allOf:
      - $ref: '#/components/schemas/sms_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
          metric:
            type: string
            enum:
            - bounced
            description: The delivery provider was unable to deliver an SMS message.
          data:
            description: Contains information about the event, specific to the `object_type` and `metric`.
            allOf:
            - $ref: '#/components/schemas/other_event_common_data'
            - type: object
              required:
              - recipient
              - failure_message
              properties:
                failure_message:
                  $ref: '#/components/schemas/failure_message'
                recipient:
                  type: string
                  description: The MSISDN (phone number) of the SMS recipient.
    recipient_not_templated:
      x-scalar-ignore: true
      description: The recipient address for an action.
      type: string
      example: test@example.com
    push_failed:
      title: Push failed
      allOf:
      - $ref: '#/components/schemas/push_event_common'
      - type: object
        required:
        - metric
        - data
        properties:
