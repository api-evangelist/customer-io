        - timestamp
        properties:
          event_id:
            x-scalar-ignore: true
            type: string
            description: The unique ID of the reporting webhook event being sent.
            example: 01E4C4CT6YDC7Y5M7FE1GWWPQJ
          object_type:
            type: string
            enum:
