- aid: customer-io:mcp
  name: Customer.io MCP
  description: >-
    Customer.io's first-party hosted Model Context Protocol server. It exposes the full Journeys App API
    and CDP Data Pipelines API to any MCP client through eight tools — a context primer, a schema browser,
    three verb-scoped HTTP proxies split so reads can be approved independently of writes and deletes,
    a two-tool skill library, and an auth-status probe. Authorization is OAuth 2.1 with PKCE and dynamic
    client registration, bound to the authorizing user's own Customer.io permissions.
  baseURL: https://mcp.customer.io/mcp
