description: Customer.io is a customer engagement platform that combines a customer
  data platform, marketing automation, and messaging delivery to send behavior-triggered
  email, push, SMS, and in-app messages. Its API surface includes the Track API for
  sending behavioral data and customer profile updates, the App API for managing workspace
  resources and sending transactional and broadcast messages, the Pipelines API which
  is a Segment-spec data ingestion interface, and outbound reporting webhooks that
  deliver message lifecycle events.

