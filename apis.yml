  description: >-
    The Customer.io Track API allows developers to send behavioral data and customer profile information
    into Customer.io. It provides endpoints for identifying customers, tracking events, managing devices
    for push notifications, and sending anonymous events. The API uses basic authentication with a Site
    ID and API key, and accepts JSON request bodies.
