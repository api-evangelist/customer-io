  sdk_changelog_published: true
  scheme: semver (per library)
  note: >-
    Customer.io publishes NO dated changelog for its REST APIs. There is no
    "API changelog", "release notes" or "what's new" page anywhere under
    docs.customer.io/integrations/api/, and the App API, Track API and
    Pipelines API specs all carry info.version 1.0.0 with no date. Every
    changelog Customer.io does publish belongs to a client library. That is the
    finding: the SDK layer is versioned in public and the API layer is not.
