  limit_text: For the App API, requests over the rate limit return a `429` response with a `Retry-After` header.
payload_limits:
- name: Pipelines API (single request)
  scope: request
  metric: bytes
  limit: 64 KB
  notes: Maximum size of a single identify/track/page/screen/group/alias call.
- name: Pipelines API (batch request)
  scope: request
  metric: bytes
  limit: 1 MB
  notes: Maximum size of a batch request.
note: 'Rewritten 2026-10-12 from the current docs: the Track API limit is now stated as 3,000 requests per 3 seconds (was recorded as 100/second). Pipelines payload size limits from the prior pass kept under payload_limits.'
