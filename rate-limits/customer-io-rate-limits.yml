description: Customer.io applies per-endpoint rate limits that differ by API surface. The Track (Behavioral Tracking) API has a fair-use limit of 100 requests per second for both live integrations and historical backfill, applying to v1 and v2. On the App API most requests are limited to 10 requests per second, with API-triggered broadcasts limited to 1 request every 10 seconds and transactional messages allowed up to 100 requests per second. The Pipelines / CDP API enforces payload-size limits of 64 KB per single request and 1 MB per batch request.
notes: Limits captured from Customer.io API reference documentation and are subject to change; verify the current published limits during reconciliation. Exceeding limits returns HTTP 429.
sources:
- https://docs.customer.io/integrations/api/track/
- https://docs.customer.io/integrations/api/app/
- https://docs.customer.io/integrations/api/cdp/
responseCodes:
  throttled: 429
headers:
  published: false
  request: []
  response: []
  retry_after: false
  evidence: Checked 2026-08-13 against all four published OpenAPI documents and the API overview documentation. No X-RateLimit-*, no RateLimit-*, no Retry-After — the 429 responses in journeys-app.json carry no schema and no headers block at all, on 116 of 166 operations. A client cannot read its remaining budget or a recommended wait; it can only observe rejection and back off blind.
  impact: This is the single largest runtime-semantics gap in the Customer.io surface. The limits are published as prose in the docs but are invisible at runtime, which is exactly backwards for an agent.
limits:
- name: Track and Pipelines APIs
  scope: account
  limit_text: 3,000 requests per 3 seconds. This is a soft limit.
  max: 3000
  window: 3 seconds
  kind: soft
  note: Not strictly enforced; exceeding it does not return a 429.
- name: App API
  scope: account
  limit_text: 10 requests per second.
  max: 10
  window: 1 second
  limit: 10
  status_on_exhaustion: 429
  headers:
  - Retry-After
- name: Transactional messages
  scope: account
  limit_text: Transactional sends go through the same ingress as the Track and Pipelines APIs and share their soft limit.
  max: 3000
  window: 3 seconds
  kind: soft
  endpoint: /integrations/api/app/tag/send-messages/
- name: API-triggered broadcasts
  scope: account
  limit_text: 1 request every 10 seconds.
  max: 1
  window: 10 seconds
  endpoint: triggerBroadcast
  status_on_exhaustion: 429
  headers:
  - Retry-After
policies:
- name: Per-Endpoint Limits
  description: Limits are enforced per endpoint category rather than a single global account limit.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on HTTP 429 responses.
