vocabulary:
  name: Customer.io Vocabulary
  description: Controlled vocabulary describing the core concepts of the Customer.io APIs (Track, App, and Pipelines), including people/customers, events, devices, segments, broadcasts, campaigns, newsletters, transactional messages, and reporting webhooks.
  terms:
  - term: Customer
    definition: A person identified inside Customer.io with a stable id, traits, and timestamps.
  - term: Event
    definition: A behavioral event tracked against a customer, with name, timestamp, and data payload.
  - term: Device
    definition: A push-capable device (iOS or Android) registered against a customer.
  - term: Segment
    definition: A static or dynamic group of customers used for targeting messages and campaigns.
  - term: Campaign
    definition: A multi-step, trigger-based automated message workflow.
  - term: Broadcast
    definition: A one-time message sent to a static or filtered audience.
  - term: Newsletter
    definition: A scheduled email sent to a defined audience.
  - term: TransactionalMessage
    definition: A message triggered by an application event and sent to an individual customer.
  - term: Workspace
    definition: An isolated Customer.io environment containing customers, events, and configuration.
  - term: ReportingWebhook
    definition: An outbound webhook that delivers message lifecycle events (delivered, opened, clicked, bounced, etc.).
  - term: PipelinesCall
    definition: A Segment-spec data ingestion call - identify, track, page, screen, group, or alias.
