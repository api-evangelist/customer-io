name: Customer.io Documentation
description: >-
  Customer.io serves an A2A Agent Card from its documentation host. The card
  describes a documentation-retrieval agent surface — search the docs, and fetch
  any page as clean Markdown via Accept: text/markdown content negotiation or by
  appending .md to the path — not the Customer.io product API. The product API
  agent surface is the MCP server at https://mcp.customer.io/mcp, captured in
  mcp/customer-io-mcp.yml.
