grade: flavored
grade_rubric: A2A 1.0.0
grade_detail: >-
  Two of the three hard checks pass — capabilities is an object and skills is an
  array — but the card omits the top-level protocolVersion, which A2A 1.0.0
  requires on every AgentCard. It also omits the top-level url, expressing the
  endpoint through a supportedInterfaces[] array instead. A client that reads
  the specification literally cannot determine which protocol revision this card
  claims, so it grades flavored rather than near-conformant.
hard_checks:
- check: capabilities is an object
  pass: true
  observed: '{"streaming": false, "pushNotifications": false}'
- check: protocolVersion present at the top level
  pass: false
  observed: >-
    absent at the top level; "protocolVersion": "1.0" appears only inside
    supportedInterfaces[0]
- check: skills is an array
  pass: true
  observed: 2 skills
deviations:
- field: protocolVersion
  issue: missing at the top level
  impact: >-
    A consumer cannot tell which A2A revision the card targets without inferring
    it from supportedInterfaces[0].protocolVersion.
- field: url
  issue: absent; replaced by supportedInterfaces[]
  impact: >-
    Pre-1.0 A2A clients look for a top-level url and will find no endpoint. The
    interface is reachable at https://docs.customer.io/ per
    supportedInterfaces[0].url.
- field: preferredTransport
  issue: not declared
  impact: Optional in 1.0.0; transport is implied by protocolBinding HTTP+JSON.
