provider: Customer.io
providerId: customer-io
name: Customer.io MCP
status: production
description: >-
  Customer.io operates a first-party, hosted Model Context Protocol server that
  exposes the full Journeys App API and the CDP Data Pipelines API to any MCP
  client. It is a remote HTTP endpoint an agent POSTs to — no local install —
  authorized with OAuth 2.1 (dynamic client registration, PKCE S256) against
  the user's own Customer.io login, so a connection can never exceed the
  permissions of the human who created it.
deployment:
  mode: remote
  endpoint: https://mcp.customer.io/mcp
  endpoints:
  - region: US
    url: https://mcp.customer.io/mcp
  - region: EU
    url: https://mcp-eu.customer.io/mcp
  auth: oauth
  verified: probed
docs: https://docs.customer.io/ai/mcp/get-started/
client_guides:
- client: ChatGPT
  url: https://docs.customer.io/ai/mcp/chatgpt/
- client: Claude
  url: https://docs.customer.io/ai/mcp/claude/
- client: Cursor and other IDEs
  url: https://docs.customer.io/ai/mcp/ide/
authorization:
  protocol: OAuth 2.1
  authorization_server: https://mcp.customer.io
  authorization_endpoint: https://mcp.customer.io/oauth2/authorize
  token_endpoint: https://mcp.customer.io/oauth2/token
  registration_endpoint: https://mcp.customer.io/oauth2/register
  revocation_endpoint: https://mcp.customer.io/oauth2/revoke
  grant_types:
  - authorization_code
  - refresh_token
  code_challenge_methods:
