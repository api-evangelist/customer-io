provider: Customer.io
providerId: customer-io
summary: >-
  Customer.io's MCP server does NOT expose one tool per API operation. It
  exposes a verb-scoped HTTP proxy — three tools split by HTTP method
  (cio_read_api / cio_write_api / cio_delete_api) plus a schema-discovery tool
  (cio_schema) that the agent calls first to learn the operation it wants. The
  crosswalk below is therefore a many-to-one binding: each proxy tool covers
  every operation of its verb across the App, Track and Pipelines specs. This is
  a deliberate design — it keeps the tool list small enough to stay in an
  agent's context while still reaching 191 operations, and it lets an MCP client
  approve reads independently of writes.
