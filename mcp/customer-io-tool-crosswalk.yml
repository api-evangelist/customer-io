mcp_only:
- tool: cio_prime
  reason: >-
    Loads Customer.io's AI-ready API reference into the agent's context. No REST
    operation backs it; it is a context-priming document served by the MCP
    server.
- tool: cio_skills_list
  reason: >-
    Lists Customer.io-maintained agent skills. Served by the MCP server, not by
    the public REST API.
- tool: cio_skills_read
  reason: >-
    Returns the body of one agent skill. Served by the MCP server, not by the
    public REST API.
- tool: cio_auth_status
  reason: >-
    Reports the OAuth session state and reachable workspaces. The nearest REST
    analogue, GET /v1/workspaces (listWorkspaces), returns workspaces but not
    session or scope state.
