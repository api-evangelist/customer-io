event_model:
  description: >-
    Reporting webhook events are the read side of the delivery graph. Eight
    object_type families — customer, email, sms, whatsapp, push, in_app, slack,
    webhook — each with a metric enum (drafted, attempted, sent, delivered,
    opened, clicked, converted, bounced, dropped, spammed, failed,
    undeliverable, unsubscribed, replied). Every event carries event_id,
    object_type, metric, timestamp and a data object holding the foreign keys
    above.
