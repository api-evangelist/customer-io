arazzo: 1.0.1
info:
  title: 'Customer.io Jotform: add Jotform submitters to a Customer.io workspace'
  summary: Reads submissions for a Jotform form and identifies the submitter as a
    person in Customer.
  description: Reads submissions for a Jotform form and identifies the submitter as
    a person in Customer.io. Mirrors the Zapier template "Add new Jotform customers
    to a Customer.io workspace".
  version: 1.0.0
sourceDescriptions:
- name: jotformForm
  url: https://raw.githubusercontent.com/api-evangelist/jotform/refs/heads/main/openapi/jotform-form-api-openapi.yml
  type: openapi
- name: customerIoTrackCustomers
  url: https://raw.githubusercontent.com/api-evangelist/customer-io/refs/heads/main/openapi/customer-io-track-customers-api-openapi.yml
  type: openapi
workflows:
- workflowId: jotform-submissions-to-people
  summary: 'Customer.io Jotform: add Jotform submitters to a Customer.io workspace'
  description: Reads submissions for a Jotform form and identifies the submitter as
    a person in Customer.io. Mirrors the Zapier template "Add new Jotform customers
    to a Customer.io workspace".
  inputs:
    type: object
    properties:
      form_id:
        type: string
      email:
        type: string
        description: Submitter email taken from the chosen submission answer.
  steps:
  - stepId: list-submissions
    description: List submissions for the form.
    operationId: $sourceDescriptions.jotformForm.getFormSubmissions
    parameters:
    - name: formID
      in: path
      value: $inputs.form_id
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      submissions: $response.body#/content
  - stepId: identify-person
    description: Create or update the person in Customer.io (Track API identify).
    operationId: $sourceDescriptions.customerIoTrackCustomers.identify
    parameters:
    - name: identifier
      in: path
      value: $inputs.email
    requestBody:
      contentType: application/json
      payload:
        email: $inputs.email
        jotform_form_id: $inputs.form_id
    successCriteria:
    - condition: $statusCode == 200
  outputs:
    submissions: $steps.list-submissions.outputs.submissions
x-integration:
  partner: jotform
  edge_evidence: https://zapier.com/apps/customerio/integrations
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: enrichment pipeline local-v5 (provider-integrations-arazzo)
  guessed_steps:
  - step: list-submissions
    cause: partner-contract
    why: Jotform getFormSubmissions declares no 200 response schema, so the /content
      path and which answer holds the email are not settled by the spec.
